<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 300" width="240" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="second-chance-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#e0552a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7a2408" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="second-chance-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="second-chance-wood" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#d49a5e"/>
      <stop offset="0.4" stop-color="#9a5e2e"/>
      <stop offset="0.75" stop-color="#5e3418"/>
      <stop offset="1" stop-color="#2e1608"/>
    </linearGradient>
    <linearGradient id="second-chance-ember" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="170">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="1"/>
      <stop offset="0.1" stop-color="#ffc372" stop-opacity="1"/>
      <stop offset="0.26" stop-color="#ff7a45" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#b8361a" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#5a1708" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3a0e04" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="second-chance-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c0"/>
      <stop offset="0.35" stop-color="#ffb066"/>
      <stop offset="0.75" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#b8361a"/>
    </linearGradient>
    <radialGradient id="second-chance-ocellus" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.35" stop-color="#ffc372"/>
      <stop offset="0.8" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#a8301a"/>
    </radialGradient>
    <linearGradient id="second-chance-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.45" stop-color="#e6b54a"/>
      <stop offset="1" stop-color="#7a5414"/>
    </linearGradient>
    <linearGradient id="second-chance-stone" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7d7466"/>
      <stop offset="0.5" stop-color="#4c463d"/>
      <stop offset="1" stop-color="#211d18"/>
    </linearGradient>
    <filter id="second-chance-blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="second-chance-blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="second-chance-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="second-chance-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.35" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0 0.02  -2.6 0 0 0 1.45" result="d"/>
      <feComposite in="d" in2="SourceAlpha" operator="in"/>
    </filter>
    <path id="second-chance-vane" d="M118,230 C100,222 84,206 79,186 L95,182 C84,172 76,158 75,142 C74,128 76,118 80,108 L94,112 C86,98 86,82 92,68 C100,50 116,32 138,18 C146,34 154,52 160,72 C166,92 168,110 164,126 L150,126 C160,142 160,160 154,174 L142,176 C146,192 136,214 124,230 Z"/>
    <g id="second-chance-body">
      <use xlink:href="#second-chance-vane"/>
      <path d="M114,226 L126,226 L126,250 L114,250 Z"/>
      <path d="M90,250 L150,250 Q156,250 158,256 L162,270 Q162,277 154,277 L86,277 Q78,277 78,270 L82,256 Q84,250 90,250 Z"/>
    </g>
    <clipPath id="second-chance-vclip"><use xlink:href="#second-chance-vane"/></clipPath>
    <mask id="second-chance-rim" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="300">
      <use xlink:href="#second-chance-body" fill="#fff"/>
      <use xlink:href="#second-chance-body" fill="#000" transform="translate(-4,2)"/>
    </mask>
    <mask id="second-chance-hi" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="300">
      <use xlink:href="#second-chance-body" fill="#fff"/>
      <use xlink:href="#second-chance-body" fill="#000" transform="translate(5,5)"/>
    </mask>
  </defs>

  <!-- aura -->
  <ellipse cx="120" cy="140" rx="112" ry="132" fill="url(#second-chance-aura)"/>
  <ellipse cx="134" cy="62" rx="34" ry="34" fill="#ff7a45" opacity="0.5" filter="url(#second-chance-blur10)"/>
  <!-- contact shadow -->
  <ellipse cx="120" cy="280" rx="72" ry="10" fill="url(#second-chance-shadow)"/>

  <!-- outline + base fill -->
  <use xlink:href="#second-chance-body" fill="#120c06" stroke="#120c06" stroke-width="7" stroke-linejoin="round"/>
  <use xlink:href="#second-chance-body" fill="url(#second-chance-wood)"/>

  <!-- vane: barbs + split shading (clipped) -->
  <g clip-path="url(#second-chance-vclip)">
    <!-- right half darker -->
    <path d="M120,232 C118,180 118,140 124,96 C128,64 134,40 140,14 L180,14 L180,240 Z" fill="#2a1207" opacity="0.38"/>
    <g fill="none" stroke-linecap="round">
      <g stroke="#2a1207" stroke-width="2.2" opacity="0.85">
        <path d="M117,216 Q100,206 82,196"/><path d="M117,202 Q98,190 80,176"/><path d="M117,186 Q98,174 78,158"/>
        <path d="M117,170 Q98,158 76,140"/><path d="M117,154 Q98,140 78,122"/><path d="M118,138 Q100,122 84,104"/>
        <path d="M119,122 Q102,106 88,86"/><path d="M121,106 Q106,88 96,66"/><path d="M124,90 Q112,70 106,50"/>
        <path d="M119,212 Q136,200 150,182"/><path d="M119,196 Q138,182 154,164"/><path d="M119,180 Q140,166 160,146"/>
        <path d="M119,164 Q142,150 166,128"/><path d="M120,148 Q144,132 168,110"/><path d="M121,132 Q146,114 168,92"/>
        <path d="M122,116 Q146,96 164,72"/><path d="M124,100 Q144,80 158,56"/><path d="M127,84 Q142,64 152,42"/>
      </g>
      <g stroke="#f0b878" stroke-width="1.1" opacity="0.55">
        <path d="M117,219 Q100,209 82,199"/><path d="M117,205 Q98,193 80,179"/><path d="M117,189 Q98,177 78,161"/>
        <path d="M117,173 Q98,161 76,143"/><path d="M117,157 Q98,143 78,125"/><path d="M118,141 Q100,125 84,107"/>
        <path d="M119,125 Q102,109 88,89"/>
      </g>
    </g>
    <!-- ember overlay on upper feather -->
    <rect x="60" y="10" width="130" height="180" fill="url(#second-chance-ember)"/>
    <!-- glowing crackle near tip -->
    <g fill="none" stroke-linecap="round" stroke="#ffe3a3" stroke-width="1.4" opacity="0.95">
      <path d="M124,90 Q112,70 106,50"/><path d="M127,84 Q142,64 152,42"/><path d="M122,116 Q146,96 164,72"/>
      <path d="M121,106 Q106,88 96,66"/><path d="M131,62 Q124,46 120,36"/><path d="M132,60 Q142,46 146,32"/>
    </g>
  </g>
  <!-- grain -->
  <use xlink:href="#second-chance-body" fill="#000" filter="url(#second-chance-grain)" opacity="0.55"/>

  <!-- rachis (quill) with gold inlay -->
  <path d="M120,252 C120,222 117,186 117,150 C117,112 122,72 136,22" fill="none" stroke="#120c06" stroke-width="7" stroke-linecap="round"/>
  <path d="M120,252 C120,222 117,186 117,150 C117,112 122,72 136,22" fill="none" stroke="url(#second-chance-gold)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M119,240 C119,214 116,186 116,150 C116,120 119,96 124,76" fill="none" stroke="#fff4c8" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  <path d="M124,80 C127,60 131,40 136,22" fill="none" stroke="#fff6cf" stroke-width="2.4" stroke-linecap="round"/>
  <!-- ember notches on rachis -->
  <circle cx="117" cy="150" r="3.4" fill="#ff7a45" stroke="#120c06" stroke-width="1.5"/>
  <circle cx="117.5" cy="186" r="2.6" fill="#ff7a45" stroke="#120c06" stroke-width="1.4"/>
  

  <!-- carved flame-drop inlay -->
  <path d="M121,74 C128,86 134,94 133,104 C132,112 126,117 120,117 C113,117 108,111 109,103 C110,94 117,88 121,74 Z" fill="#2a1207" stroke="#120c06" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M121,80 C127,90 130,97 129,104 C128,110 124,113 120,113 C115,113 112,109 113,103 C114,96 119,91 121,80 Z" fill="url(#second-chance-ocellus)"/>
  <path d="M121,92 C124,98 125,102 124,106 C123,109 121,110 120,110 C118,110 116,108 117,105 C117,101 120,98 121,92 Z" fill="#fffbe8"/>
  <!-- quill wrap where it meets base -->
  <g stroke="#120c06" stroke-width="1.6">
    <rect x="111" y="228" width="18" height="6" rx="2" fill="#c47a3a"/>
    <rect x="111" y="236" width="18" height="6" rx="2" fill="#a0602c"/>
    <rect x="111" y="244" width="18" height="6" rx="2" fill="#7c4720"/>
  </g>

  <!-- stone base -->
  <path d="M90,250 L150,250 Q156,250 158,256 L162,270 Q162,277 154,277 L86,277 Q78,277 78,270 L82,256 Q84,250 90,250 Z" fill="url(#second-chance-stone)"/>
  <path d="M90,252 L150,252 Q155,252 156,256 L84,256 Q85,252 90,252 Z" fill="#a39886" opacity="0.8"/>
  <path d="M82,264 L158,264" stroke="#120c06" stroke-width="2.4"/>
  <path d="M84,266 L156,266" stroke="#ff7a45" stroke-width="1.4" opacity="0.9"/>
  <g fill="#1a120c" stroke="#120c06" stroke-width="1">
    <path d="M92,268 L98,274 L104,268 Z"/><path d="M108,268 L114,274 L120,268 Z"/><path d="M124,268 L130,274 L136,268 Z"/><path d="M140,268 L146,274 L152,268 Z"/>
  </g>
  <ellipse cx="120" cy="252" rx="13" ry="3.4" fill="#120c06" opacity="0.7"/>

  <!-- lighting -->
  <rect x="0" y="0" width="240" height="300" fill="#ffd9a8" opacity="0.3" mask="url(#second-chance-hi)"/>
  <rect x="0" y="0" width="240" height="300" fill="#ffb27a" opacity="0.6" mask="url(#second-chance-rim)"/>

  <!-- tip flame glow + sparks -->
  <ellipse cx="137" cy="24" rx="9" ry="12" fill="#ffd28a" opacity="0.9" filter="url(#second-chance-blur4)"/>
  <path d="M138,26 C130,20 130,12 134,6 C135,10 138,10 139,4 C144,10 146,20 138,26 Z" fill="url(#second-chance-flame)" opacity="0.95"/>
  <path d="M138,24 C134,20 134,16 137,12 C139,16 141,20 138,24 Z" fill="#fffbe8"/>
  <g fill="#ffc372">
    <circle cx="150" cy="12" r="2.2"/><circle cx="124" cy="10" r="1.6"/><circle cx="160" cy="30" r="1.5"/>
    <circle cx="114" cy="26" r="1.3"/><circle cx="146" cy="4" r="1.1"/>
  </g>
  <g fill="#ff7a45" opacity="0.8" filter="url(#second-chance-blur1)">
    <circle cx="150" cy="12" r="4"/><circle cx="124" cy="10" r="3"/><circle cx="160" cy="30" r="3"/>
  </g>
</svg>
