<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 300" width="240" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="idol-nullifier-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#84cc16" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#65a30d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#365314" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="idol-nullifier-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="idol-nullifier-obsidian" gradientUnits="userSpaceOnUse" x1="40" y1="30" x2="200" y2="262">
      <stop offset="0" stop-color="#5d6473"/>
      <stop offset="0.3" stop-color="#2b3039"/>
      <stop offset="0.7" stop-color="#14161b"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <linearGradient id="idol-nullifier-obs-raised" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7383"/>
      <stop offset="1" stop-color="#1f232b"/>
    </linearGradient>
    <linearGradient id="idol-nullifier-bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbef"/>
      <stop offset="0.35" stop-color="#ecdfc0"/>
      <stop offset="0.75" stop-color="#bba57a"/>
      <stop offset="1" stop-color="#7b6644"/>
    </linearGradient>
    <radialGradient id="idol-nullifier-eye" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f7ffe0"/>
      <stop offset="0.35" stop-color="#d9f99d"/>
      <stop offset="0.8" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#3f6212"/>
    </radialGradient>
    <filter id="idol-nullifier-blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="idol-nullifier-blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="idol-nullifier-blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="idol-nullifier-speck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="21" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.6  0 0 0 0 0.68  3.2 0 0 0 -1.9" result="d"/>
      <feComposite in="d" in2="SourceAlpha" operator="in"/>
    </filter>
    <!-- bust silhouette -->
    <g id="idol-nullifier-sil">
      <path d="M80,50 L92,26 L108,40 L120,20 L132,40 L148,26 L160,50 L164,122 Q162,146 140,152 L100,152 Q78,146 76,122 Z"/>
      <path d="M100,146 L140,146 L142,176 L98,176 Z"/>
      <path d="M62,176 Q120,160 178,176 Q198,184 200,206 L202,262 L38,262 L40,206 Q42,184 62,176 Z"/>
    </g>
    <mask id="idol-nullifier-hi" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="300">
      <use xlink:href="#idol-nullifier-sil" fill="#fff"/>
      <use xlink:href="#idol-nullifier-sil" fill="#000" transform="translate(5,5)"/>
    </mask>
    <mask id="idol-nullifier-rim" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="300">
      <use xlink:href="#idol-nullifier-sil" fill="#fff"/>
      <use xlink:href="#idol-nullifier-sil" fill="#000" transform="translate(-5,1)"/>
    </mask>
    <clipPath id="idol-nullifier-left"><path d="M0,0 L121,0 L121,20 L116,48 L125,70 L114,96 L124,118 L117,140 L126,166 L115,196 L125,222 L118,248 L122,300 L0,300 Z"/></clipPath>
    <clipPath id="idol-nullifier-right"><path d="M240,0 L121,0 L121,20 L116,48 L125,70 L114,96 L124,118 L117,140 L126,166 L115,196 L125,222 L118,248 L122,300 L240,300 Z"/></clipPath>
    <!-- carved bust (painted) -->
    <g id="idol-nullifier-bust">
      <use xlink:href="#idol-nullifier-sil" fill="#0a0b0d" stroke="#0a0b0d" stroke-width="7" stroke-linejoin="round"/>
      <use xlink:href="#idol-nullifier-sil" fill="url(#idol-nullifier-obsidian)"/>
      <use xlink:href="#idol-nullifier-sil" fill="#000" filter="url(#idol-nullifier-speck)" opacity="0.35"/>
      <!-- glassy facets -->
      <path d="M84,52 L94,32 L106,44 L96,70 Z" fill="#c6cfdd" opacity="0.28"/>
      <path d="M80,60 L86,118 Q88,132 96,140" stroke="#dfe6f0" stroke-width="2.2" fill="none" opacity="0.55" stroke-linecap="round"/>
      <path d="M48,206 Q52,186 72,180" stroke="#dfe6f0" stroke-width="2.4" fill="none" opacity="0.5" stroke-linecap="round"/>
      <path d="M46,214 Q60,206 74,214 Q62,220 48,232" stroke="#8892a3" stroke-width="1.2" fill="none" opacity="0.6"/>
      <path d="M160,190 Q176,198 184,222" stroke="#8892a3" stroke-width="1.2" fill="none" opacity="0.5"/>
      <!-- headband -->
      <path d="M79,58 L161,58 L162,70 L78,70 Z" fill="#0d0f12" stroke="#0a0b0d" stroke-width="2"/>
      <path d="M86,64 L94,64 M102,64 L110,64 M130,64 L138,64 M146,64 L154,64" stroke="#84cc16" stroke-width="2.4" stroke-linecap="round"/>
      <!-- brow -->
      <path d="M80,80 Q100,70 118,82 L122,82 Q140,70 160,80 L160,90 Q140,82 122,92 L118,92 Q100,82 80,90 Z" fill="url(#idol-nullifier-obs-raised)" stroke="#0a0b0d" stroke-width="2" stroke-linejoin="round"/>
      <!-- eyes -->
      <path d="M86,96 L112,96 L108,108 L90,108 Z" fill="#050607"/>
      <path d="M154,96 L128,96 L132,108 L150,108 Z" fill="#050607"/>
      <path d="M89,98 L109,98 L106,106 L92,106 Z" fill="#84cc16" filter="url(#idol-nullifier-blur2)"/>
      <path d="M151,98 L131,98 L134,106 L148,106 Z" fill="#84cc16" filter="url(#idol-nullifier-blur2)"/>
      <path d="M92,99.5 L106,99.5 L104,104.5 L94,104.5 Z" fill="url(#idol-nullifier-eye)"/>
      <path d="M148,99.5 L134,99.5 L136,104.5 L146,104.5 Z" fill="url(#idol-nullifier-eye)"/>
      <!-- nose -->
      <path d="M114,92 L126,92 L130,120 Q120,125 110,120 Z" fill="url(#idol-nullifier-obs-raised)" stroke="#0a0b0d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M115,95 L112,118" stroke="#c6cfdd" stroke-width="1.2" opacity="0.6"/>
      <!-- mouth -->
      <path d="M92,128 L148,128 L144,142 L96,142 Z" fill="#050607" stroke="#0a0b0d" stroke-width="2"/>
      <path d="M100,128 L104,136 L108,128 M132,128 L136,136 L140,128" fill="#cfd5df" stroke="#0a0b0d" stroke-width="1"/>
      <path d="M96,135 L144,135" stroke="#84cc16" stroke-width="1.4" opacity="0.7"/>
      <!-- chest carving -->
      <path d="M66,196 Q120,184 174,196" stroke="#050607" stroke-width="3" fill="none"/>
      <path d="M66,199 Q120,187 174,199" stroke="#5d6473" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M44,252 L196,252" stroke="#050607" stroke-width="3"/>
      <!-- edge lighting -->
      <rect x="0" y="0" width="240" height="300" fill="#a9b4c8" opacity="0.55" mask="url(#idol-nullifier-hi)"/>
      <rect x="0" y="0" width="240" height="300" fill="#bef264" opacity="0.8" mask="url(#idol-nullifier-rim)"/>
    </g>
  </defs>

  <!-- aura -->
  <ellipse cx="120" cy="148" rx="114" ry="130" fill="url(#idol-nullifier-aura)"/>
  <!-- contact shadow -->
  <ellipse cx="120" cy="270" rx="94" ry="10" fill="url(#idol-nullifier-shadow)"/>

  <!-- light leaking from the split -->
  <path d="M121,34 L116,48 L125,70 L114,96 L124,118 L117,140 L126,166 L115,196 L125,222 L118,248 L120,256" stroke="#84cc16" stroke-width="22" fill="none" opacity="0.7" filter="url(#idol-nullifier-blur10)" stroke-linejoin="round"/>
  <path d="M121,20 L116,48 L125,70 L114,96 L124,118 L117,140 L126,166 L115,196 L125,222 L118,248 L121,260" stroke="#a3e635" stroke-width="9" fill="none" filter="url(#idol-nullifier-blur2)" stroke-linejoin="round"/>
  <path d="M121,22 L116,48 L125,70 L114,96 L124,118 L117,140 L126,166 L115,196 L125,222 L118,248 L122,262" stroke="#f7ffe0" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- split halves -->
  <g transform="translate(-6,2) rotate(-3 120 262)">
    <g clip-path="url(#idol-nullifier-left)"><use xlink:href="#idol-nullifier-bust"/></g>
    <path d="M121,20 L116,48 L125,70 L114,96 L124,118 L117,140 L126,166 L115,196 L125,222 L118,248 L122,262" stroke="#0a0b0d" stroke-width="3" fill="none" clip-path="url(#idol-nullifier-left)"/>
  </g>
  <g transform="translate(6,0) rotate(3 120 262)">
    <g clip-path="url(#idol-nullifier-right)"><use xlink:href="#idol-nullifier-bust"/></g>
    <path d="M121,20 L116,48 L125,70 L114,96 L124,118 L117,140 L126,166 L115,196 L125,222 L118,248 L122,262" stroke="#0a0b0d" stroke-width="3" fill="none" clip-path="url(#idol-nullifier-right)"/>
    <path d="M121,22 L116,48 L125,70 L114,96 L124,118 L117,140 L126,166 L115,196 L125,222" stroke="#bef264" stroke-width="1.6" fill="none" opacity="0.8" clip-path="url(#idol-nullifier-right)" transform="translate(2,0)"/>
  </g>
  <!-- flying chips -->
  <path d="M112,12 L118,6 L120,14 Z" fill="#2b3039" stroke="#0a0b0d" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M128,8 L134,4 L134,12 Z" fill="#3a404b" stroke="#0a0b0d" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- crossed bone shards -->
  <g id="idol-nullifier-shards">
    <g transform="translate(46,252) rotate(-45) scale(1,1.35)">
      <path d="M2,-13 Q-8,-17 -11,-8 Q-15,0 -11,8 Q-8,17 2,13 Q10,10 18,7 L108,6 L132,4 L140,10 L146,2 L162,5 L196,0 L158,-6 L150,-3 L140,-9 L130,-5 L18,-7 Q10,-10 2,-13 Z" fill="#120c06" stroke="#120c06" stroke-width="6" stroke-linejoin="round"/>
      <path d="M2,-13 Q-8,-17 -11,-8 Q-15,0 -11,8 Q-8,17 2,13 Q10,10 18,7 L108,6 L132,4 L140,10 L146,2 L162,5 L196,0 L158,-6 L150,-3 L140,-9 L130,-5 L18,-7 Q10,-10 2,-13 Z" fill="url(#idol-nullifier-bone)"/>
      <path d="M0,-10 Q-8,-12 -9,-5 M18,-4 L128,-3" stroke="#fffdf6" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-3,0 Q2,-2 6,0 Q2,2 -3,0" fill="#7b6644"/>
      <path d="M40,2 L70,3 M86,-1 L100,1 L112,-2 M146,0 L170,1" stroke="#8a7550" stroke-width="1.2" fill="none"/>
    </g>
    <g transform="translate(194,252) rotate(-135) scale(1,-1.35)">
      <path d="M2,-13 Q-8,-17 -11,-8 Q-15,0 -11,8 Q-8,17 2,13 Q10,10 18,7 L108,6 L130,8 L136,2 L150,4 L196,-1 L160,-6 L148,-2 L138,-8 L126,-5 L18,-7 Q10,-10 2,-13 Z" fill="#120c06" stroke="#120c06" stroke-width="6" stroke-linejoin="round"/>
      <path d="M2,-13 Q-8,-17 -11,-8 Q-15,0 -11,8 Q-8,17 2,13 Q10,10 18,7 L108,6 L130,8 L136,2 L150,4 L196,-1 L160,-6 L148,-2 L138,-8 L126,-5 L18,-7 Q10,-10 2,-13 Z" fill="url(#idol-nullifier-bone)"/>
      <path d="M0,-10 Q-8,-12 -9,-5 M18,-4 L124,-3" stroke="#fffdf6" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-3,0 Q2,-2 6,0 Q2,2 -3,0" fill="#7b6644"/>
      <path d="M36,1 L62,3 M80,-2 L96,0 M150,0 L172,0" stroke="#8a7550" stroke-width="1.2" fill="none"/>
    </g>
  </g>
  <!-- cord binding at the cross with jade bead -->
  <g>
    <path d="M108,172 L132,190 M108,180 L130,196 M110,166 L134,184 M132,170 L110,192" stroke="#120c06" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M108,172 L132,190 M108,180 L130,196 M110,166 L134,184 M132,170 L110,192" stroke="#6b5a3a" stroke-width="3" stroke-linecap="round"/>
    <path d="M109,171 L131,188 M111,165 L133,182" stroke="#b39a6a" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="121" cy="181" r="9" fill="#84cc16" opacity="0.6" filter="url(#idol-nullifier-blur4)"/>
    <circle cx="121" cy="181" r="6" fill="url(#idol-nullifier-eye)" stroke="#120c06" stroke-width="2"/>
    <circle cx="119" cy="179" r="1.6" fill="#fff"/>
  </g>
</svg>
