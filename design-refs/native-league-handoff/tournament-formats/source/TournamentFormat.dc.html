<div class="sp" style="--acc: #e8b84a; --acc2: #ffd98a; --accInk: #1a1204; --disp: Archivo; min-height: 100vh; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 28px; border-bottom: 1px solid rgba(255,255,255,.06)">
  <a class="sp-btn" href="#" aria-label="Back" style="padding: 0 12px">‹</a>
  <div style="flex: 1 1 400px; display: flex; flex-direction: column; gap: 3px"><h1 class="sp-h1">Choose a tournament format</h1><span class="sp-t2">Plan a tournament · step 1 of 4 · you can switch formats until registration opens</span></div>
</header>
<div style="display: flex; flex-direction: column; gap: 20px; padding: 22px 28px 32px">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
      <button class="fm-opt" aria-pressed="{{o.on}}" onClick="{{o.pick}}">
        <div style="display: flex; align-items: center; gap: 14px"><img src="{{o.icon}}" alt="" style="width: 56px"><div style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font: 900 24px 'Archivo'; letter-spacing: -.02em">{{o.name}}</span><span class="sp-t2" style="font-size: 13px">{{o.tag}}</span></div><span class="sp-tag" style="background: {{o.chipBg}}; color: {{o.chipC}}">{{o.chip}}</span></div>
        <div class="fm-flow"><sc-for list="{{o.flow}}" as="f" hint-placeholder-count="6"><span style="background: {{f.bg}}">{{f.t}}</span><i>{{f.arrow}}</i></sc-for></div>
        <div style="display: flex; flex-direction: column; gap: 7px"><sc-for list="{{o.pts}}" as="p" hint-placeholder-count="5"><div class="fm-li"><b>{{p.m}}</b><span>{{p.t}}</span></div></sc-for></div>
        <span class="sp-t3" style="font-size: 12px">Best for: {{o.best}}</span>
      </button>
    </sc-for>
  </div>
  <section class="sp-card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px"><span class="sp-lbl" style="flex: 1">{{setTitle}}</span><span class="sp-chip">{{sizeChip}}</span></div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px"><sc-for list="{{sets}}" as="s" hint-placeholder-count="8">
      <div class="sp-card2" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 8px"><span class="sp-t3" style="font-size: 11.5px">{{s.l}}</span>
        <div class="sp-seg" style="align-self: flex-start"><sc-for list="{{s.ch}}" as="c" hint-placeholder-count="4"><button aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.v}}</button></sc-for></div></div>
    </sc-for></div>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 4px">
      <span style="flex: 1; font-size: 13px; color: #a3a9c2">{{summary}}</span>
      <a class="sp-btn sp-btn-p" href="{{next}}" style="min-height: 46px; padding: 0 22px">Continue</a>
    </div>
  </section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'div', confs: 10, per: 12, auto: 52, wc: 12, sport: 'NFL', field: 64, start: 'Season − 1', reg: 4, tb: 'Seed › record › best week › commish', cuts: 2, rd: 'After each cut', rdo: 'By seed', buf: '1 week' }; }
  renderVals() {
    const st = this.state, div = st.f === 'div';
    const set = (k, v) => () => this.setState({ [k]: v });
    const seg = (l, k, vals) => ({ l, ch: vals.map(v => ({ v, on: st[k] === v ? 'true' : 'false', pick: set(k, v) })) });
    const perDiv = st.confs * st.per, bracket = st.auto + st.wc, pow = Math.pow(2, Math.round(Math.log2(bracket))), ok = pow === bracket;
    const flowA = [['Stage 1 · 64', 0], ['Cut', 1], ['Redraft · 32', 0], ['Cut', 1], ['Redraft · 16', 0], ['Bracket', 2]];
    const flowB = [['2 divisions', 0], [st.confs + ' conferences each', 0], ['Record standings', 0], ['Auto bids + wildcard', 1], ['4 regions', 0], ['Division A vs B', 2]];
    const F = (fl) => fl.map(([t, k], i) => ({ t, bg: k === 1 ? 'rgba(232,184,74,.18)' : k === 2 ? 'rgba(232,184,74,.32)' : '#151926', arrow: i < fl.length - 1 ? '›' : '' }));
    return {
      opts: [
        { id: 'pts', name: 'Points race', tag: 'Global points, mass cuts and redrafts', icon: 'specialty/tournament/icon-cut.svg', flow: F(flowA), best: 'open or public tournaments, mixed-skill fields, 64–192 entrants',
          pts: [['1', 'Every entrant is in one points race across all leagues.'], ['2', 'Top half advances at each cut. Pools don’t reserve spots.'], ['3', 'Advancers redraft into new leagues. Scores reset.'], ['4', 'One cross-league bracket at the end.']] },
        { id: 'div', name: 'Divisions & conferences', tag: 'Two named divisions, conference leagues, regional brackets', icon: 'specialty/div/medallions/angelic.svg', flow: F(flowB), best: 'established communities with rivalries, 96–336 entrants',
          pts: [['1', 'Two divisions you name, each split into conference leagues of 8–14.'], ['2', 'One draft per league. No redrafts. Rosters carry into the bracket.'], ['3', 'Standings rank everyone in a division by record, then points.'], ['4', 'Automatic bids plus a wildcard bubble decided on points.'], ['5', 'Four regions per division, then the two division champions meet.']] }
      ].map(o => ({ ...o, on: st.f === o.id ? 'true' : 'false', pick: set('f', o.id), chip: st.f === o.id ? 'Selected' : 'Choose', chipBg: st.f === o.id ? 'rgba(232,184,74,.2)' : '#151926', chipC: st.f === o.id ? '#ffd98a' : '#7d84a3',
        pts: o.pts.map(([m, t]) => ({ m, t })) })),
      setTitle: div ? 'Divisions & conferences · settings' : 'Points race · settings',
      sizeChip: div ? (perDiv * 2) + ' entrants · ' + (st.confs * 2) + ' leagues' : st.field + ' entrants · ' + (st.field / 8) + ' leagues',
      sets: div ? [seg('Sport', 'sport', ['NFL', 'NBA']), seg('Conferences per division', 'confs', [4, 6, 8, 10]), seg('Teams per conference', 'per', [8, 10, 12, 14]), seg('Automatic bids per division', 'auto', [24, 28, 52, 56]),
                   seg('Wildcard spots per division', 'wc', [4, 8, 12, 16]), seg('Regions per division', 'reg', [4]), seg('Championship week', 'start', ['Season − 1']), seg('Tiebreakers', 'tb', ['Seed › record › best week › commish'])]
                : [seg('Sport', 'sport', ['NFL', 'NBA']), seg('Field size', 'field', [64, 96, 128, 160]), seg('Mass cuts', 'cuts', [2]), seg('Redraft order', 'rdo', ['By seed', 'Random', 'Set manually']), seg('Buffer between rounds', 'buf', ['1 week']), seg('Tiebreakers', 'tb', ['Seed › record › best week › commish'])],
      summary: div ? (ok ? 'Each division sends ' + bracket + ' teams to a ' + bracket + '-team bracket (' + (bracket / 4) + ' per region). ' + (perDiv - bracket) + ' per division miss out. Championship is one week before the season ends (' + (st.sport === 'NFL' ? 'NFL week 17' : 'NBA period 24') + ').' : 'Auto bids + wildcards = ' + bracket + '. Brackets need 32, 64 or 128 per division — adjust to ' + pow + '.')
                   : 'Cuts at half, a 1-week buffer for each redraft, and one bracket that ends one week before the season does.',
      next: div ? 'TournamentIdentity.dc.html' : 'TournamentCreate.dc.html' };
  }
}
</script>
