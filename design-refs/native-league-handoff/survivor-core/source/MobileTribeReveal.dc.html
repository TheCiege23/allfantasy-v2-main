<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your tribe (phone)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./exile/exile.css">
<link rel="stylesheet" href="./kit/kit.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Cinzel:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080d}
@keyframes trCrest{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes trBuff{0%{transform:translateY(-60px) rotate(-20deg);opacity:0}70%{transform:translateY(4px) rotate(3deg);opacity:1}100%{transform:none}}
@keyframes trUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tr-crest{animation:trCrest .9s cubic-bezier(.2,.8,.2,1) both}
.tr-buff{animation:trBuff .7s ease-out .8s both}
.tr-up{animation:trUp .5s ease-out both}
@media (prefers-reduced-motion:reduce){.tr-crest,.tr-buff,.tr-up{animation:none}}
</style>
</helmet>
<div class="ex" style="height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <img src="survivor/bg/dusk-football.svg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,8,13,.35), rgba(7,8,13,.75) 45%, #07080d 75%)"></div>
  <div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 50px 22px 24px; gap: 12px; text-align: center">
    <span class="ex-lbl tr-up" style="color: #d9b45a">The tribes are set</span>
    <img class="tr-crest" src="tribes/nfl/manta.svg" alt="Tribe Vela crest" style="width: 190px; filter: drop-shadow(0 20px 30px rgba(0,0,0,.6))">
    <img class="tr-buff" src="late/buff-vela.svg" alt="Vela buff" style="width: 150px; margin-top: -10px">
    <span class="tr-up" style="font: 700 34px/1.1 'Cinzel', serif; color: #f1d58a; animation-delay: 1.1s">Welcome to Vela</span>
    <span class="ex-t2 tr-up" style="font-size: 14px; animation-delay: 1.2s">You and five others. Win the tribe race and nobody from Vela goes home.</span>
    <div class="tr-up" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; animation-delay: 1.35s">
      <sc-for list="{{mates}}" as="m" hint-placeholder-count="6"><div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 92px"><span class="k-av" style="width: 46px; height: 46px; background: {{m.c}}; box-shadow: 0 0 0 2px #07080d, 0 0 0 4px {{m.ring}}">{{m.ini}}</span><span style="font-size: 11.5px; font-weight: 600">{{m.name}}</span></div></sc-for>
    </div>
    <span class="k-sp"></span>
    <a class="ex-btn ex-btn-gold tr-up" href="MobileChat.dc.html" style="width: 100%; min-height: 50px; animation-delay: 1.5s">Open tribe chat</a>
    <a class="ex-btn tr-up" href="SurvivorHome.dc.html" style="width: 100%; min-height: 46px; animation-delay: 1.5s">Go to league home</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { k: 0 }; }
  renderVals() {
    return { k: String(this.state.k), replay: () => this.setState({ k: this.state.k + 1 }),
      mates: [['You', 'TC', '#22314f', '#d9b45a'], ['Open Team 4', 'O4', '#1f2a4d', '#8b7be0'], ['Open Team 5', 'O5', '#12352a', '#8b7be0'], ['Open Team 8', 'O8', '#3a2410', '#8b7be0'], ['Open Team 12', 'O12', '#2a2a2a', '#8b7be0'], ['Open Team 11', 'O11', '#2a3a1a', '#8b7be0']]
        .map(([name, ini, c, ring]) => ({ name, ini, c, ring })) };
  }
}
</script>
</body>
</html>
