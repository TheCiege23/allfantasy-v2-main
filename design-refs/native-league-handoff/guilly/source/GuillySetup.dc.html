<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create a Guilly league</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./specialty/sp.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Cinzel:wght@600;700&amp;family=Caveat:wght@600;700&amp;family=Bebas+Neue&amp;family=Pirata+One&amp;family=Creepster&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080d}
.gy-d{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;line-height:.95}
.gy-cut{position:relative;height:0;border-top:2px dashed #ff3d2e;margin:9px 0}
.gy-cut>span{position:absolute;left:50%;top:-12px;transform:translateX(-50%);white-space:nowrap;padding:2px 10px;border-radius:5px;background:#ff3d2e;color:#fff;font:800 10px 'Archivo';letter-spacing:.1em}
.gy-head{width:34px;height:34px;flex:none}
.gy-pos{display:inline-grid;place-items:center;height:20px;min-width:26px;padding:0 4px;border-radius:5px;font:900 9.5px 'Archivo';letter-spacing:.02em}
.gy-gl{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:6px;background:#151926;font:700 11px 'JetBrains Mono';color:#e8eaf2}
.gy-meter{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#7a1410,#ff3d2e 30%,#ffc531 55%,#3abf7a 80%);overflow:visible}
.gy-meter>i{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px #07080d}
@keyframes gyBlade{0%{transform:translateY(-120%)}70%{transform:translateY(6%)}85%{transform:translateY(-3%)}100%{transform:translateY(0)}}
@keyframes gyRoll{0%{transform:translate(-40px,-30px) rotate(-90deg);opacity:0}40%{opacity:1}100%{transform:translate(0,0) rotate(200deg);opacity:1}}
@keyframes gyShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.gy-blade{animation:gyBlade .55s cubic-bezier(.5,0,.75,0) both}
.gy-roll{animation:gyRoll .9s .45s cubic-bezier(.2,.8,.2,1) both}
.gy-shake{animation:gyShake .4s .5s both}
.gy-tomb{position:relative;width:100%;aspect-ratio:200/240}
.gy-tomb>img{position:absolute;inset:0;width:100%}
.gy-tomb>div{position:absolute;left:18%;right:18%;top:49%;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.gy-tomb>div>b{font:800 12.5px 'Archivo';color:#1a1d24;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gy-tomb>div>span{font:700 10px 'JetBrains Mono';color:#2a2f3a}
.gy-mode{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:99px;background:#151926;border:1px solid rgba(255,255,255,.1);font:700 12px 'Archivo'}
.gy-mode>img{width:22px}
</style>
</helmet>
<div class="sp" style="--acc: #ff3d2e; --acc2: #ffc531; --accInk: #fff; --disp: Bebas Neue; min-height: 100vh; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 28px; border-bottom: 1px solid rgba(255,255,255,.06)">
  <a class="sp-btn" href="GuillyHome.dc.html" aria-label="Back" style="padding: 0 12px">‹</a>
  <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 3px"><h1 class="sp-h1">Create a Guilly league</h1><span class="sp-t2">NBA · commissioner setup · rules lock when the draft starts</span></div>
  <img src="specialty/guilly/emblem.svg" alt="" style="width: 54px">
</header>
<div style="display: flex; flex-wrap: wrap; gap: 22px; padding: 22px 28px 32px; align-items: flex-start">
  <section class="sp-card" style="flex: 1 1 760px; min-width: 0; padding: 8px 20px; display: flex; flex-direction: column">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="8"><div style="display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06)">
      <img src="{{s.icon}}" alt="" style="width: 34px"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font: 600 14px 'Archivo'">{{s.l}}</b><span class="sp-t3" style="font-size: 12px">{{s.d}}</span></div>
      <div class="sp-seg"><sc-for list="{{s.ch}}" as="c" hint-placeholder-count="3"><button aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.v}}</button></sc-for></div></div></sc-for>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 0">
      <img src="specialty/rules/scoring/pts.svg" alt="Points" style="height: 44px"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font: 600 14px 'Archivo'">Scoring and roster</b><span class="sp-t3" style="font-size: 12px">Points · Standard roster (10 start · 13 slots + 1 IL). Any NBA option works.</span></div>
      <a class="sp-btn" href="ScoringRoster.dc.html" style="min-height: 34px">Change</a></div>
  </section>
  <aside style="flex: 0 1 400px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px">
    <div class="sp-card2" style="padding: 20px; display: flex; flex-direction: column; gap: 12px; border-color: rgba(255,61,46,.4)">
      <img src="specialty/guilly/wordmark.svg" alt="Guilly" style="width: 70%; align-self: center">
      <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center"><sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><span class="gy-mode"><img src="{{c.i}}" alt="">{{c.t}}</span></sc-for></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><sc-for list="{{sum}}" as="s" hint-placeholder-count="5"><div style="display: flex; justify-content: space-between; font-size: 13px"><span class="sp-t2">{{s.l}}</span><span class="sp-num" style="font-weight: 700">{{s.v}}</span></div></sc-for></div>
      <span class="sp-prop" style="align-self: flex-start">{{warn}}</span>
      <button class="sp-btn sp-btn-p" style="min-height: 48px">Create league and invite</button>
    </div>
  </aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 18, draft: 'Auction', lineup: 'Managed', start: 1, dbl: 'Off', faab: '$1,000', rel: 'Blind FAAB', budget: '$200' }; }
  renderVals() {
    const st = this.state, set = (k, v) => () => this.setState({ [k]: v });
    const seg = (l, d, icon, k, vals) => ({ l, d, icon: 'specialty/guilly/' + icon + '.svg', ch: vals.map(v => ({ v, on: st[k] === v ? 'true' : 'false', pick: set(k, v) })) });
    const chops = st.n - 1, dblWeeks = st.dbl === 'On' ? Math.max(0, chops - 18) : 0;
    const weeks = st.dbl === 'On' ? Math.ceil(chops / 2) : chops, last = st.start + weeks - 1, ok = last <= 23;
    return { sets: [seg('League size', 'One chop per team, minus the winner.', 'icon-chop', 'n', [12, 14, 16, 18, 20]),
        seg('Draft type', st.draft === 'Auction' ? '$ budget per team, everyone can bid on everyone.' : 'Snake order. Pairs well with bestball.', st.draft === 'Auction' ? 'icon-gavel' : 'icon-streak', 'draft', ['Auction', 'Snake']),
        seg('Auction budget', 'Only used for auction drafts.', 'icon-faab', 'budget', ['$100', '$200', '$500']),
        seg('Lineups', st.lineup === 'Bestball' ? 'Best scores count automatically every day.' : 'Managers set daily lineups.', 'icon-bestball', 'lineup', ['Managed', 'Bestball']),
        seg('First chop', 'Week the blade starts falling.', 'icon-danger', 'start', [1, 2, 3]),
        seg('Double-chop weeks', 'Two heads a week until the field fits the calendar.', 'icon-tomb', 'dbl', ['Off', 'On']),
        seg('Season FAAB', 'Has to last through every frenzy.', 'icon-faab', 'faab', ['$500', '$1,000', '$2,000']),
        seg('Chopped rosters go to', 'Blind FAAB is the Guilly way.', 'icon-basket', 'rel', ['Blind FAAB', 'Free agency'])],
      chips: [[st.draft === 'Auction' ? 'icon-gavel' : 'icon-streak', st.draft], ['icon-bestball', st.lineup], ['icon-chop', st.n + ' teams'], ['icon-faab', st.faab + ' FAAB']].map(([i, t]) => ({ i: 'specialty/guilly/' + i + '.svg', t })),
      sum: [['Chops', chops], ['First chop', 'Week ' + st.start], ['Last chop', 'Week ' + last], ['Winner', 'Last team standing'], ['NBA season', '~24 weeks']].map(([l, v]) => ({ l, v })),
      warn: ok ? 'Ends before the NBA playoffs' : 'Runs past the season — turn on double-chop weeks' };
  }
}
</script>
</body>
</html>
