<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guilly draft board</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./specialty/sp.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Cinzel:wght@600;700&amp;family=Caveat:wght@600;700&amp;family=Bebas+Neue&amp;family=Pirata+One&amp;family=Creepster&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080d}
.gy-d{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;line-height:.95}
.gy-cut{position:relative;height:0;border-top:2px dashed #ff3d2e;margin:9px 0}
.gy-cut>span{position:absolute;left:50%;top:-12px;transform:translateX(-50%);white-space:nowrap;padding:2px 10px;border-radius:5px;background:#ff3d2e;color:#fff;font:800 10px 'Archivo';letter-spacing:.1em}
.gy-head{width:34px;height:34px;flex:none}
.gy-pos{display:inline-grid;place-items:center;height:20px;min-width:26px;padding:0 4px;border-radius:5px;font:900 9.5px 'Archivo';letter-spacing:.02em}
.gy-gl{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:6px;background:#151926;font:700 11px 'JetBrains Mono';color:#e8eaf2}
.gy-meter{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#7a1410,#ff3d2e 30%,#ffc531 55%,#3abf7a 80%);overflow:visible}
.gy-meter>i{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px #07080d}
@keyframes gyBlade{0%{transform:translateY(-120%)}70%{transform:translateY(6%)}85%{transform:translateY(-3%)}100%{transform:translateY(0)}}
@keyframes gyRoll{0%{transform:translate(-40px,-30px) rotate(-90deg);opacity:0}40%{opacity:1}100%{transform:translate(0,0) rotate(200deg);opacity:1}}
@keyframes gyShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.gy-blade{animation:gyBlade .55s cubic-bezier(.5,0,.75,0) both}
.gy-roll{animation:gyRoll .9s .45s cubic-bezier(.2,.8,.2,1) both}
.gy-shake{animation:gyShake .4s .5s both}
.gy-tomb{position:relative;width:100%;aspect-ratio:200/240}
.gy-tomb>img{position:absolute;inset:0;width:100%}
.gy-tomb>div{position:absolute;left:18%;right:18%;top:49%;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.gy-tomb>div>b{font:800 12.5px 'Archivo';color:#1a1d24;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gy-tomb>div>span{font:700 10px 'JetBrains Mono';color:#2a2f3a}
.gy-mode{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:99px;background:#151926;border:1px solid rgba(255,255,255,.1);font:700 12px 'Archivo'}
.gy-mode>img{width:22px}
</style>
</helmet>
<div class="sp" style="--acc: #ff3d2e; --acc2: #ffc531; --accInk: #fff; --disp: Bebas Neue; min-height: 100vh; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid rgba(255,255,255,.06)">
  <img src="specialty/guilly/wordmark.svg" alt="Guilly" style="height: 52px">
  <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font: 800 20px 'Archivo'">Draft board</span><span class="sp-t3" style="font-size: 12px">{{sub}}</span></div>
  <div class="sp-seg"><sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button aria-pressed="{{m.on}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for></div>
</header>
<div style="padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: grid; grid-template-columns: 34px repeat(18, minmax(0, 1fr)); gap: 3px">
    <span></span>
    <sc-for list="{{heads}}" as="h" hint-placeholder-count="18"><div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 8px; background: {{h.bg}}; border: 1px solid {{h.line}}; min-width: 0"><img src="{{h.head}}" alt="" style="width: 28px"><span style="font: 700 10px 'Archivo'; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{h.n}}</span><span class="sp-num" style="font-size: 9.5px; color: {{h.subC}}">{{h.sub}}</span></div></sc-for>
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="80"><div style="min-width: 0; height: 46px; padding: 4px 5px; border-radius: 6px; background: {{c.bg}}; border: 1px solid {{c.line}}; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden"><span style="font: 700 10px 'Archivo'; color: {{c.tc}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.n}}</span><span style="display: flex; justify-content: space-between; align-items: center; font: 700 9px 'JetBrains Mono'; color: {{c.mc}}"><span>{{c.p}}</span><span>{{c.m}}</span></span></div></sc-for>
  </div>
  <div style="display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px" class="sp-t3"><span style="display: inline-flex; align-items: center; gap: 6px"><img src="specialty/guilly/head-calm.svg" alt="" style="width: 18px">Floor in the top third</span><span style="display: inline-flex; align-items: center; gap: 6px"><img src="specialty/guilly/head-nervous.svg" alt="" style="width: 18px">Floor in the bottom third — early chop risk</span><span>Cells are coloured by position. The floor is a team’s projected weakest week.</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

 ["Terance Mann", "SG"], ["Kris Dunn", "PG/SG"], ["Derrick Jones Jr.", "SF"], ["Brandon Ingram", "SF/PF"], ["Mitchell Robinson", "C"], ["Yves Missi", "C"], ["Tre Jones", "PG"], ["Day\u2019Ron Sharpe", "C"], ["Nick Richards", "C"], ["Moussa Diabate", "C"], ["Guerschon Yabusele", "PF"], ["Daniel Gafford", "C"], ["Brook Lopez", "C"], ["Clint Capela", "C"], ["Jusuf Nurkic", "C"], ["Deandre Ayton", "C"], ["Kristaps Porzingis", "C"], ["Jonas Valanciunas", "C"], ["Zach Edey", "C"], ["Donovan Clingan", "C"], ["Kelly Oubre Jr.", "SF"], ["Chris Paul", "PG"], ["Bradley Beal", "SG"], ["Kevin Porter Jr.", "PG"], ["Spencer Dinwiddie", "PG"]];
const TM = ["You \u00b7 TheCiege26", "BucketsOnly", "LoadManagement", "BoxOutBandits", "DunkCity", "SplashZone", "TripleDoubleTrouble", "AndOneAddicts", "PostUpPros", "FastBreakFam", "GlassCleaners", "ZoneDefense", "AlleyOops", "PaintBeasts", "BankShotBoys", "FlagrantFoul", "ShotClock", "HeatCheck"];
const POS = {"QB": ["#e0553f", "#fff"], "RB": ["#3abf7a", "#06200f"], "WR": ["#3d8fe0", "#fff"], "TE": ["#e89a2c", "#1a1004"], "FLEX": ["#8a8fa8", "#0b0d14"], "SFLEX": ["#c04fd0", "#fff"], "K": ["#b48cf0", "#1a0d33"], "DST": ["#8a6a4a", "#fff"], "DL": ["#2fb5a5", "#04201d"], "LB": ["#1f8f86", "#fff"], "DB": ["#5fd0e0", "#05242a"], "IDP": ["#4a7f7a", "#fff"], "PG": ["#3d8fe0", "#fff"], "SG": ["#4fb3d9", "#05242a"], "SF": ["#3abf7a", "#06200f"], "PF": ["#e89a2c", "#1a1004"], "C": ["#e0553f", "#fff"], "G": ["#7aa6ec", "#0b1830"], "F": ["#7fd09c", "#06200f"], "UTIL": ["#8a8fa8", "#0b0d14"], "BN": ["#1d2130", "#a3a9c2"], "IR": ["#2a1418", "#ff9a8a"], "IL": ["#2a1418", "#ff9a8a"]};

const av = (n) => { const s = n.replace('You · ', ''); let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 997; return { ini: s.replace(/[^A-Z0-9]/g, '').slice(0, 2) || s.slice(0, 2).toUpperCase(), c: AVC[h % AVC.length] }; };
const short = (n) => { const p = n.split(' '); return p.length > 1 ? p[0][0] + '. ' + p.slice(1).join(' ') : n; };
const pos1 = (p) => p.split('/')[0];
const chip = (p) => ({ p, bg: POS[pos1(p)][0], c: POS[pos1(p)][1] });
const fpg = (i) => Math.round((58 - i * 0.215 - (i > 40 ? (i - 40) * 0.04 : 0)) * 10) / 10;
const price = (i) => Math.max(1, Math.round(74 * Math.exp(-i / 26)));
const HEAD = { calm: G + 'head-calm.svg', nervous: G + 'head-nervous.svg', ko: G + 'head-ko.svg', crown: G + 'head-crown.svg' };
// season: 18 teams, chops weeks 1..7 done, week 8 live
