<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tournament hub (phone)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./specialty/sp.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Cinzel:wght@600;700&amp;family=Caveat:wght@600;700&amp;family=Bebas+Neue&amp;family=Pirata+One&amp;family=Creepster&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080d}
.dv-cr{position:relative;container-type:inline-size;aspect-ratio:300/340;flex:none}
.dv-cr>img{position:absolute;display:block}
.dv-cr>img.f{inset:0;width:100%;height:100%}
.dv-cr>img.m{left:19.3%;top:18.2%;width:61.3%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.dv-cr>.tab{position:absolute;left:28%;right:28%;top:5.6%;height:7.4%;display:grid;place-items:center;font:900 3.6cqw/1 'Archivo';letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.dv-cr>.rib{position:absolute;left:14%;right:14%;top:79%;height:10.4%;display:grid;place-items:center;font:900 6.2cqw/1 'Archivo';letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-pair{display:flex;flex-direction:column;gap:8px;padding:14px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:#0b0d14;cursor:pointer;color:inherit;font:inherit;text-align:center}
.dv-pair[aria-pressed="true"]{border-color:#e8b84a;background:rgba(232,184,74,.07);box-shadow:0 0 0 3px rgba(232,184,74,.12)}
.dv-pair>div{display:flex;align-items:center;justify-content:center;gap:6px}
.dv-pair>div>img{width:64px}
.dv-pair>div>i{font:900 11px 'Archivo';font-style:normal;color:#5a6078}
.dv-pair>b{font:800 13px 'Archivo';color:#e8eaf2}
.dv-in{width:100%;min-height:42px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:#07080d;color:#fff;font:700 15px 'Archivo'}
.dv-in:focus{outline:2px solid #e8b84a;outline-offset:1px}
.dv-sw{width:26px;height:26px;border-radius:99px;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0}
.dv-sw[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
.dv-th{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#10131c;display:grid;place-items:center;cursor:pointer;padding:0}
.dv-th>img{width:36px}
.dv-th[aria-pressed="true"]{border-color:#e8b84a;box-shadow:0 0 0 2px rgba(232,184,74,.4)}
.dv-lib{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.dv-lib>button{aspect-ratio:1;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#0b0d14;cursor:pointer;padding:6px}
.dv-lib>button>img{width:100%;display:block}
.dv-lib>button[aria-pressed="true"]{border-color:#e8b84a;background:rgba(232,184,74,.1)}
.dv-md{position:relative;flex:none;aspect-ratio:1}
.dv-md>img{position:absolute;display:block}
.dv-md>img.r{inset:0;width:100%}
.dv-md>img.e{left:19.3%;top:19.3%;width:61.3%}
.dv-row{display:flex;align-items:center;gap:10px}
.dv-row>b{width:22px;font:700 12px 'JetBrains Mono';color:#7d84a3;text-align:right}
.rl-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 3px;border-radius:99px;font:900 10.5px 'Archivo';letter-spacing:.06em;color:#fff;border:1px solid rgba(0,0,0,.4);vertical-align:middle}
.rl-pill>i{width:15px;height:15px;border-radius:99px;background:rgba(0,0,0,.28)}
.rl-pos{display:inline-grid;place-items:center;height:30px;min-width:30px;padding:0 6px;border-radius:8px;font:900 11px 'Archivo';letter-spacing:.02em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.rl-pos.sm{height:22px;min-width:22px;padding:0 4px;border-radius:6px;font-size:9px}
.tt-lg{display:inline-flex;align-items:center;gap:6px;font:600 12px 'Archivo';color:#a3a9c2;white-space:nowrap}
.tt-lg>img{width:20px}
.tt-cut{position:relative;height:0;border-top:2px dashed #e8b84a;margin:8px 0}
.tt-cut>span{position:absolute;left:50%;top:-12px;transform:translateX(-50%);white-space:nowrap;padding:2px 10px;border-radius:5px;background:#e8b84a;color:#1a1204;font:800 10px 'Archivo';letter-spacing:.1em}
.tt-rank{width:30px;text-align:right;font:700 12px 'JetBrains Mono';color:#7d84a3}
.tt-pool{font:700 10.5px 'JetBrains Mono';color:#a3a9c2;padding:2px 6px;border-radius:4px;background:#151926}
.tt-path{display:flex;align-items:stretch;gap:0}
.tt-step{flex:1;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;background:#10131c;border:1px solid rgba(255,255,255,.06);min-width:0}
.tt-step>b{font:700 13px 'Archivo';color:#e8eaf2}
.tt-step>span{font-size:11.5px;color:#7d84a3}
.tt-step.on{background:linear-gradient(180deg,rgba(232,184,74,.16),rgba(232,184,74,.04));border-color:rgba(232,184,74,.55)}
.tt-step.on>b{color:#ffd98a}
.tt-step.done{opacity:.6}
.tt-arrow{flex:none;width:30px;display:grid;place-items:center;color:#5a6078}
.tt-arrow svg{width:16px;height:16px}
.tt-cutmark{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:74px;padding:0 4px;text-align:center}
.tt-cutmark>b{font:800 11px 'Archivo';color:#ffd98a;letter-spacing:.06em}
.tt-cutmark>span{font:600 10px 'Archivo';color:#7d84a3}
</style>
</helmet>
<div class="sp" style="--acc: #e8b84a; --acc2: #ffd98a; --accInk: #1a1204; --disp: Archivo; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
<img src="specialty/tournament/banner.svg" alt="" style="position: absolute; inset: 0 0 auto 0; width: 100%; height: 260px; object-fit: cover">
<div style="position: absolute; inset: 0 0 auto 0; height: 260px; background: linear-gradient(180deg, rgba(7,8,13,.3), #07080d)"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 24px; flex: 1; overflow-y: auto">
  <div style="display: flex; align-items: center; gap: 10px"><img src="specialty/tournament/emblem.svg" alt="" style="width: 44px"><div style="flex: 1; display: flex; flex-direction: column"><span style="font: 800 18px 'Archivo'">The Gold Bracket 64</span><span class="sp-t3" style="font-size: 11.5px">Stage 1 · week 5 · cut after week 6</span></div></div>
  <div class="sp-card" style="padding: 16px; display: flex; flex-direction: column; gap: 6px; margin-top: 54px; background: rgba(11,13,20,.94); border-color: rgba(232,184,74,.45)">
    <div style="display: flex; align-items: baseline; gap: 10px"><span style="font: 900 44px/1 'Archivo'; letter-spacing: -.03em">#30</span><span class="sp-t3">of 64</span><span style="flex: 1"></span><span class="sp-num" style="font-size: 20px; font-weight: 700; color: #ffd98a">+10.1</span></div>
    <span class="sp-t2" style="font-size: 12.5px">above the cut line · 72% to advance</span>
    <div class="sp-bar" style="margin-top: 4px"><span style="width: 72%; background: linear-gradient(90deg,#7a5214,#e8b84a)"></span></div>
  </div>
  <div style="display: flex; gap: 4px"><sc-for list="{{stages}}" as="s" hint-placeholder-count="4"><div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="height: 5px; border-radius: 9px; background: {{s.c}}"></span><span style="font: 600 10px 'Archivo'; color: {{s.tc}}">{{s.l}}</span></div></sc-for></div>
  <span class="sp-lbl" style="margin-top: 4px">Around the line</span>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
    <sc-if value="{{r.cutAbove}}" hint-placeholder-val="{{ false }}"><div class="tt-cut"><span>TOP 32 ADVANCE</span></div></sc-if>
    <div class="sp-row" style="padding: 8px 10px; background: {{r.bg}}; border-color: {{r.line}}"><span class="tt-rank" style="width: 24px">{{r.rank}}</span><span style="flex: 1; font-weight: 600; font-size: 12.5px">{{r.name}}</span><img src="{{r.pimg}}" alt="" style="width: 20px"><span class="sp-num" style="width: 52px; text-align: right; font-weight: 700; font-size: 12.5px">{{r.pts}}</span></div>
  </sc-for>
  <a class="sp-btn sp-btn-p" href="#" style="min-height: 48px; margin-top: 6px">Set lineup</a>
  <a class="sp-btn" href="TournamentBracket.dc.html" style="min-height: 46px">How the bracket works</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() {
  const R = [[29,'SlantAndGo','A','615.8'],[30,'You · TheCiege26','C','614.0'],[31,'TwoMinuteDrill','H','611.3'],[32,'DeepPost','D','607.6'],[33,'NickelPackage','G','603.9'],[34,'ScreenGame','B','601.2']];
  return { rows: R.map(([rank, name, pool, pts]) => ({ rank, name, pimg: 'specialty/div/library/' + ({A:'beast',B:'goat',C:'grizz',D:'kings',E:'rebels',F:'smoke',G:'stealth',H:'swamp'}[pool]) + '.svg', pts, cutAbove: rank === 33, bg: name.startsWith('You') ? 'rgba(232,184,74,.09)' : '#10131c', line: name.startsWith('You') ? 'rgba(232,184,74,.5)' : 'rgba(255,255,255,.05)' })),
    stages: [['Stage 1', 1], ['Stage 2', 0], ['Final', 0], ['Champ', 0]].map(([l, on]) => ({ l, c: on ? '#e8b84a' : '#1e2333', tc: on ? '#ffd98a' : '#5a6078' })) }; } }
</script>
</body>
</html>
