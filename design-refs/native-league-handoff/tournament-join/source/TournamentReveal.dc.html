<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>League reveal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./specialty/sp.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Cinzel:wght@600;700&amp;family=Caveat:wght@600;700&amp;family=Bebas+Neue&amp;family=Pirata+One&amp;family=Creepster&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080d}
.dv-cr{position:relative;container-type:inline-size;aspect-ratio:300/340;flex:none}
.dv-cr>img{position:absolute;display:block}
.dv-cr>img.f{inset:0;width:100%;height:100%}
.dv-cr>img.m{left:19.3%;top:18.2%;width:61.3%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.dv-cr>.tab{position:absolute;left:28%;right:28%;top:5.6%;height:7.4%;display:grid;place-items:center;font:900 3.6cqw/1 'Archivo';letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.dv-cr>.rib{position:absolute;left:14%;right:14%;top:79%;height:10.4%;display:grid;place-items:center;font:900 6.2cqw/1 'Archivo';letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-pair{display:flex;flex-direction:column;gap:8px;padding:14px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:#0b0d14;cursor:pointer;color:inherit;font:inherit;text-align:center}
.dv-pair[aria-pressed="true"]{border-color:#e8b84a;background:rgba(232,184,74,.07);box-shadow:0 0 0 3px rgba(232,184,74,.12)}
.dv-pair>div{display:flex;align-items:center;justify-content:center;gap:6px}
.dv-pair>div>img{width:64px}
.dv-pair>div>i{font:900 11px 'Archivo';font-style:normal;color:#5a6078}
.dv-pair>b{font:800 13px 'Archivo';color:#e8eaf2}
.dv-in{width:100%;min-height:42px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:#07080d;color:#fff;font:700 15px 'Archivo'}
.dv-in:focus{outline:2px solid #e8b84a;outline-offset:1px}
.dv-sw{width:26px;height:26px;border-radius:99px;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0}
.dv-sw[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
.dv-th{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#10131c;display:grid;place-items:center;cursor:pointer;padding:0}
.dv-th>img{width:36px}
.dv-th[aria-pressed="true"]{border-color:#e8b84a;box-shadow:0 0 0 2px rgba(232,184,74,.4)}
.dv-lib{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.dv-lib>button{aspect-ratio:1;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#0b0d14;cursor:pointer;padding:6px}
.dv-lib>button>img{width:100%;display:block}
.dv-lib>button[aria-pressed="true"]{border-color:#e8b84a;background:rgba(232,184,74,.1)}
.dv-md{position:relative;flex:none;aspect-ratio:1}
.dv-md>img{position:absolute;display:block}
.dv-md>img.r{inset:0;width:100%}
.dv-md>img.e{left:19.3%;top:19.3%;width:61.3%}
.dv-row{display:flex;align-items:center;gap:10px}
.dv-row>b{width:22px;font:700 12px 'JetBrains Mono';color:#7d84a3;text-align:right}
.rl-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 4px;border-radius:99px;font:900 11px 'Archivo';letter-spacing:.06em;color:#fff;border:1px solid rgba(0,0,0,.4);vertical-align:middle}
.rl-pill>i{width:16px;height:16px;border-radius:99px;background:rgba(0,0,0,.28)}
.rl-pos{display:inline-grid;place-items:center;height:30px;min-width:30px;padding:0 6px;border-radius:8px;font:900 11px 'Archivo';letter-spacing:.02em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.rl-pos.sm{height:22px;min-width:22px;padding:0 4px;border-radius:6px;font-size:9px}
.jn-badge{position:relative;flex:none;aspect-ratio:1}
.jn-badge>img{position:absolute;display:block}
.jn-badge>img.r{inset:0;width:100%}
.jn-badge>img.e{left:19.3%;top:19.3%;width:61.3%}
.jn-fact{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:10px;background:#10131c;border:1px solid rgba(255,255,255,.06)}
.jn-fact>span{font:600 10.5px 'Archivo';letter-spacing:.08em;text-transform:uppercase;color:#7d84a3}
.jn-fact>b{font:700 14px 'Archivo';color:#e8eaf2}
.jn-strip{display:flex;gap:6px;flex-wrap:wrap}
.jn-strip>div{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px}
.jn-strip>div>span{font:600 10px 'Archivo';color:#a3a9c2;text-align:center}
.jn-mate{display:flex;flex-direction:column;align-items:center;gap:5px;transition:opacity .35s,transform .35s}
.jn-mate.hide{opacity:0;transform:translateY(8px)}
.jn-mate>span:last-child{font:600 11px 'Archivo';color:#a3a9c2;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jn-veil{transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.jn-veil.hide{opacity:0;transform:scale(.6) rotate(-8deg)}
@keyframes jnGlow{0%,100%{box-shadow:0 0 0 0 rgba(232,184,74,.0)}50%{box-shadow:0 0 0 14px rgba(232,184,74,.12)}}
.jn-glow{animation:jnGlow 2.4s ease-in-out infinite}
</style>
</helmet>
<div class="sp" style="--acc: #e8b84a; --acc2: #ffd98a; --accInk: #1a1204; --disp: Archivo; min-height: 100vh; display: flex; flex-direction: column">
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 26px 28px 34px; background: radial-gradient(ellipse at 50% 30%, {{glow}}, transparent 60%), #07080d; min-height: 860px">
  <div style="display: flex; align-items: center; gap: 12px; width: 100%">
    <span class="sp-lbl" style="flex: 1">{{kicker}}</span>
    <div class="sp-seg"><sc-for list="{{fmts}}" as="f" hint-placeholder-count="2"><button aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
  </div>
  <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 40px">
      <div class="jn-glow" style="width: 220px; height: 250px; border-radius: 22px; border: 2px dashed rgba(232,184,74,.5); display: grid; place-items: center; font: 900 64px 'Archivo'; color: #5a6078">?</div>
      <span style="font: 800 24px 'Archivo'">Your league is ready</span>
      <span class="sp-t2" style="font-size: 14px">Registration closed. All {{total}} managers have been placed.</span>
      <button class="sp-btn sp-btn-p" onClick="{{reveal}}" style="min-height: 52px; padding: 0 30px; font-size: 16px">Reveal my league</button>
    </div>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 30px; margin-top: 6px">
      <div class="sp-up" style="animation-delay: .1s"><div class="jn-badge" style="width: 120px"><img class="r" src="{{ring}}" alt=""><img class="e" src="{{emb}}" alt=""></div></div>
      <div class="sp-pop" style="animation-delay: .35s"><div class="dv-cr" style="width: {{cr.w}}"><img class="f" src="{{cr.f}}" alt=""><img class="m" src="{{cr.m}}" alt=""><span class="tab" style="color: {{cr.tabC}}">{{cr.tab}}</span><span class="rib" style="color: {{cr.ribC}}">{{cr.rib}}</span></div></div>
      <div class="sp-up" style="display: flex; flex-direction: column; gap: 8px; animation-delay: .7s; max-width: 420px">
        <span class="sp-lbl" style="color: {{accent}}">{{divLine}}</span>
        <span class="sp-title" style="font-size: 48px">{{league}}</span>
        <span class="sp-t2" style="font-size: 14px">{{blurb}}</span>
        <div style="display: flex; gap: 10px; margin-top: 6px"><a class="sp-btn sp-btn-p" href="#" style="min-height: 46px">Go to my league</a><a class="sp-btn" href="#" style="min-height: 46px">Prep my draft</a></div>
      </div>
    </div>
    <div class="sp-card" style="width: 100%; max-width: 1100px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px">
      <div style="display: flex; align-items: center; gap: 10px"><span class="sp-lbl" style="flex: 1">Your league mates · {{mateCount}}</span><span class="sp-chip">Draft {{draft}}</span></div>
      <div style="display: flex; flex-wrap: wrap; gap: 14px 18px; justify-content: center"><sc-for list="{{mates}}" as="m" hint-placeholder-count="12"><div class="jn-mate {{m.cls}}" style="animation-delay: {{m.d}}"><span class="sp-av" style="width: 52px; height: 52px; font-size: 15px; background: {{m.c}}; box-shadow: {{m.ring}}">{{m.ini}}</span><span>{{m.n}}</span></div></sc-for></div>
    </div>
    <button class="sp-btn" onClick="{{reset}}" style="min-height: 34px">Replay</button>
  </sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: false, f: 'div', shown: false }; }
  renderVals() {
    const MAN = {"sides": {"angelic": {"name": "Angelic", "light": "#ffffff", "mid": "#e6e1c6", "dark": "#8e8452", "accent": "#fff1a0", "ink": "#1a1204", "medallion": "medallions/angelic.svg", "ring": "rings/angelic.svg", "frame": "frames/angelic.svg", "icon": "library/angel.svg"}, "demonic": {"name": "Demonic", "light": "#ffd0c8", "mid": "#c81e1e", "dark": "#3a0606", "accent": "#ff7a3a", "ink": "#ffffff", "medallion": "medallions/demonic.svg", "ring": "rings/demonic.svg", "frame": "frames/demonic.svg", "icon": "library/demon.svg"}, "rookie": {"name": "Rookie", "light": "#e9ffd6", "mid": "#7fd44a", "dark": "#2e5a14", "accent": "#c6ff7a", "ink": "#1a1204", "medallion": "medallions/rookie.svg", "ring": "rings/rookie.svg", "frame": "frames/rookie.svg", "icon": "library/sprout.svg"}, "vet": {"name": "Vet", "light": "#fff1d0", "mid": "#c9a24a", "dark": "#5a4210", "accent": "#ffd36b", "ink": "#1a1204", "medallion": "medallions/vet.svg", "ring": "rings/vet.svg", "frame": "frames/vet.svg", "icon": "library/vet.svg"}}};
const D = "specialty/div/";
const CN = ['Beast','Goat','Grizz','Kings','Rebels','Smoke','Stealth','Swamp','Thunder','Warrior'];
const crest = (side, img, conf, divName, w) => { const s = MAN.sides[side]; return { f: D + s.frame, m: D + img, tab: divName, rib: conf, tabC: s.ink, ribC: s.ink, w }; };
const AVC = ['#22314f','#4a1f2c','#1d3a3a','#2c2a4a','#3a3418','#12352a','#3a1f30','#1f2a4d','#2a3a1a','#3a2a14'];
const MATES = ['You · TheCiege26','Captainameri','HailMaryHal','Hoovi','PoppaF2021','Yardzilla23','Killercrocodile','TDWilliams','Angs','Randycoke2','ajgaul','pk30015'];
    const st = this.state, div = st.f === 'div';
    const side = div ? 'angelic' : 'rookie', s = MAN.sides[side];
    const mates = (div ? MATES : MATES.slice(0, 8));
    return { fmts: [['div', 'Divisions format'], ['pts', 'Points race']].map(([id, label]) => ({ label, on: st.f === id ? 'true' : 'false', pick: () => this.setState({ f: id }) })),
      kicker: div ? 'Angelic vs Demonic 2026 · league reveal' : 'The Gold Bracket 64 · stage 1 league reveal',
      pending: !st.done, done: st.done, total: div ? 240 : 64,
      reveal: () => this.setState({ done: true, shown: false }), reset: () => this.setState({ done: false, shown: false }),
      glow: s.mid + '33', accent: s.mid, ring: D + s.ring, emb: D + (div ? 'library/angel.svg' : 'library/sprout.svg'),
      cr: crest(side, div ? 'library/smoke.svg' : 'library/grizz.svg', div ? 'Smoke' : 'Grizz', div ? 'Angelic' : 'Rookie', '220px'),
      divLine: div ? 'Angelic division · conference 6 of 10' : 'Rookie division · stage 1 league 3 of 8',
      league: div ? 'Smoke Angelic' : 'Grizz Rookie',
      blurb: div ? '12 teams. Win your games to climb the Angelic standings — the top 52 get automatic bids.' : '8 teams in this league, 64 in the race. Only total points count at the cut after week 6.',
      mateCount: mates.length, draft: div ? 'Thu, Sep 3 · 8:00 PM ET' : 'Wed, Sep 2 · 9:00 PM ET',
      mates: mates.map((n, i) => ({ n: n.startsWith('You') ? 'You' : n, ini: n.replace('You · ', '').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase(), c: AVC[i % AVC.length], cls: 'sp-up', d: (0.9 + i * 0.07).toFixed(2) + 's', ring: i === 0 ? '0 0 0 3px ' + s.mid : 'none' })) };
  }
}
</script>
</body>
</html>
