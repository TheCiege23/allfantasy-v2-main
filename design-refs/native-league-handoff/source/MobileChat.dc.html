<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blah — League chat (phone)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./af-shell.css">
<link rel="stylesheet" href="./draft-sleek.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#07080d}</style>
</helmet>
<div class="af ph" style="min-height: 0">
  <header style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07)">
    <div style="display: flex; align-items: center; gap: 8px">
      <a class="iconbtn" href="Mobile.dc.html" aria-label="Back to Blah">‹</a>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 18px; letter-spacing: -0.03em">Blah chat</span><span class="lbl"><span style="color: #34d399">●</span> 3 online · 12 managers</span></span>
      <button class="iconbtn" aria-label="Members">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
    </div>
    <nav style="display: flex; gap: 6px; overflow-x: auto" aria-label="Channels">
      <sc-for list="{{chans}}" as="c" hint-placeholder-count="4"><button class="{{c.cls}}" onClick="{{c.pick}}" style="min-height: 34px">#{{c.name}}</button></sc-for>
    </nav>
  </header>

  <div class="ph-scroll" style="padding: 10px 12px; gap: 4px">
    <div style="padding: 10px 12px; border-radius: 12px; background: rgba(246,196,69,.08); border: 1px solid rgba(246,196,69,.25); font-size: 12px; line-height: 1.45; color: #c3c9e6"><span class="lbl" style="color: #f6c445">Pinned · Commish</span><br>Trades get a 24h review. Lineups lock per game.</div>
    <div style="margin: 6px 0; padding: 10px 12px; border-radius: 12px; background: #10131c; border: 1px solid rgba(255,255,255,.07); display: flex; gap: 8px; align-items: center"><span class="chip chip-good">Waivers</span><span style="flex: 1; font-size: 12px; color: #c3c9e6">You added Rashid Shaheed ($9)</span></div>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="display: flex; gap: 8px; padding: 6px 0; justify-content: {{m.justify}}">
        <sc-if value="{{m.them}}" hint-placeholder-val="{{ true }}"><span class="av" style="width: 30px; height: 30px; font-size: 10px; border-radius: 999px; flex: none; background: {{m.bg}}; color: {{m.fg}}">{{m.ini}}</span></sc-if>
        <div style="max-width: 78%; display: flex; flex-direction: column; gap: 4px">
          <sc-if value="{{m.them}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 600; color: #989fc2">{{m.who}}</span></sc-if>
          <span style="padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45; background: {{m.bubble}}; color: {{m.color}}">{{m.text}}</span>
        </div>
      </div>
    </sc-for>
    <div style="margin: 6px 0; padding: 14px; border-radius: 14px; background: #10131c; border: 1px solid rgba(34,211,238,.28); display: flex; flex-direction: column; gap: 8px">
      <span class="lbl" style="color: #22d3ee">League poll</span>
      <span style="font-weight: 600; font-size: 14px">Week 18 — keep it or end at 17?</span>
      <sc-for list="{{poll}}" as="o" hint-placeholder-count="3">
        <button onClick="{{o.vote}}" aria-pressed="{{o.on}}" style="position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid {{o.line}}; background: #0b0d14; color: #eef0fa; font: 700 13px 'Archivo', sans-serif">
          <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{o.pct}}; background: rgba(34,211,238,.14)"></span>
          <span style="position: relative">{{o.label}}</span><span class="num" style="position: relative">{{o.pct}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 8px; align-items: center; padding: 10px 12px 26px; border-top: 1px solid rgba(255,255,255,.07); background: #0b0d14">
    <button class="iconbtn" aria-label="Attach poll or player card">+</button>
    <label class="search" style="max-width: none; flex: 1; border-color: rgba(255,255,255,.13); height: 44px"><input type="text" placeholder="Message · @chimmy to ask AF" aria-label="Message" value="{{draft}}" onChange="{{onType}}"></label>
    <button class="btn btn-p" style="padding: 0 14px" onClick="{{send}}">Send</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ch: 'general', draft: '', sent: [], vote: null }; }
  renderVals() {
    const st = this.state;
    const chans = ['general','trash-talk','trades','waivers','chimmy'].map(c => ({ name: c, cls: 'chip' + (st.ch === c ? ' chip-af' : c === 'chimmy' ? ' chip-gold' : ''), pick: () => this.setState({ ch: c }) }));
    const them = (who, ini, bg, fg, text) => ({ them: true, who, ini, bg, fg, text, justify: 'flex-start', bubble: '#151926', color: '#eef0fa' });
    const me = text => ({ them: false, text, justify: 'flex-end', bubble: '#22d3ee', color: '#04050c', who: '', ini: '', bg: '', fg: '' });
    const msgs = [
      them('Sunday Scaries','SS','#3a1d55','#dcb4ff','Enjoy 3–1 while it lasts. Henry is about to eat.'),
      me('Bijan already dropped 19 on Thursday. Proceed.'),
      them('Open Team 9','O9','#3a2410','#f0b46a','4–0 and nobody wants to trade with me. Respect.'),
      them('Sunday Scaries','SS','#3a1d55','#dcb4ff','@chimmy who wins Ciege vs me this week?'),
      { ...them('Chimmy · AF','AF','#22d3ee','#04050c','AF has TheCiege26 at 71%. You need Henry and Lamb to both clear 20.'), bubble: 'rgba(34,211,238,.12)' },
      ...st.sent.map(me)
    ];
    const opts = [['Keep week 18', 5], ['End at 17', 3], ['Ask the commish', 1]];
    const total = opts.reduce((t, o) => t + o[1], 0) + (st.vote !== null ? 1 : 0);
    const poll = opts.map(([label, n], i) => { const v = n + (st.vote === i ? 1 : 0);
      return { label, on: st.vote === i ? 'true' : 'false', pct: Math.round(v / total * 100) + '%', line: st.vote === i ? '#22d3ee' : 'rgba(255,255,255,.1)', vote: () => this.setState({ vote: i }) }; });
    return { chans, ch: st.ch, msgs, poll, draft: st.draft,
      onType: e => this.setState({ draft: e.target.value }),
      send: () => { const t = (st.draft || '').trim(); if (t) this.setState({ sent: [...st.sent, t], draft: '' }); } };
  }
}
</script>
</body>
</html>
