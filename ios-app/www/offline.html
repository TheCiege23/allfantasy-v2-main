<!doctype html>
<!-- Shown by Capacitor (server.errorPath) when allfantasy.ai cannot be reached. Bundled in the app, so it works offline. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AllFantasy</title>
  <style>
    html,body{margin:0;height:100%;background:#020617;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 24px;text-align:center}
    h1{font-size:22px;margin:16px 0 8px}
    p{color:#94a3b8;font-size:15px;line-height:1.5;margin:0 0 24px;max-width:320px}
    button{background:#22d3ee;color:#020617;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <svg width="56" height="64" viewBox="0 0 56 64" aria-hidden="true"><path d="M28 2 52 12v20c0 15-10 26-24 30C14 58 4 47 4 32V12Z" fill="#1d4ed8" stroke="#22d3ee" stroke-width="3"/><text x="28" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" font-family="-apple-system,sans-serif">AF</text></svg>
    <h1>You're offline</h1>
    <p>AllFantasy needs a connection to load your leagues. Check your connection and try again.</p>
    <button type="button" onclick="location.href='https://allfantasy.ai/core'">Try again</button>
  </main>
</body>
</html>
