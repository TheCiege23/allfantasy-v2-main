<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <radialGradient id="decoy-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ca3af" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#6b7280" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#374151" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="decoy-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="decoy-glass" gradientUnits="userSpaceOnUse" x1="60" y1="30" x2="170" y2="264">
      <stop offset="0" stop-color="#d7dbe2" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#7c8491" stop-opacity="0.62"/>
      <stop offset="0.7" stop-color="#3b414b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#16191e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="decoy-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="decoy-mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fafb"/>
      <stop offset="0.4" stop-color="#9ca3af"/>
      <stop offset="0.55" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#d1d5db"/>
    </linearGradient>
    <radialGradient id="decoy-eye" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f3f4f6"/>
      <stop offset="0.45" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#4b5563"/>
    </radialGradient>
    <filter id="decoy-blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="decoy-blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="decoy-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="decoy-smoke" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="4" seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.88  0 0 0 0 0.92  2.4 0 0 0 -1.1" result="d"/>
      <feComposite in="d" in2="SourceAlpha" operator="in"/>
    </filter>
    <g id="decoy-body"><path d="M82,50 Q76,28 92,20 Q102,30 112,14 Q122,30 132,20 Q148,28 142,50 Z"/><path d="M74,62 L66,66 L66,88 L76,92 Z M150,62 L158,66 L158,88 L148,92 Z"/><path d="M112,30 C134,30 148,48 148,72 C148,96 134,112 112,112 C90,112 76,96 76,72 C76,48 90,30 112,30 Z"/><path d="M100,108 L124,108 L126,126 L98,126 Z"/><path d="M88,124 Q112,116 136,124 Q150,140 152,176 Q154,208 158,232 L66,232 Q70,208 72,176 Q74,140 88,124 Z"/><path d="M60,230 L164,230 Q172,232 170,242 L166,256 Q164,264 154,264 L70,264 Q60,264 58,256 L54,242 Q52,232 60,230 Z"/></g>
    <clipPath id="decoy-clip"><path d="M82,50 Q76,28 92,20 Q102,30 112,14 Q122,30 132,20 Q148,28 142,50 Z"/><path d="M74,62 L66,66 L66,88 L76,92 Z M150,62 L158,66 L158,88 L148,92 Z"/><path d="M112,30 C134,30 148,48 148,72 C148,96 134,112 112,112 C90,112 76,96 76,72 C76,48 90,30 112,30 Z"/><path d="M100,108 L124,108 L126,126 L98,126 Z"/><path d="M88,124 Q112,116 136,124 Q150,140 152,176 Q154,208 158,232 L66,232 Q70,208 72,176 Q74,140 88,124 Z"/><path d="M60,230 L164,230 Q172,232 170,242 L166,256 Q164,264 154,264 L70,264 Q60,264 58,256 L54,242 Q52,232 60,230 Z"/></clipPath>
    <mask id="decoy-rim" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="300">
      <use xlink:href="#decoy-body" fill="#fff"/>
      <use xlink:href="#decoy-body" fill="#000" transform="translate(-4,2)"/>
    </mask>
  </defs>

  <ellipse cx="124" cy="146" rx="114" ry="130" fill="url(#decoy-aura)"/>
  <ellipse cx="140" cy="110" rx="60" ry="70" fill="#9ca3af" opacity="0.25" filter="url(#decoy-blur10)"/>
  <ellipse cx="124" cy="268" rx="80" ry="10" fill="url(#decoy-shadow)"/>

  <!-- ghost double, offset right -->
  <g transform="translate(24,-6)" opacity="0.55">
    <use xlink:href="#decoy-body" fill="#9ca3af" opacity="0.18" filter="url(#decoy-blur1)"/>
    <use xlink:href="#decoy-body" fill="none" stroke="#d1d5db" stroke-width="2.4" stroke-linejoin="round" filter="url(#decoy-blur1)"/>
    <ellipse cx="99" cy="74" rx="8" ry="5" fill="#e5e7eb" opacity="0.6" filter="url(#decoy-blur1)"/>
    <ellipse cx="125" cy="74" rx="8" ry="5" fill="#e5e7eb" opacity="0.6" filter="url(#decoy-blur1)"/>
  </g>
  <g transform="translate(44,-12)" opacity="0.22">
    <use xlink:href="#decoy-body" fill="none" stroke="#d1d5db" stroke-width="2" stroke-linejoin="round" filter="url(#decoy-blur1)"/>
  </g>

  <!-- main glass idol -->
  <use xlink:href="#decoy-body" fill="none" stroke="#0b0d10" stroke-width="7" stroke-linejoin="round"/>
  <use xlink:href="#decoy-body" fill="url(#decoy-glass)"/>
  <g clip-path="url(#decoy-clip)">
    <use xlink:href="#decoy-body" fill="#000" filter="url(#decoy-smoke)" opacity="0.55"/>
    <!-- inner thickness: darker edges -->
    <use xlink:href="#decoy-body" fill="none" stroke="#0b0d10" stroke-width="10" opacity="0.35"/>
    <!-- sheen streaks -->
    <path d="M70,250 L120,20 L132,20 L82,250 Z" fill="url(#decoy-sheen)" opacity="0.5"/>
    <path d="M90,250 L140,20 L144,20 L94,250 Z" fill="#fff" opacity="0.25"/>
  </g>
  <!-- carved face -->
  <path d="M84,62 Q98,54 108,62" stroke="#0b0d10" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M116,62 Q126,54 140,62" stroke="#0b0d10" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="97" cy="74" rx="9" ry="6" fill="#0b0d10"/>
  <ellipse cx="127" cy="74" rx="9" ry="6" fill="#0b0d10"/>
  <ellipse cx="97" cy="74" rx="8" ry="5" fill="#9ca3af" filter="url(#decoy-blur3)"/>
  <ellipse cx="127" cy="74" rx="8" ry="5" fill="#9ca3af" filter="url(#decoy-blur3)"/>
  <ellipse cx="97" cy="74" rx="6" ry="3.8" fill="url(#decoy-eye)"/>
  <ellipse cx="127" cy="74" rx="6" ry="3.8" fill="url(#decoy-eye)"/>
  <path d="M112,78 L108,92 L116,92 Z" fill="#0b0d10" opacity="0.5"/>
  <path d="M98,96 L126,96 L124,104 L100,104 Z" fill="#0b0d10"/>
  <path d="M104,97 L104,103 M110,97 L110,104 M116,97 L116,104 M122,97 L122,103" stroke="#c7ccd4" stroke-width="1.6"/>
  <!-- crown carving -->
  <path d="M84,44 Q112,36 140,44" stroke="#0b0d10" stroke-width="2.4" fill="none"/>
  <circle cx="112" cy="30" r="4" fill="url(#decoy-eye)" stroke="#0b0d10" stroke-width="1.6"/>
  <!-- folded hands / robe carving -->
  <path d="M88,150 Q112,170 136,150" stroke="#0b0d10" stroke-width="2.6" fill="none"/>
  <circle cx="112" cy="176" r="17" fill="#0b0d10"/>
  <circle cx="112" cy="176" r="14" fill="url(#decoy-mirror)"/>
  <path d="M112,164 L114,174 L124,176 L114,178 L112,188 L110,178 L100,176 L110,174 Z" fill="#fff" opacity="0.9"/>
  <circle cx="112" cy="176" r="18" fill="#9ca3af" opacity="0.35" filter="url(#decoy-blur3)"/>
  <path d="M112,196 L112,230 M96,196 Q94,214 92,230 M128,196 Q130,214 132,230" stroke="#0b0d10" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- base band -->
  <path d="M56,244 L168,244" stroke="#0b0d10" stroke-width="2.4"/>
  <path d="M58,247 L166,247" stroke="#d1d5db" stroke-width="1.2" opacity="0.8"/>
  <!-- specular sparkles -->
  <path d="M88,46 Q92,38 102,35" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M80,150 Q82,136 90,128" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M64,236 L100,236" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <rect x="0" y="0" width="240" height="300" fill="#e5e7eb" opacity="0.7" mask="url(#decoy-rim)"/>
</svg>
