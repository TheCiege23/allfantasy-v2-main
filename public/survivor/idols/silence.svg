<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <radialGradient id="silence-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cbd5e1" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#94a3b8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#475569" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="silence-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silence-stone" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#c9ced6"/>
      <stop offset="0.35" stop-color="#8b929e"/>
      <stop offset="0.75" stop-color="#4d535e"/>
      <stop offset="1" stop-color="#262a31"/>
    </linearGradient>
    <linearGradient id="silence-stone-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe3ea"/>
      <stop offset="1" stop-color="#7c8390"/>
    </linearGradient>
    <linearGradient id="silence-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6dbe3"/>
      <stop offset="0.6" stop-color="#8d94a0"/>
      <stop offset="1" stop-color="#4b515c"/>
    </linearGradient>
    <linearGradient id="silence-plinth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b625a"/>
      <stop offset="0.6" stop-color="#3b342e"/>
      <stop offset="1" stop-color="#1c1814"/>
    </linearGradient>
    <linearGradient id="silence-cord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e2bd"/>
      <stop offset="1" stop-color="#a68757"/>
    </linearGradient>
    <radialGradient id="silence-bead" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </radialGradient>
    <filter id="silence-blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="silence-blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="silence-speckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.09  0 0 0 0 0.11  -3 0 0 0 1.55" result="d"/>
      <feComposite in="d" in2="SourceAlpha" operator="in"/>
    </filter>
    <path id="silence-mask" d="M120,30 C148,30 170,44 178,72 L184,102 C197,104 202,120 197,137 C194,149 187,154 182,154 C179,178 171,205 157,229 C145,249 133,259 120,263 C107,259 95,249 83,229 C69,205 61,178 58,154 C53,154 46,149 43,137 C38,120 43,104 56,102 L62,72 C70,44 92,30 120,30 Z"/>
    <clipPath id="silence-clip"><use xlink:href="#silence-mask"/></clipPath>
  </defs>

  <!-- aura -->
  <ellipse cx="120" cy="146" rx="114" ry="130" fill="url(#silence-aura)"/>
  <ellipse cx="120" cy="140" rx="64" ry="84" fill="#e2e8f0" opacity="0.3" filter="url(#silence-blur12)"/>
  <!-- contact shadow -->
  <ellipse cx="120" cy="271" rx="62" ry="8" fill="url(#silence-shadow)"/>

  <!-- plinth -->
  <path d="M92,246 L148,246 L160,268 L80,268 Z" fill="url(#silence-plinth)" stroke="#120c06" stroke-width="3" stroke-linejoin="round"/>
  <path d="M86,258 L154,258" stroke="#120c06" stroke-width="1.6"/>
  <path d="M94,249 L146,249" stroke="#8d847a" stroke-width="1.4" opacity="0.8"/>

  <!-- ear cords + beads (behind lobes) -->
  <g>
    <path d="M47,142 C40,160 40,176 44,192" stroke="#120c06" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M47,142 C40,160 40,176 44,192" stroke="url(#silence-cord)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M193,142 C200,160 200,176 196,192" stroke="#120c06" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M193,142 C200,160 200,176 196,192" stroke="url(#silence-cord)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="168" r="5.5" fill="url(#silence-bead)" stroke="#120c06" stroke-width="2"/>
    <circle cx="198" cy="168" r="5.5" fill="url(#silence-bead)" stroke="#120c06" stroke-width="2"/>
    <ellipse cx="43" cy="181" rx="4.4" ry="5.2" fill="#3a3530" stroke="#120c06" stroke-width="2"/>
    <ellipse cx="197" cy="181" rx="4.4" ry="5.2" fill="#3a3530" stroke="#120c06" stroke-width="2"/>
    <path d="M38,190 L44,188 L50,190 L51,214 Q44,219 37,214 Z" fill="#b9915a" stroke="#120c06" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M41,192 L40,214 M44,192 L44,216 M47,192 L48,214" stroke="#6b4a22" stroke-width="1"/>
    <path d="M190,190 L196,188 L202,190 L203,214 Q196,219 189,214 Z" fill="#b9915a" stroke="#120c06" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M193,192 L192,214 M196,192 L196,216 M199,192 L200,214" stroke="#6b4a22" stroke-width="1"/>
    <circle cx="40.5" cy="166.5" r="1.5" fill="#fff"/><circle cx="196.5" cy="166.5" r="1.5" fill="#fff"/>
  </g>

  <!-- mask body -->
  <use xlink:href="#silence-mask" fill="#120c06" stroke="#120c06" stroke-width="7" stroke-linejoin="round"/>
  <use xlink:href="#silence-mask" fill="url(#silence-stone)"/>
  <use xlink:href="#silence-mask" fill="#000" filter="url(#silence-speckle)" opacity="0.55"/>

  <g clip-path="url(#silence-clip)">
    <!-- right-side core shadow -->
    <path d="M150,30 C176,48 186,90 186,130 C186,190 160,240 120,268 L210,268 L210,30 Z" fill="#14171c" opacity="0.38"/>
    <!-- forehead carved bands -->
    <path d="M70,62 Q120,40 170,62" stroke="#1b1e24" stroke-width="3" fill="none"/>
    <path d="M70,65 Q120,43 170,65" stroke="#e3e7ee" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M66,80 L76,72 L86,80 L96,72 L106,80 L116,72 L124,72 L134,80 L144,72 L154,80 L164,72 L174,80" stroke="#1b1e24" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <path d="M66,83 L76,75 L86,83 L96,75 L106,83 L116,75 L124,75 L134,83 L144,75 L154,83 L164,75 L174,83" stroke="#dfe3ea" stroke-width="1" fill="none" opacity="0.45"/>
    <!-- cheek hollows -->
    <ellipse cx="80" cy="172" rx="16" ry="22" fill="#20242b" opacity="0.28"/>
    <ellipse cx="160" cy="172" rx="16" ry="22" fill="#14171c" opacity="0.4"/>
    <!-- crack -->
    <path d="M168,58 L160,74 L164,84 L156,98" stroke="#0e1014" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <path d="M169,60 L161.5,74.5 L165.5,84.5" stroke="#e3e7ee" stroke-width="0.8" fill="none" opacity="0.5"/>
  </g>

  <!-- forehead silver inlay (hush mark) -->
  <path d="M120,50 L126,58 L120,66 L114,58 Z" fill="#cbd5e1" opacity="0.7" filter="url(#silence-blur2)"/>
  <path d="M120,50 L126,58 L120,66 L114,58 Z" fill="#e2e8f0" stroke="#120c06" stroke-width="2" stroke-linejoin="round"/>
  <path d="M120,53 L123,58 L120,63 L117,58 Z" fill="#ffffff"/>

  <!-- heavy brow -->
  <path d="M62,104 Q90,86 116,102 L124,102 Q150,86 178,104 L176,116 Q150,100 124,116 L116,116 Q90,100 64,116 Z" fill="url(#silence-stone-hi)" stroke="#120c06" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M68,104 Q90,91 114,104" stroke="#f3f5f8" stroke-width="1.4" fill="none" opacity="0.85"/>

  <!-- eye sockets -->
  <ellipse cx="91" cy="130" rx="22" ry="15" fill="#15181d" stroke="#120c06" stroke-width="2"/>
  <ellipse cx="149" cy="130" rx="22" ry="15" fill="#15181d" stroke="#120c06" stroke-width="2"/>
  <!-- glow leaking from closed seams -->
  <path d="M73,134 Q91,146 109,134" stroke="#cbd5e1" stroke-width="5" fill="none" filter="url(#silence-blur2)"/>
  <path d="M131,134 Q149,146 167,134" stroke="#cbd5e1" stroke-width="5" fill="none" filter="url(#silence-blur2)"/>
  <!-- heavy closed lids -->
  <path d="M71,131 Q72,116 91,115 Q110,116 111,131 Q91,143 71,131 Z" fill="url(#silence-lid)" stroke="#120c06" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M129,131 Q130,116 149,115 Q168,116 169,131 Q149,143 129,131 Z" fill="url(#silence-lid)" stroke="#120c06" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M77,121 Q90,115 102,119" stroke="#f3f5f8" stroke-width="1.6" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M135,121 Q148,115 160,119" stroke="#f3f5f8" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- lid seams + carved lashes -->
  <path d="M72,132 Q91,143 110,132" stroke="#f8fafc" stroke-width="1.6" fill="none"/>
  <path d="M130,132 Q149,143 168,132" stroke="#f8fafc" stroke-width="1.6" fill="none"/>
  <path d="M80,138 L78,143 M87,140.5 L86,146 M95,140.5 L96,146 M102,138 L104,143" stroke="#120c06" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M138,138 L136,143 M145,140.5 L144,146 M153,140.5 L154,146 M160,138 L162,143" stroke="#120c06" stroke-width="1.8" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M113,114 L127,114 L136,166 Q128,174 120,172 Q112,174 104,166 Z" fill="url(#silence-stone-hi)" stroke="#120c06" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M127,116 L135,164 Q130,170 124,170 L124,118 Z" fill="#2a2e35" opacity="0.5"/>
  <path d="M114,118 L107,162" stroke="#f3f5f8" stroke-width="1.5" opacity="0.85" stroke-linecap="round"/>
  <ellipse cx="111" cy="166" rx="4" ry="2.4" fill="#15181d"/>
  <ellipse cx="129" cy="166" rx="4" ry="2.4" fill="#15181d"/>

  <!-- cheek spirals -->
  <path d="M78,176 a5,5 0 1 1 6,-6 a9,9 0 1 1 -12,12" stroke="#1b1e24" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M162,176 a5,5 0 1 0 -6,-6 a9,9 0 1 0 12,12" stroke="#1b1e24" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- bound mouth -->
  <path d="M80,198 Q120,180 160,198 Q120,220 80,198 Z" fill="url(#silence-stone-hi)" stroke="#120c06" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M84,198 Q120,206 156,198" stroke="#cbd5e1" stroke-width="5" fill="none" filter="url(#silence-blur2)"/>
  <path d="M83,198 Q120,206 157,198" stroke="#120c06" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M86,199 Q120,205.5 154,199" stroke="#e2e8f0" stroke-width="1" fill="none"/>
  <path d="M88,193 Q120,183 152,193" stroke="#f3f5f8" stroke-width="1.3" fill="none" opacity="0.7"/>
  <!-- cord stitches -->
  <g stroke-linecap="round">
    <path d="M92,190 L104,210 M104,190 L92,210 M110,188 L122,210 M122,188 L110,210 M128,188 L140,210 M140,188 L128,210 M146,190 L156,206 M156,190 L146,206" stroke="#120c06" stroke-width="6.6"/>
    <path d="M92,190 L104,210 M104,190 L92,210 M110,188 L122,210 M122,188 L110,210 M128,188 L140,210 M140,188 L128,210 M146,190 L156,206 M156,190 L146,206" stroke="url(#silence-cord)" stroke-width="3.8"/>
    <path d="M92.5,190.5 L97,198 M110.5,188.5 L115,196.5 M128.5,188.5 L133,196.5 M146.5,190.5 L150,196" stroke="#fff8e6" stroke-width="1" opacity="0.9"/>
  </g>
  <g fill="#0e1014">
    <circle cx="92" cy="190" r="2.2"/><circle cx="104" cy="190" r="2.2"/><circle cx="92" cy="210" r="2.2"/><circle cx="104" cy="210" r="2.2"/>
    <circle cx="110" cy="188" r="2.2"/><circle cx="122" cy="188" r="2.2"/><circle cx="110" cy="210" r="2.2"/><circle cx="122" cy="210" r="2.2"/>
    <circle cx="128" cy="188" r="2.2"/><circle cx="140" cy="188" r="2.2"/><circle cx="128" cy="210" r="2.2"/><circle cx="140" cy="210" r="2.2"/>
    <circle cx="146" cy="190" r="2.2"/><circle cx="156" cy="190" r="2.2"/><circle cx="146" cy="206" r="2.2"/><circle cx="156" cy="206" r="2.2"/>
  </g>

  <!-- chin chevrons -->
  <path d="M104,226 L120,236 L136,226" stroke="#1b1e24" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
  <path d="M108,236 L120,244 L132,236" stroke="#1b1e24" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
  <path d="M104,229 L120,239 L136,229" stroke="#dfe3ea" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- ear lobe holes -->
  <circle cx="50" cy="128" r="4.5" fill="#15181d" stroke="#120c06" stroke-width="1.5"/>
  <circle cx="190" cy="128" r="4.5" fill="#15181d" stroke="#120c06" stroke-width="1.5"/>

  <!-- rim light + top-left highlight -->
  <path d="M180,80 L185,104 M197,124 Q196,144 184,152 M182,160 C179,184 170,210 157,231" stroke="#cbd5e1" stroke-width="2.4" fill="none" opacity="0.85" stroke-linecap="round"/>
  <path d="M64,76 C70,50 92,36 118,35" stroke="#f3f5f8" stroke-width="2.2" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M60,104 L56,108" stroke="#f3f5f8" stroke-width="1.5" opacity="0.6"/>
</svg>
