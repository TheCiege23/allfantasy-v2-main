<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <radialGradient id="lineup-lock-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#92400e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lineup-lock-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineup-lock-stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7aa9c"/>
      <stop offset="0.35" stop-color="#7b7f72"/>
      <stop offset="0.75" stop-color="#4b4f46"/>
      <stop offset="1" stop-color="#262823"/>
    </linearGradient>
    <linearGradient id="lineup-lock-stone-raised" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bcad"/>
      <stop offset="1" stop-color="#6d7166"/>
    </linearGradient>
    <linearGradient id="lineup-lock-bronze" gradientUnits="userSpaceOnUse" x1="60" y1="30" x2="185" y2="150">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset="0.25" stop-color="#e0a54e"/>
      <stop offset="0.6" stop-color="#9a5f1f"/>
      <stop offset="1" stop-color="#4a2a0b"/>
    </linearGradient>
    <linearGradient id="lineup-lock-bronze-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf86"/>
      <stop offset="0.5" stop-color="#b47530"/>
      <stop offset="1" stop-color="#5a320d"/>
    </linearGradient>
    <linearGradient id="lineup-lock-bronze-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6cf86"/>
      <stop offset="0.45" stop-color="#b47530"/>
      <stop offset="1" stop-color="#4a2a0b"/>
    </linearGradient>
    <radialGradient id="lineup-lock-core" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="0.3" stop-color="#ffd27a"/>
      <stop offset="0.75" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#9a4b05"/>
    </radialGradient>
    <filter id="lineup-lock-blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="lineup-lock-blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="lineup-lock-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="lineup-lock-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.07  -3 0 0 0 1.7" result="d"/>
      <feComposite in="d" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="lineup-lock-speck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.92  0 0 0 0 0.86  4 0 0 0 -2.6" result="d"/>
      <feComposite in="d" in2="SourceAlpha" operator="in"/>
    </filter>
    <path id="lineup-lock-body" d="M66,126 L174,126 Q196,126 198,150 L200,232 Q198,264 168,266 L72,266 Q42,264 40,232 L42,150 Q44,126 66,126 Z"/>
    <mask id="lineup-lock-rim" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="300">
      <use xlink:href="#lineup-lock-body" fill="#fff"/>
      <use xlink:href="#lineup-lock-body" fill="#000" transform="translate(-5,-1)"/>
    </mask>
    <mask id="lineup-lock-hi" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="300">
      <use xlink:href="#lineup-lock-body" fill="#fff"/>
      <use xlink:href="#lineup-lock-body" fill="#000" transform="translate(6,6)"/>
    </mask>
    <clipPath id="lineup-lock-clip"><use xlink:href="#lineup-lock-body"/></clipPath>
  </defs>

  <!-- aura -->
  <ellipse cx="120" cy="150" rx="116" ry="130" fill="url(#lineup-lock-aura)"/>
  <ellipse cx="120" cy="222" rx="34" ry="34" fill="#f59e0b" opacity="0.3" filter="url(#lineup-lock-blur10)"/>
  <!-- contact shadow -->
  <ellipse cx="120" cy="271" rx="88" ry="10" fill="url(#lineup-lock-shadow)"/>

  <!-- shackle -->
  <path d="M82,150 L82,88 A38,38 0 0 1 158,88 L158,150" fill="none" stroke="#120c06" stroke-width="28" stroke-linecap="butt"/>
  <path d="M82,150 L82,88 A38,38 0 0 1 158,88 L158,150" fill="none" stroke="url(#lineup-lock-bronze)" stroke-width="21"/>
  <path d="M76,140 L76,88 A44,44 0 0 1 120,44" fill="none" stroke="#fff1cc" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
  <path d="M164,96 A44,44 0 0 0 150,58" fill="none" stroke="#fbbf24" stroke-width="2.4" opacity="0.7" stroke-linecap="round"/>
  <path d="M88,140 L88,88 A32,32 0 0 1 152,88 L152,140" fill="none" stroke="#3b2208" stroke-width="2" opacity="0.6"/>
  <!-- carved grooves on shackle -->
  <path d="M71,104 L93,104 M71,112 L93,112 M147,104 L169,104 M147,112 L169,112" stroke="#3b2208" stroke-width="2"/>

  <!-- body -->
  <use xlink:href="#lineup-lock-body" fill="#120c06" stroke="#120c06" stroke-width="7" stroke-linejoin="round"/>
  <use xlink:href="#lineup-lock-body" fill="url(#lineup-lock-stone)"/>
  <use xlink:href="#lineup-lock-body" fill="#000" filter="url(#lineup-lock-grain)" opacity="0.8"/>
  <use xlink:href="#lineup-lock-body" fill="#000" filter="url(#lineup-lock-speck)" opacity="0.35"/>

  <g clip-path="url(#lineup-lock-clip)">
    <!-- chips / cracks -->
    <path d="M40,200 L52,206 L46,214 L56,222" stroke="#1a1c18" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M41,201 L52,207" stroke="#c9ccbe" stroke-width="1" opacity="0.6"/>
    <path d="M190,128 L182,142 L188,150 L180,162" stroke="#1a1c18" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M150,266 L156,252 L166,250" stroke="#1a1c18" stroke-width="1.8" fill="none"/>
    <!-- forehead band with chevrons -->
    <path d="M44,138 L196,138 L196,158 L44,158 Z" fill="#3d4038" opacity="0.55"/>
    <path d="M44,136 L196,136" stroke="#c4c7b8" stroke-width="1.5" opacity="0.7"/>
    <path d="M52,155 L62,141 L72,155 L82,141 L92,155 L102,141 L112,155 L122,141 L132,155 L142,141 L152,155 L162,141 L172,155 L182,141 L192,155" stroke="#1a1c18" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
    <path d="M53,153 L62,140.5 L71,153 M73,153 L82,140.5 L91,153 M93,153 L102,140.5 L111,153 M113,153 L122,140.5 L131,153 M133,153 L142,140.5 L151,153 M153,153 L162,140.5 L171,153 M173,153 L182,140.5 L191,153" stroke="#bfc2b2" stroke-width="0.9" fill="none" opacity="0.5"/>
    <!-- side cheek spirals -->
    <path d="M54,212 Q46,206 52,198 Q60,192 66,200 Q70,208 62,212 Q56,212 57,205 Q59,201 62,204" stroke="#1a1c18" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M186,212 Q194,206 188,198 Q180,192 174,200 Q170,208 178,212 Q184,212 183,205 Q181,201 178,204" stroke="#1a1c18" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- brow ridge (raised) -->
  <path d="M58,170 Q88,158 116,172 L124,172 Q152,158 182,170 L180,180 Q152,170 124,184 L116,184 Q88,170 60,180 Z" fill="url(#lineup-lock-stone-raised)" stroke="#120c06" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M62,170 Q88,160 114,172" stroke="#e3e5d8" stroke-width="1.6" fill="none" opacity="0.8"/>
  <!-- eyes -->
  <path d="M66,186 L106,184 L102,200 L74,198 Z" fill="#14100a" stroke="#120c06" stroke-width="2" stroke-linejoin="round"/>
  <path d="M174,186 L134,184 L138,200 L166,198 Z" fill="#14100a" stroke="#120c06" stroke-width="2" stroke-linejoin="round"/>
  <path d="M72,188 L102,187 L99,197 L77,196 Z" fill="#f59e0b" filter="url(#lineup-lock-blur3)"/>
  <path d="M168,188 L138,187 L141,197 L163,196 Z" fill="#f59e0b" filter="url(#lineup-lock-blur3)"/>
  <path d="M75,189 L100,188 L97,195 L79,194.5 Z" fill="url(#lineup-lock-core)"/>
  <path d="M165,189 L140,188 L143,195 L161,194.5 Z" fill="url(#lineup-lock-core)"/>
  <!-- nose -->
  <path d="M114,184 L126,184 L132,206 Q120,212 108,206 Z" fill="url(#lineup-lock-stone-raised)" stroke="#120c06" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M115,187 L110,205" stroke="#eef0e4" stroke-width="1.4" opacity="0.7"/>
  <!-- carved stone lips around keyhole mouth -->
  <path d="M120,202 C146,200 160,218 158,234 C156,252 144,264 120,264 C96,264 84,252 82,234 C80,218 94,200 120,202 Z" fill="url(#lineup-lock-stone-raised)" stroke="#120c06" stroke-width="2.6"/>
  <path d="M86,226 Q92,206 120,204" stroke="#eef0e4" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round"/>
  <path d="M82,234 L72,232 M158,234 L168,232" stroke="#1a1c18" stroke-width="2.4" stroke-linecap="round"/>
  <!-- mouth = keyhole: bronze escutcheon lips -->
  <path d="M120,208 C138,208 148,220 146,232 C144,246 138,258 120,258 C102,258 96,246 94,232 C92,220 102,208 120,208 Z" fill="url(#lineup-lock-bronze-v)" stroke="#120c06" stroke-width="2.8"/>
  <path d="M100,224 Q104,212 120,211" stroke="#fff1cc" stroke-width="1.8" fill="none" opacity="0.8" stroke-linecap="round"/>
  <!-- teeth notches around lips -->
  <path d="M104,214 L108,219 M136,214 L132,219 M98,236 L104,236 M142,236 L136,236 M106,253 L109,248 M134,253 L131,248" stroke="#4a2a0b" stroke-width="2" stroke-linecap="round"/>
  <!-- rivets -->
  <circle cx="120" cy="213" r="2" fill="#ffe7b0" stroke="#4a2a0b" stroke-width="0.8"/>
  <circle cx="120" cy="254" r="2" fill="#c08a40" stroke="#4a2a0b" stroke-width="0.8"/>
  <!-- keyhole -->
  <path d="M120,218 A11,11 0 0 1 127,237.5 L131,250 L109,250 L113,237.5 A11,11 0 0 1 120,218 Z" fill="#0b0602" stroke="#120c06" stroke-width="2"/>
  <path d="M120,221 A8.5,8.5 0 0 1 125,236.5 L128,247 L112,247 L115,236.5 A8.5,8.5 0 0 1 120,221 Z" fill="#f59e0b" filter="url(#lineup-lock-blur3)"/>
  <path d="M120,223 A6.5,6.5 0 0 1 123.6,235.4 L125.5,245 L114.5,245 L116.4,235.4 A6.5,6.5 0 0 1 120,223 Z" fill="url(#lineup-lock-core)"/>
  <ellipse cx="118.5" cy="227" rx="2" ry="1.6" fill="#fff"/>

  <!-- bronze collars where shackle enters -->
  <rect x="66" y="118" width="32" height="16" rx="4" fill="url(#lineup-lock-bronze-h)" stroke="#120c06" stroke-width="3"/>
  <rect x="142" y="118" width="32" height="16" rx="4" fill="url(#lineup-lock-bronze-h)" stroke="#120c06" stroke-width="3"/>
  <path d="M70,122 L94,122 M146,122 L170,122" stroke="#fff1cc" stroke-width="1.6" opacity="0.8"/>
  <circle cx="72" cy="128" r="1.8" fill="#4a2a0b"/><circle cx="92" cy="128" r="1.8" fill="#4a2a0b"/>
  <circle cx="148" cy="128" r="1.8" fill="#4a2a0b"/><circle cx="168" cy="128" r="1.8" fill="#4a2a0b"/>

  <!-- lighting -->
  <rect x="0" y="0" width="240" height="300" fill="#f4f1e2" opacity="0.4" mask="url(#lineup-lock-hi)"/>
  <rect x="0" y="0" width="240" height="300" fill="#fcd27d" opacity="0.7" mask="url(#lineup-lock-rim)"/>

  <!-- short chain hanging from right collar -->
  <g stroke-linejoin="round">
    <ellipse cx="180" cy="140" rx="8" ry="11" fill="none" stroke="#120c06" stroke-width="9" transform="rotate(-30 180 140)"/>
    <ellipse cx="180" cy="140" rx="8" ry="11" fill="none" stroke="url(#lineup-lock-bronze-v)" stroke-width="4.5" transform="rotate(-30 180 140)"/>
    <rect x="186" y="148" width="8" height="26" rx="4" fill="url(#lineup-lock-bronze-h)" stroke="#120c06" stroke-width="3" transform="rotate(-22 190 161)"/>
    <ellipse cx="200" cy="182" rx="8" ry="11" fill="none" stroke="#120c06" stroke-width="9" transform="rotate(-12 200 182)"/>
    <ellipse cx="200" cy="182" rx="8" ry="11" fill="none" stroke="url(#lineup-lock-bronze-v)" stroke-width="4.5" transform="rotate(-12 200 182)"/>
    <rect x="200" y="191" width="8" height="24" rx="4" fill="url(#lineup-lock-bronze-h)" stroke="#120c06" stroke-width="3" transform="rotate(-6 204 203)"/>
    <!-- broken end link -->
    <path d="M200,218 A9,9 0 1 0 216,224" fill="none" stroke="#120c06" stroke-width="9" stroke-linecap="round"/>
    <path d="M200,218 A9,9 0 1 0 216,224" fill="none" stroke="url(#lineup-lock-bronze-v)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M175,132 Q179,129 184,131" stroke="#fff1cc" stroke-width="1.4" fill="none" opacity="0.8"/>
  </g>
</svg>
