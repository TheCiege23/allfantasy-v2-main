<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AllFantasy — Connect ESPN</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1220;
        color: #e6e9ef;
      }
      h1 {
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        line-height: 1.5;
        color: #9aa4b2;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: none;
        background: #22d3ee;
        color: #04121a;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.5;
      }
      #status.success {
        color: #34d399;
      }
      #status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <h1>Connect ESPN to AllFantasy</h1>
    <p>
      Reads only your ESPN league cookies (SWID and espn_s2) from this browser and saves them,
      encrypted, to your AllFantasy account so private ESPN leagues can be imported.
    </p>
    <button id="connect-btn" type="button">Connect my ESPN to AllFantasy</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
