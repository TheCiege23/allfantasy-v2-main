--- # ============================================================================
# Rolling Insights DataFeeds — API Contract
# NORMATIVE. Do not probe the live API to rediscover any of this.
# Source: vendor Notion docs + official agent-skill repo (production branch)
# Captured: 2026-08-16
# ============================================================================

meta:
  vendor: Rolling Insights (Rolling Wave Consulting Inc., Calgary, Alberta, Canada)
  base_url: https://rest.datafeeds.rolling-insights.com/api/v1
  # ⚠️ CORRECTED 2026-08-17 against the code. ROLLING_INSIGHTS_BASE_URL was
  # documented here as canonical but is read by exactly ONE file. See
  # env_var_reality below — set the wrong name and most call paths silently
  # fall back to a default.
  base_url_env: ROLLING_INSIGHTS_REST_BASE_URL
  contract_version: 1.0.0
  captured_at: 2026-08-16
  skill_repo: github.com/Rolling-Insights/sports-datafeeds-by-rolling-insights-skill
  skill_repo_branch: production   # NOT main
  governing_law: Alberta, Canada

  # ⚠️ AUTHORITY ORDER — newest first. The vendor pointed us at new docs
  # on 2026-08-16 that supersede the Notion pages.
  authority:
    1: docs.datafeeds.rolling-insights.com   # OpenAPI 3.1.0, info.version 1.0.0
                                             # PRE-RELEASE ("yet to be formally released")
                                             # 84 paths. Most accurate shape source.
    2: vendor Discord answers 2026-08-16     # see VENDOR-QA.md — covers undocumented features
    3: skill repo (production branch)        # good operational guidance
    4: Notion docs                           # STALE: http:// URLs, 2019 samples
  see_also: PLAY-BY-PLAY.yaml, VENDOR-QA.md

  # Vendor self-describes as an UNOFFICIAL, MEDIUM-LATENCY provider that collects
  # from public sources. Not an official league feed. Fine for fantasy; NOT
  # suitable for regulated sports-betting data requirements.
  data_classification: unofficial_medium_latency
  sla: none   # ToS explicitly disclaims data accuracy and all performance warranties

# ============================================================================
auth:
  mechanism: query_parameter
  param_name: RSC_token          # exact casing; case-sensitive
  # ⚠️ CORRECTED 2026-08-17. RSC_TOKEN was documented as canonical; it is read
  # by 4 files. ROLLING_INSIGHTS_RSC_TOKEN is read by 13. See env_var_reality.
  env_var: ROLLING_INSIGHTS_RSC_TOKEN
  header_alternative: none       # there is NO Bearer/Authorization option
  https_required: true           # vendor: "Never use http://"

  # -------------------------------------------------------------------------
  # This repo does not agree with itself on env var names. Counted 2026-08-17
  # over lib/ app/ scripts/ server/. Documenting the drift rather than pretending
  # one name is canonical, because following a single name silently no-ops.
  # -------------------------------------------------------------------------
  env_var_reality:
    token:
      ROLLING_INSIGHTS_RSC_TOKEN: 13        # most common
      ROLLING_INSIGHTS_CLIENT_SECRET2: 11   # ALSO holds the RSC token (ri-players-server)
      RSC_TOKEN: 4                          # what this contract used to claim
      also_seen: [ROLLING_INSIGHTS_CLIENT_SECRET, ROLLING_INSIGHTS_API_KEY,
                  ROLLING_INSIGHTS_KEY, ROLLING_INSIGHTS_RSC_TOKEN2]
    base_url:
      ROLLING_INSIGHTS_REST_BASE_URL: 12    # most common
      ROLLING_INSIGHTS_BASE_URL: 1          # what this contract used to claim
      also_seen: [ROLLING_INSIGHTS_REST_BASE, ROLLING_INSIGHTS_API_BASE]
    rule: >
      Before adding a provider call, grep for the name actually read on the path
      you are touching. Do not assume this contract's name is the one in effect.

  security_rules:
    - RSC_token MUST be redacted in every log, error message, and trace.
    - RSC_token MUST NOT reach any browser/client. Server-side only.
    - Rotate at accounts.rolling-insights.com on suspected exposure.
    - Never echo full request URLs.

# ============================================================================
transport:
  # -------------------------------------------------------------------------
  # ⚠️⚠️ THE 304 CONFLICT — TWO VENDOR SOURCES DISAGREE. UNRESOLVED.
  # -------------------------------------------------------------------------
  304_conflict:
    skill_repo_says: >
      "Treat 304 as a cache problem, not a success." Prescribes no-cache headers
      + fresh ms cache-buster + retry once.
    new_openapi_says: >
      Component named `NotModified`: "Not modified — valid request with no new
      data to return (empty result set)" — i.e. 304 IS a legitimate freshness
      signal meaning empty.
    status: UNRESOLVED — these are opposite readings. Escalated to vendor (VENDOR-QA.md).

    additional_evidence:
      - 304 is declared on only 14 of 84 operations — and ONLY for DARTS and PGA.
      - "/live/{date}/NFL declares only [200, 401, 403] — no 304 at all."
      - Absence of a declared 304 is NOT a guarantee it won't occur; the spec is
        pre-release and response-code sets are inconsistent across sports.

    # ---------------------------------------------------------------------
    # ✅ OUR RULE: cache-bust + hash-diff. This is SAFE UNDER BOTH READINGS.
    #   - If 304 is a cache artifact: busting defeats it. Correct.
    #   - If 304 genuinely means "empty": busting costs one extra request and
    #     you no-op on an unchanged hash. Also correct.
    # Change detection is ALWAYS by payload_sha256 in our DB, never by HTTP
    # status. Do not make product behaviour depend on resolving this.
    # ---------------------------------------------------------------------
    our_rule: cache_bust_and_hash_diff
  # -------------------------------------------------------------------------
  required_live_headers:
    Accept: application/json
    Cache-Control: "no-cache, no-store"
    Pragma: no-cache

  cache_buster:
    param: "_"
    value: epoch_milliseconds     # ms precision REQUIRED for sub-second polling
    applies_to: ALL endpoints      # vendor scripts add it universally, not just /live
    note: >
      Seconds-precision busters will NOT defeat caching on sub-second polls.
      Use int(time.time() * 1000).

  status_codes:
    200: Valid JSON response.
    304: Cache/validation artifact. Retry ONCE with a fresh cache-buster. Not success.
    404: Bad request, wrong path, or unsupported sport/endpoint combination.
    other: Invalid dates often surface as plain-text (non-JSON) error bodies.

  rate_limit:
    documented_hard_limit: none
    vendor_recommendation_seconds: 5   # "at least a 5-10 second delay between calls"
    our_gameday_cadence_seconds: 35    # well above the floor; see INTEGRATION.md
    note: Vendor markets "no hidden rate limits". No documented 429.
    openapi_confirms: >
      New spec has ZERO occurrences of rate limit / 429 / throttle / quota, and
      declares no 429 response on any of the 84 operations.
    unanswered: >
      ⚠️ Asked the vendor for the /live rate limit and whether a 304 counts
      against it. NOT ANSWERED. See VENDOR-QA.md follow-ups.

  # -------------------------------------------------------------------------
  # ✅ WEBHOOKS EXIST — vendor-confirmed 2026-08-16, but UNDOCUMENTED.
  # -------------------------------------------------------------------------
  webhooks:
    available: true
    vendor_quote: >
      "Yes, we offer a webhook push option. This can be configured by opening a
      support ticket with our Customer Care team."
    provisioning: support ticket (not self-serve)
    documented: false
    openapi_state: >
      ⚠️ The new spec has a top-level `webhooks:` key whose value is literally
      `{}`. The word "webhook" appears exactly once in the whole spec — that
      empty key. No payload format, no event types, no HMAC/signature scheme,
      no retry policy, no delivery guarantees are documented ANYWHERE.
    implication: >
      This is the single biggest architectural win available (removes 35s of
      detection lag) AND the biggest undocumented risk. Open the ticket, get the
      payload contract in writing, and commit it here before building on it.
    required_before_use:
      - payload schema + example
      - event type list
      - signature/HMAC verification scheme
      - retry policy and delivery guarantee (at-least-once? ordering?)
      - whether webhooks fire for stat CORRECTIONS or only new events
    design_note: >
      Even with webhooks, KEEP POLLING as a slower reconciliation net. Webhook
      delivery is rarely guaranteed, and our dedupe_key already makes duplicate
      delivery harmless. Hybrid: webhook primary (low latency) + poll every
      2-5 min (completeness).

  stat_corrections:
    reprocess_window_hours: 12   # corrections re-run for ~12h AFTER game ends
    implication: Final stats are NOT immutable at the whistle. Reconcile pass required.
    vendor_quote: >
      "If a statistic is corrected during the game, that correction will be
      reflected in a subsequent version of the live box score. We don't currently
      provide flags specifically identifying stat corrections."
    vendor_reasons_given:
      - play initially recorded incorrectly at field level
      - official decision changed
      - public source data updated
      - vendor adjusted how a play was interpreted
    no_correction_flag: true
    # ⚠️ Consequence: a correction is INDISTINGUISHABLE from a new play in the
    # box score. See PLAY-BY-PLAY.yaml correction_detection for the two-layer
    # strategy (PBP reversal flags + negative-delta guard).
    hard_rule: NEVER emit an alert on a negative stat delta.

# ============================================================================
envelope:
  # Standard shape:
  #   { "data": { "<KEY>": [ ... ] } }
  wrapper_key: data
  value_type: array               # array even for single-game game_id queries

  key_resolution:
    default: "<SPORT_CODE>"       # data.NFL, data.NBA, data.MLB, data.NHL, ...
    SOCCER: "<LEAGUE_CODE>"       # ⚠️ data.EPL / data.LALIGA / data.SERIEA

  # ⚠️ HIGHEST-RISK PARSING TRAP IN THE API
  soccer_trap: >
    You request the path segment SOCCER with ?league=EPL, but the response is keyed
    data.EPL — NOT data.SOCCER. A parser that keys off the request path will silently
    return empty for all soccer.

  parsing_rules:
    - Inspect `data` first, then resolve the sport/league key.
    - Verify the value is an array before indexing.
    - Map only fields that exist. Expect nulls, empty arrays, reduced detail.
    - Do NOT force one schema across sports.
    - Parse defensively PER ENDPOINT, not per sport (field names differ by endpoint).

  known_inconsistencies:
    - id: request_vs_response_id_casing
      detail: "Request param is `game_id` (lowercase). Response field is `game_ID`."
      also: "player_ID, team_ID, tournament_ID in responses."
    - id: team_name_field_varies_by_endpoint
      detail: >
        NBA /schedule shows home_team / away_team as plain strings.
        NBA /live shows full_box.home_team.name as a nested object.
        Vendor docs elsewhere reference home_team_name / away_team_name.
        All three may be real on different endpoints. Handle per-endpoint.
    - id: status_vs_game_status
      detail: >
        Vendor prose says use `game_status` as primary live-state string for NBA,
        but every JSON example uses `status`. SUPPORT BOTH.

# ============================================================================
sports:
  # SPORT codes are CASE-SENSITIVE, no spaces, no underscores.
  codes: [NHL, NBA, NFL, MLB, NCAABB, NCAAFB, SOCCER, DARTS, PGA]

  normalization:
    # Normalize user input BEFORE building a URL.
    "NCAA FB":  NCAAFB
    "NCAA_FB":  NCAAFB
    "NCAAF":    NCAAFB
    "CFB":      NCAAFB
    "NCAA BB":  NCAABB
    "NCAA_BB":  NCAABB
    "NCAAB":    NCAABB
    "EPL":      { sport: SOCCER, league: EPL }
    "LALIGA":   { sport: SOCCER, league: LALIGA }
    "SERIEA":   { sport: SOCCER, league: SERIEA }

  soccer_leagues: [EPL, LALIGA, SERIEA]
  soccer_league_param_required: true

  # ⚠️ NOT COVERED by this vendor — do not plan features around these:
  not_covered: [BUNDESLIGA, LIGUE1, CHAMPIONS_LEAGUE, UEFA, MLS]

# ============================================================================
# ENDPOINT × SPORT SUPPORT MATRIX
# "false" = not documented by vendor. Vendor instructs agents NOT to call these.
# NOTE: undocumented != guaranteed 404. See GAPS.md before hard-coding absence.
# ============================================================================
support_matrix:
  schedule:        { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: true,  NCAAFB: true,  SOCCER: true,  DARTS: true,  PGA: true  }
  schedule_week:   { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: true,  NCAAFB: true,  SOCCER: true,  DARTS: true,  PGA: true  }
  schedule_season: { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: true,  NCAAFB: true,  SOCCER: true,  DARTS: true,  PGA: true  }
  live:            { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: true,  NCAAFB: true,  SOCCER: true,  DARTS: true,  PGA: true  }
  play_by_play:    { MLB: true,  NFL: true,  NBA: true,  NHL: false, NCAABB: false, NCAAFB: false, SOCCER: false, DARTS: false, PGA: false }
  team_info:       { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: true,  NCAAFB: true,  SOCCER: true,  DARTS: false, PGA: false }
  team_stats:      { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: true,  NCAAFB: true,  SOCCER: true,  DARTS: false, PGA: false }
  player_info:     { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: true,  NCAAFB: true,  SOCCER: true,  DARTS: true,  PGA: true  }
  player_stats:    { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: true,  NCAAFB: true,  SOCCER: false, DARTS: true,  PGA: true  }
  injuries:        { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: false, NCAAFB: false, SOCCER: false, DARTS: false, PGA: false }
  depth_charts:    { MLB: true,  NFL: true,  NBA: true,  NHL: true,  NCAABB: false, NCAAFB: false, SOCCER: false, DARTS: false, PGA: false }
  events:          { DARTS: true }   # DARTS only
  field:           { PGA: true }     # PGA only

# Consequences that materially affect product scope:
support_consequences:
  - >
    NCAAFB has NO play-by-play. College-football big-play alerts must be derived by
    diffing the /live box score, which detects only the FIRST big play per player per
    game (see INTEGRATION.md §5). For complete CFB play-level data, use
    CollegeFootballData ($5-30/mo, commercial use explicitly permitted).
  - >
    NCAAFB and NCAABB have NO injuries endpoint. College injury data must come from
    another source or be omitted with an explicit "not available" flag.
  - NHL has NO play-by-play. Same box-score-diff limitation as NCAAFB.
  - SOCCER has NO player season stats and NO injuries.
  - There are NO odds and NO projection endpoints for any sport.
  - >
    Fantasy points appear as FIELDS inside football payloads (DK_fantasy_points,
    DK_fantasy_points_per_game). There is no fantasy endpoint. These are DraftKings
    scoring only — useless for custom league settings. Score from raw stats instead.
  - >
    ❌ NO PROJECTIONS. Vendor-confirmed 2026-08-16: "We don't currently offer
    projection endpoints. This is something on our roadmap." Feature-request board:
    https://app.loopedin.io/datafeeds-by-rolling-insights#/ideas-board
    → Upvote it, but plan as if it will never ship. Projections come from
    Fantasy Nerds ($499/yr, raw stat categories, IDP) or your own model built on
    nflverse. See player-values-pipeline-spec.md §4.
  - >
    ❌ NO ADP, NO TRADE VALUES, NO DYNASTY VALUES. Vendor-confirmed: "We leave
    these types of calculated values to our customers, since different companies
    often have their own methodologies." FantasyCalc + DynastyProcess remain the
    values layer. This is arguably GOOD — it means they are not competing with you
    on the analytics layer, which is relevant to the ToS competitive-use clause.

# ============================================================================
endpoints:

  schedule:
    method: GET
    path: /schedule/{date}/{SPORT}
    path_params:
      date:  { format: "YYYY-MM-DD" }
      SPORT: { enum_ref: sports.codes }
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }
      game_id:   { required: false }
      league:    { required_for: [SOCCER] }
    purpose: Event discovery, game IDs, start times, basic status.
    use_first: true   # Call this before /live or /play-by-play if you lack a game_id.

  schedule_week:
    method: GET
    path: /schedule-week/{date}/{SPORT}
    path_params:
      date: { format: "YYYY-MM-DD" }
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }
      league:    { required_for: [SOCCER] }

  schedule_season:
    method: GET
    path: /schedule-season/{season}/{SPORT}
    path_params:
      season: { format: "YYYY", note: "Year the season STARTED. Bare year, not a date." }
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }
      league:    { required_for: [SOCCER] }

  live:
    method: GET
    path: /live/{date}/{SPORT}
    path_params:
      date: { format: "YYYY-MM-DD" }
    query_params:
      RSC_token: { required: true }
      _:         { required: true, value: epoch_ms, note: "cache buster" }
      team_id:   { required: false }
      game_id:   { required: false }
      league:    { required_for: [SOCCER] }
    required_headers: [Cache-Control, Pragma]
    purpose: Live scores, current box state, player box lines.
    declared_responses: [200, 401, 403]   # ⚠️ NFL live declares NO 304 and NO 404
    notes:
      - This is the PRIMARY game-day endpoint. Player-level box stats live here.
      - Returns started AND finished events for the given date.
      - 304 => retry once with fresh buster (see transport.304_conflict).
    nfl_top_level_keys: [sport, away_team_name, home_team_name, game_time,
                         game_status, status, game_ID, game_location, game_arena,
                         season_type, season, week, full_box, event_name, round,
                         player_box]
    nfl_new_fields:
      # Present in the new spec, absent from the old contract:
      - DK_fantasy_points   # on BOTH team and player box
      - "snap_counts { defense, offense, specialTeams }"
      - targets             # per player — useful for market-share projections

    # -----------------------------------------------------------------------
    # ✅ LIVE GAME STATE — resolves the "everything was null" observation
    # -----------------------------------------------------------------------
    live_game_state:
      # ⚠️ The vendor called this `currentBox` in Discord. That name does NOT
      # exist in the spec. The real path is full_box.current.
      correct_path: data.NFL[].full_box.current
      vendor_informal_name: currentBox   # do not code against this
      full_box_keys: [away_team, home_team, current]

      lifecycle:
        vendor_quote: >
          "The currentBox is populated while a game is live, as it represents the
          current state of the game. Once the game has been completed, currentBox
          will be null."
        resolves: >
          ✅ Your all-null observation was from a FINAL-state payload. That is
          expected behaviour, not a bug and not an unpopulated field. Re-probe
          during a live game to capture the populated shape.

      fields:
        Quarter:           { type: string,  note: "⚠️ STRING, not integer. 'F' when final." }
        TimeRemaining:     { type: [string, "null"], example: "00:00" }
        Down:              { type: [integer, "null"] }
        Distance:          { type: [integer, "null"] }
        YardLine:          { type: [integer, "null"],
                             note: "⚠️ INTEGER here. PBP play.yardLine is a STRING ('BUF 25')." }
        YardLineTerritory: { type: [string, "null"], example: "BUF" }
        Possession:        { type: [string, "null"], example: "BUF",
                             note: "⚠️ ABBREVIATION here. PBP play.possession is a FULL TEAM NAME." }
        RedZone:           { type: [boolean, "null"] }
        poss:              { type: string, note: "lowercase duplicate of Possession" }
        field:             { type: string, example: "BUF 25", note: "lowercase convenience string" }

      cross_sport_naming_trap: >
        ⚠️ "Current box" is THREE different field names across sports:
          NFL / NCAAFB : full_box.current  (full football state)
          NBA / NCAABB : full_box.current  (only { Quarter, TimeRemaining })
          MLB          : full_box.current_box
                         { inning, inning_half, outs, balls, strikes,
                           current_batter{id,name,position},
                           current_pitcher{id,name,position} }
          DARTS        : top-level current_box { leg, throwing, points_to_checkout }
        Do not write one accessor for all sports.

  play_by_play:
    method: GET
    path: /play-by-play/{SPORT}
    supported_sports: [MLB, NBA, NFL]   # confirmed UNCHANGED in the new docs
    query_params:
      RSC_token: { required: true }
      game_id:   { required: true }
      _:         { required: false, value: epoch_ms }
    full_schema: PLAY-BY-PLAY.yaml      # ← full field list lives there
    bundling: >
      ✅ INCLUDED with the Live Feed tier. Vendor: "Play-by-play is currently
      included for customers who purchase our live data, so there is no separate
      play-by-play package required."
    notes:
      - Parse as an EVENT SEQUENCE, not a box score.
      - Requires game_id from /schedule or /live first.
      - "⚠️ `sequence` is NON-CONTIGUOUS. High-water mark only, never a count."
      - "⚠️ Touchdowns are NOT in the `event` enum — use isTouchdown + isScoringPlay."
      - "✅ `yardsGained` is the 20+ yard detection field."
      - "✅ details.isReversed / isOverruled / isReplayOverturned give officiating-reversal detection."

  team_info:
    method: GET
    path: /team-info/{SPORT}
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }
      league:    { required_for: [SOCCER] }
      relegated: { required: false, applies_to: [SOCCER], enum: [TRUE, FALSE] }

  team_stats:
    method: GET
    path: /team-stats/{season}/{SPORT}
    path_params:
      season: { format: "YYYY", note: "Year season started." }
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }
      league:    { required_for: [SOCCER] }
    seasonless_variant: /team-stats/{SPORT}   # only where vendor docs show it

  player_info:
    method: GET
    path: /player-info/{SPORT}
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }
      player_id: { required: false }
      league:    { required_for: [SOCCER] }

  player_stats:
    method: GET
    path: /player-stats/{season}/{SPORT}
    path_params:
      season: { format: "YYYY", note: "Year season started." }
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }
      player_id: { required: false }
    seasonless_variant: /player-stats/{SPORT}
    seasonless_default_sports: [PGA, DARTS]   # PGA is the only documented default

  injuries:
    method: GET
    path: /injuries/{SPORT}
    supported_sports: [MLB, NFL, NBA, NHL]
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }

  depth_charts:
    method: GET
    path: /depth-charts/{SPORT}
    supported_sports: [MLB, NFL, NBA, NHL]
    query_params:
      RSC_token: { required: true }
      team_id:   { required: false }

  events:
    method: GET
    path: /events/{date}/{SPORT}
    supported_sports: [DARTS]
    query_params:
      RSC_token: { required: true }
      event_id:  { required: false }

  field:
    method: GET
    path: /field/{SPORT}
    supported_sports: [PGA]
    query_params:
      RSC_token: { required: true }
      game_id:   { required: true, format: "YYYY_N" }

# ============================================================================
identifiers:
  game_id:
    MLB:    { format: "YYYYMMDD-{n}-{n}", examples: ["20250724-9-8"] }
    NBA:    { format: "YYYYMMDD-{n}-{n}", examples: ["20260412-1-2", "20260516-14-13"] }
    NFL:    { format: "YYYYMMDD-{n}-{n}", examples: ["20251009-32-21", "20230811-11-26"] }
    PGA:    { format: "YYYY_N",           examples: ["2026_1", "2026_19"] }
    DARTS:  { param: event_id, format: opaque, examples: ["202304PL10"] }
    NHL:    { format: unknown }   # see GAPS.md
    NCAAFB: { format: unknown }   # see GAPS.md
    NCAABB: { format: unknown }   # see GAPS.md
    SOCCER: { format: unknown }   # see GAPS.md
    # ⚠️ The two numeric segments are team IDs, but which is home vs away is
    # NOT documented. One weak sample suggests {home}-{away}. VERIFY before relying.
    home_away_order: unverified

  season_arg:
    rule: Always the year the season STARTED.
    examples:
      - "2025-26 NHL/NBA season -> 2025"
      - "2024-25 EPL season     -> 2024"
      - "2025 MLB season        -> 2025"

# ============================================================================
# FIELD DICTIONARIES
# NFL is well documented. Others are NOT — see GAPS.md.
# ============================================================================
fields:
  NFL:
    source: vendor Notion NFL doc
    confidence: high
    live_player:
      identity: [player, player_id, status, position, position_category]
      passing:  [completions, passing_attempts, passing_yards, passing_touchdowns,
                 passing_interceptions, passer_rating]
      rushing:  [rushing_attempts, rushing_yards, rushing_touchdowns, rushing_long]
      misc:     [fumbles_lost, forced_fumbles]
      fantasy:  [DK_fantasy_points]   # DraftKings scoring ONLY — do not use
    live_team:
      identity: [abbrv, mascot, record, division_name]
      scoring:  [score, offense_touchdowns, passing_touchdowns, rushing_touchdowns,
                 special_teams_touchdowns]
      offense:  [total_plays, total_yards, passing_yards, rushing_yards, first_downs,
                 turnovers, snap_count]
      defense:  [sacks, safeties, defense_touchdowns, defense_interceptions,
                 defense_fumble_recoveries, forced_fumbles,
                 total_passing_yards_allowed, total_rushing_yards_allowed,
                 points_against_defense_special_teams]
      special_teams: [kick_return_touchdowns, punt_return_touchdowns,
                      blocked_kick_touchdowns, blocked_punt_touchdowns,
                      interception_touchdowns, fumble_return_touchdowns,
                      field_goal_return_touchdowns, blocked_kicks, blocked_punts,
                      kicks_blocked, punts_blocked]
      two_point: [two_point_conversion_attempts, two_point_conversion_succeeded,
                  two_point_conversion_returns]
      penalties: ["penalties.total", "penalties.yards"]
    game_state:
      status:      [scheduled, delayed, postponed, suspended, canceled, inprogress, final, completed]
      season_type: [Preseason, "Regular Season", "WILD CARD", "DIV RD", "CONF CHAMP", "SUPER BOWL"]
      event_name:  [null, "Wild Card", "Divisional Round", "Championship", "Super Bowl"]
      round:       [null, 1, 2, 3, 4]
      game_status: ["<game time>", "<Time Quarter>", Final, "Final OT"]
    injuries:
      # Confirmed against the new OpenAPI spec. Five flat fields. That's all.
      envelope: "data.NFL[] -> { team, team_id, injuries[] }"
      fields: [player, player_id, injury, date_injured, returns]
      player_id_type: string      # ⚠️ STRING for NFL/MLB/NBA/NHL, INTEGER for SOCCER
      date_injured_format: >
        ⚠️ INCONSISTENT AND NOT ISO. Observed: "2026-1-29" (NFL, not zero-padded),
        "2026-04-15" (MLB), "Jul 20, 2026" (SOCCER). Parse defensively per sport.
      returns_field: >
        ⚠️ FREE-FORM PROSE, no enum. Observed values mix designations and
        narrative: "Probable", "60-Day IL", "Out For Season", "Week To Week",
        "Questionable For Start Of Training Camp", "TBA". You will need a
        normalization layer; do not treat this as structured.

      # ❌ ANSWERED DEFINITIVELY — practice participation does NOT exist.
      practice_participation: false
      practice_evidence: >
        Searched the entire new OpenAPI spec: `practice` = 41 hits, ALL of them
        "Best practices" prose. `participation` = 0. `DNP` = 0. `Limited` = 0.
        No day-of-week fields. The vendor was asked directly and did not answer
        this question; the spec settles it as a NO.
      practice_workaround: >
        For the Wed/Thu/Fri DNP-Limited-Full grid, parse official NFL.com injury
        reports separately. See live-gameday-architecture.md §6 Layer 1.

      # Cadence — materially slower than assumed. This SAVES money.
      update_cadence:
        vendor_quote: >
          "Injury information is collected each morning. On game days, we also
          collect an additional update approximately one hour before each game
          begins."
        schedule: daily each morning + ~T-1h before each game
        NOT_realtime: true
        source_policy: >
          "Our injury information is based on information officially reported by
          teams and made publicly available. We do not base injury statuses on
          rumours or observations from reporters."
        implication: >
          ⚠️ REVISE THE POLLING PLAN. There is no point polling /injuries every
          35s — the data only changes twice a day. Poll at ~06:00 local and again
          at T-90m per game. This is the OFFICIAL-REPORT layer, not the
          breaking-news layer.
          The "no rumours" policy is a RELIABILITY FEATURE: fewer false positives,
          which is what the developing-vs-confirmed UX needs. But it means a
          separate breaking-news source (e.g. Rotowire) is still REQUIRED for
          sub-hour injury news.

  NBA:
    confidence: low   # partial hints only
    live: [game_ID, status, game_status, home_team_name, away_team_name,
           "full_box.home_team.score", "full_box.away_team.score", game_time, clock]

