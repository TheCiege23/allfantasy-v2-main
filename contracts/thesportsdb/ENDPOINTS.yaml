open_questions:
  - id: livescore_sport_slug
    question: "Exact accepted slug for /livescore/{sport} for American football. Try American_Football."
    workaround: "Use /livescore/4391 (by league ID) — documented pattern, no ambiguity."
    blocking: nothing
  - id: livescore_nfl_actually_populated
    question: >
      The static livescore_all.json sample contains zero American Football rows
      (Ice Hockey, Basketball, Baseball, Soccer only). It is a May 2025 offseason
      snapshot, so weak evidence — but verify during an NFL game with a real key.
    blocking: livescore feature
  - id: player_stats_position_coverage
    question: "Does lookupplayerstats cover receiving/defensive stats, or mainly QB lines?"
    blocking: season-stat display
  - id: annual_lifetime_pricing
    question: "Annual and Lifetime tier prices (behind a toggle on /pricing)."
    blocking: nothing
  - id: artwork_license_clearance
    question: "Is displaying non-CC player headshots commercially defensible?"
    blocking: LEGAL — resolve before shipping headshots
