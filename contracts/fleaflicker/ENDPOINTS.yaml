--- # ============================================================================
# Fleaflicker Public API — Contract
# NORMATIVE for the two endpoints already integrated. The scoreboard endpoint
# below had its FIRST real probe on 2026-09-03 (see GAPS.md G-01) — its top-level
# envelope for a league with no schedule yet is now confirmed; the shape of an
# actual game/matchup row is still not, because the probed league had not drafted.
# Do not fill in the still-UNKNOWN parts of its `fields:` block from memory or
# from Fleaflicker's Swagger docs; probe it per README.md and paste the real
# shape in.
# Source (standings/rosters): this codebase's existing, working
#   lib/league-import/fleaflicker/FleaflickerLeagueFetchService.ts + types.ts,
#   now also backed by real fixtures — see fixtures/*.json.
# Captured: 2026-09-03
# ============================================================================

meta:
  vendor: Fleaflicker
  base_url: https://www.fleaflicker.com/api
  base_url_env: none   # no override exists in the codebase today
  contract_version: 0.4.0   # bumped: `season` is PER-ENDPOINT, not common — rules/activity 400 on it (G-08)
  captured_at: 2026-09-03
  docs_url: https://www.fleaflicker.com/api-docs/index.html
  data_classification: fantasy_platform   # not a real-world sports-data vendor; see README
  sla: none   # no published SLA found

# ============================================================================
auth:
  mechanism: none
  note: >
    Confirmed by the existing integration: fetchJson() in
    FleaflickerLeagueFetchService.ts sends only an `Accept: application/json`
    header. No token, no cookie, no signed request. Every league is readable
    by anyone who knows its `league_id` — see README's privacy note on that.

# ============================================================================
transport:
  common_query_params:
    sport:
      required: true
      values: [NFL, MLB, NBA, NHL]
      note: >
        This is the FULL set this codebase currently parses
        (parseFleaflickerSourceId's SPORT_SET). Fleaflicker itself may support
        more; do not add one here without a probe confirming it, per the
        "no guessing" rule this whole contract exists to enforce.
    league_id:
      required: true
      type: integer
      note: Platform-assigned, stable across seasons.
    season:
      required: per-endpoint   # <-- was `true`, and that was WRONG for four endpoints. See below.
      type: integer
      format: four-digit year
      # ⚠ These three lists must agree with each endpoint's own `params:` below, which
      # remains the authority. An endpoint appears in `accepted_by` ONLY if `params`
      # lists `season` AND we have a 200 to show for it.
      # ⚠ `FetchLeagueDraftBoard` is the sharpest case in this list: the season does not
      # merely select WHICH data comes back, it selects the ENVELOPE SHAPE — 2019 returns
      # `{draftOrder, rows, rosters}`, 2020 returns `{orderedSelections}`, 2021 returns
      # `{}`, all HTTP 200, all the same league. See that endpoint's note.
      accepted_by: [FetchLeagueStandings, FetchLeagueRosters, FetchLeagueScoreboard, FetchLeagueDraftBoard]
      rejected_by: [FetchLeagueRules, FetchLeagueActivity]
      # Not probed either way — do not assume. FetchLeagueBoxscore was drafted into
      # `accepted_by` above on the reasoning that it is scoreboard-shaped, and a
      # params-vs-lists consistency check caught it: its `params` are
      # [sport, league_id, fantasy_game_id, scoring_period] and contain no `season`.
      # That is precisely the unverified inference this contract exists to prevent.
      unknown_for: [FetchLeagueTransactions, FetchTrades, FetchLeagueBoxscore]
      note: >
        🛑 A SEASON AFTER THE LEAGUE'S LAST IS SILENTLY CLAMPED TO THE LAST ONE, AND
        RETURNS THAT SEASON'S COMPLETE, PLAYED DATA UNDER HTTP 200. It does not error,
        404, or return an empty envelope. Measured 2026-09-11 against league 206154,
        whose final season is 2021: season=2021, 2024, 2025, 2026 and 2099 all returned
        BYTE-IDENTICAL games — the same eight game ids and the same final scores.
        The parameter IS honoured within range (2019, 2020 and 2021 each return distinct
        game ids); the clamp only applies past the end.

        ⚠ AND THE ECHOED SEASON IS THE REQUEST, NOT THE PAYLOAD. FetchLeagueStandings
        returns a top-level `season` field that reads back whatever you asked for —
        `season: 2026` on a body containing 2021's standings. Reading it to find out what
        you got is circular. This retracts the previous note here, which said a season with
        no data "returns a normal envelope"; the envelope is normal but the DATA IS ANOTHER
        SEASON'S, which is far more dangerous — a writer asking for the current season on a
        dead league will happily persist five-year-old finals as this week's results.

        THE ONLY AUTHORITY FOR WHICH SEASON A SCOREBOARD BODY ACTUALLY DESCRIBES IS
        `schedulePeriod.low.season`. Assert it against the season you requested and refuse
        the payload when they differ.

        ══════════════════════════════════════════════════════════════════════════
        🛑 AND `season` IS NOT A COMMON PARAMETER AT ALL — SENDING IT TO THE WRONG
        ENDPOINT IS AN HTTP 400. This block previously said `required: true`, full
        stop, which is what a shared URL builder would be written against.

        Reported by the 2026-09-12 real-league audit, NOT re-probed here (no
        fixture captured; see G-08 in GAPS.md): `FetchLeagueRules` and
        `FetchLeagueActivity` return 400 when `season=2026` is included, and
        succeed with the parameter omitted entirely.

        ⚠ SO THE TWO FAMILIES FAIL IN OPPOSITE DIRECTIONS, AND THAT IS WHY ONE URL
        BUILDER CANNOT SERVE BOTH:

          standings / rosters / scoreboard   send season  -> 200, but SILENTLY
                                             CLAMPED past the league's last season.
                                             Wrong data, no error. Fails QUIETLY.

          rules / activity                   send season  -> 400. No data at all.
                                             Fails LOUDLY.

        A builder that appends `season` everywhere breaks rules and activity
        outright. A builder that drops it everywhere silently reads the wrong
        season's standings on any league whose current season has not started. The
        first bug you notice in an afternoon; the second can persist five-year-old
        finals as this week's results and nothing goes red.

        Build the query per endpoint from `params:` below — that list is the
        authority, and it already distinguishes them. `params` WITHOUT `season`
        means the parameter is rejected or unproven, never that it is optional.
        ══════════════════════════════════════════════════════════════════════════

  status_codes:
    200: Valid JSON response.
    400: >
      Malformed request for THAT endpoint — observed only as "sent `season` to an
      endpoint that does not take it" (FetchLeagueRules, FetchLeagueActivity;
      2026-09-12 audit). The existing client does not differentiate it from any
      other non-404 error, so today it surfaces as a generic API failure and the
      cause is invisible. Worth mapping to its own error before either endpoint is
      integrated.
    404: "No such league. FleaflickerImportLeagueNotFoundError in the existing client."
    other: Treated as a generic API error by the existing client; not yet differentiated.

  rate_limit:
    documented_hard_limit: none
    note: Nothing found; be polite, no established cadence to cite.

# ============================================================================
endpoints:
  FetchLeagueStandings:
    status: INTEGRATED
    method: GET
    path: /FetchLeagueStandings
    params: [sport, league_id, season]
    envelope: |
      {
        season: number,
        league: { id, name, logoUrl?, description?, size?, capacity?, maxKeepers?,
                   waiverType?, defaultWaiverBudget?, rosterRequirements? },
        divisions: [ { id, name, teams: [ TeamStub ] } ]
      }
    team_stub_fields:
      - id (integer)
      - name
      - logoUrl (nullable)
      - waiverAcquisitionBudget.value
      - recordOverall.{wins,losses,ties}
      - pointsFor.value
      - pointsAgainst.value
      - owners[].{id,displayName}
      - initials
    source_of_truth: lib/league-import/fleaflicker/types.ts (FleaflickerStandingsResponse, FleaflickerTeamStub);
      real fixture at fixtures/standings.NFL.json (league 356670, a 1/12-team pre-draft league,
      captured 2026-09-03)
    note: >
      Season TOTALS only. No per-week pairing exists here — this is why it
      cannot supply WeeklyMatchup rows on its own.

  FetchLeagueRosters:
    status: INTEGRATED
    method: GET
    path: /FetchLeagueRosters
    params: [sport, league_id, season]
    envelope: |
      { rosters: [ { team: TeamStub, players: [ { proPlayer: { id, nameFull?, position?, nameShort? } } ] } ] }
    source_of_truth: lib/league-import/fleaflicker/types.ts (FleaflickerRostersResponse);
      real fixture at fixtures/rosters.NFL.json — note this particular fixture has an empty
      `players` array on its one roster (the league has not drafted), so it does NOT
      demonstrate the `players[].proPlayer` shape; that part still rests on the existing
      TypeScript types only.
    note: No scores at all — current roster composition only.

  FetchLeagueScoreboard:
    status: INTEGRATED   # <-- promoted 2026-09-12: `lib/import-os/collector/fleaflickerMatchupParity.ts`
      # is a real caller. It was GAME_SHAPE_CONFIRMED_NOT_INTEGRATED, which was accurate for
      # exactly one day. Originally promoted
      # 2026-09-11 by a probe of a league with a REAL PLAYED SCHEDULE (206154, season 2021,
      # scoring_period 1 — fixtures/scoreboard.NFL.2021.week1.json, 8 final games). The game row
      # and its team identity are now observed, not guessed. Still NOT integrated: no caller
      # fetches this endpoint yet, and G-05(b)/G-06 (a future week inside an active season; a
      # bye) remain unobserved — a 16-team league plays 8 games and has no byes.
      #
      # ⚠ THE SEASON ON THIS LINE READ "2025" UNTIL 2026-09-11 AND WAS WRONG. The probe passed
      # season=2025; league 206154's last season is 2021, so the request was clamped and the
      # fixture is 2021 data (startEpochMilli 1631008800000 = 2021-09-07). See the `season`
      # note in common_query_params — nothing about the response said 2025 was not honoured
      # except `schedulePeriod.low.season`, which was sitting in the fixture the whole time.
    method: GET
    path: /FetchLeagueScoreboard
    path_confirmed_via: "https://www.fleaflicker.com/api-docs/index.html — vendor's own published
      Swagger docs, read 2026-09-03. This is READING DOCUMENTATION, not probing the live data
      API, so it did not need a real league_id and does not resolve G-01 by itself — see the
      note below."
    params: [sport, league_id, season, scoring_period]
    param_types:
      sport: "string — NFL | MLB | NBA | NHL, per the docs page"
      league_id: integer
      season: integer
      scoring_period: "integer, OPTIONAL — confirms GAPS.md G-03: it IS week-scoped, and this is
        the param name. CONFIRMED 2026-09-03: omitting it entirely and passing the CURRENT
        period's own `value` explicitly (both `1` here) returned byte-identical responses, so it
        defaults to the current scoring period rather than erroring or returning all weeks."
    envelope: |
      CONFIRMED (for a league with no schedule generated yet — see note):
      {
        schedulePeriod: SchedulePeriod,             # the current/default period
        eligibleSchedulePeriods: SchedulePeriod[]    # every period this league's season defines
      }
      SchedulePeriod = { ordinal: number, value: number, low: { ordinal: number, startEpochMilli: string (epoch ms, as a string) } }

      CONFIRMED 2026-09-11 for a league WITH a generated, played schedule
      (fixtures/scoreboard.NFL.2021.week1.json — league 206154, season 2021, period 1;
       and fixtures/scoreboard.NFL.2021.week16.json — same league, the championship week):
      {
        schedulePeriod: SchedulePeriod,
        eligibleSchedulePeriods: SchedulePeriod[],
        games: Game[]                              # the key; absent entirely pre-draft
      }
      Game = {
        id: number,                                # fantasy_game_id — the key FetchLeagueBoxscore takes
        home: Team, away: Team,                    # SAME shape as a FetchLeagueStandings team
        homeScore: { score: { value: number, formatted: string } },
        awayScore: { same },
        homeResult: "WIN" | "LOSE",                # observed values only; a tie was not observed
        awayResult: "WIN" | "LOSE",
        // EVERY FIELD BELOW IS OPTIONAL AND PRESENT ONLY WHEN TRUE — see the omission rule.
        isFinalScore?: true,
        isDivisional?: true,                       # regular-season weeks only
        isPlayoffs?: true,                         # playoff weeks only
        isConsolation?: true,                      # playoff weeks only
        isChampionshipGame?: true,                 # final week only
        isThirdPlaceGame?: true                    # final week only
      }

      🛑 A FALSE BOOLEAN IS OMITTED, NOT SENT AS `false`. This is the single most important
      fact about the row and it is proven per-row, inside ONE payload, not inferred from
      comparing weeks: in season 2021 period 14, rows 0-1 carry `isPlayoffs: true` and have
      NO `isConsolation` key, while rows 2-5 carry `isConsolation: true` and have NO
      `isPlayoffs` key. Period 16 likewise gives `isChampionshipGame` to exactly one row.
      (The same rule reaches nested objects: a team's `newItemCounts` is absent on some
      rows and present on others.)

      ⚠ THE CONSEQUENCE THAT WILL BITE A WRITER: `game.isFinalScore === false` IS NEVER
      TRUE. An unplayed or in-progress game does not say `isFinalScore: false` — it omits
      the key. Test `game.isFinalScore === true` for "final", and treat absence as
      not-final. Any code branching on `=== false`, or on `'isFinalScore' in game`, is
      dead or inverted.

      ⚠ AND THE FLAG SET VARIES BY WEEK TYPE, so the union above is not a fixed schema.
      Observed key sets: periods 1 and 13 → isDivisional; periods 14-15 → isPlayoffs |
      isConsolation; period 16 → isPlayoffs | isConsolation | isChampionshipGame |
      isThirdPlaceGame. Do not require any of them.

      ⚠ `games` IS ABSENT, NOT EMPTY, BEFORE A DRAFT. The pre-schedule fixture
      (scoreboard.NFL.json, league 356670) has no `games` key at all for any scoring_period.
      A writer must treat "no games key" as "nothing to write yet", never as a fetch failure.

      ⚠ A TIE WAS NOT OBSERVED. `homeResult`/`awayResult` are documented as the two values seen.
      Do not add a third from memory — probe a tied week, per the rule this contract exists for.
    fields:
      - "games[].home.id / games[].away.id: integer — THE SAME ID SPACE as
         FetchLeagueStandings and FetchLeagueRosters. PROVEN 2026-09-11, not inferred from the
         shape looking similar: all 16 scoreboard team sides in league 206154 season 2021 week 1
         joined to that league's own standings on id AND name, 16/16, zero mismatches. This is
         GAPS.md G-04, the field flagged as mattering most for correctness — a writer may join a
         matchup row to LeagueTeam on this id. The season-label correction above does not
         weaken it, and the reason is worth stating exactly: TEAM IDS ARE STABLE ACROSS
         SEASONS. Measured 2026-09-11 — league 206154's 2019 and 2021 standings share all 16
         team ids, and the 2021 week-1 scoreboard sides join 16/16 on id AND name to BOTH
         seasons' standings. So the join proves a shared id space, but it canNOT date a
         payload; only `schedulePeriod.low.season` can. A WeeklyMatchup writer keyed on this
         id is safe across seasons; a writer using it to infer WHICH season it holds is not."
      - "games[].id: integer — the fantasy_game_id FetchLeagueBoxscore takes."
      - "games[].homeScore.score.value: number (points); .formatted: string, pre-rounded by
         Fleaflicker. Prefer .value for arithmetic."
      - "games[].isFinalScore: OPTIONAL, present only as `true`. True for every game in both
         played-week fixtures. Absent means not final — the key is omitted, never sent as
         `false`. Read it as `=== true`; see the omission rule in the envelope."
      - "games[].isDivisional / isPlayoffs / isConsolation / isChampionshipGame /
         isThirdPlaceGame: OPTIONAL, present only as `true`, and which ones exist depends on
         the week type. Never require them and never read them as `false`."
      - "schedulePeriod.ordinal: integer, 1-indexed, matches value in every fixture seen so far"
      - "schedulePeriod.value: integer — the actual week/period number to pass as `scoring_period`"
      - "schedulePeriod.low.startEpochMilli: string — epoch milliseconds (as a JSON string, not a number) when this period starts"
      - "eligibleSchedulePeriods: array of the same SchedulePeriod shape, one per week in the season (17 for the 2026 NFL fixture)"
      - "schedulePeriod.low.season: integer — THE ONLY AUTHORITY for which season the body
         describes. Not the `season` you requested, which is clamped past the league's last,
         and not standings' top-level `season`, which echoes the request back."
    source_of_truth: "three real fixtures — fixtures/scoreboard.NFL.json (league 356670,
      season=2026, PRE-SCHEDULE: no games key; probed both without `scoring_period` and with
      `scoring_period=1`, identical byte-for-byte), fixtures/scoreboard.NFL.2021.week1.json
      (league 206154, season 2021 period 1, a played REGULAR-season week) and
      fixtures/scoreboard.NFL.2021.week16.json (same league, period 16, the CHAMPIONSHIP week —
      committed because its row carries a different flag set, which is the evidence for the
      false-omission rule)"
    note: >
      🛑 THE PRE-SCHEDULE ENVELOPE AND THE GAME ROW ARE BOTH CONFIRMED NOW; WHAT REMAINS
      UNOBSERVED IS AN UNPLAYED WEEK AND A BYE (GAPS.md G-05(b), G-06). The paragraph below
      records the pre-schedule half and is kept because it is still the evidence for "no games
      key before a draft"; its closing instruction — do not write a mapper against the game-row
      shape — was DISCHARGED on 2026-09-11 by the two played-week fixtures above.
      League 356670 ("Public League 96FCE6") was probed at membershipType CREATING_COMMISH, size
      1 of capacity 12, with a draftLiveTimeEpochMilli essentially AT the moment of the probe
      (2026-09-03T17:45Z, probed 2026-09-03T17:46Z) — i.e. a league that has not drafted and has
      no generated schedule. Its FetchLeagueRosters response has one roster with an EMPTY
      `players` array for the same reason. The scoreboard response for such a league carries only
      `schedulePeriod`/`eligibleSchedulePeriods` and nothing else — no games array, empty or
      otherwise. This is a genuinely new, real fact (folded into GAPS.md G-05), but it is a
      DIFFERENT case from what G-01/G-04 actually need: a real game/matchup row, with real team
      references, from a league that HAS drafted. Do not write a mapper against the game-row
      shape until that is captured — see GAPS.md G-01's remaining half.

  FetchLeagueRules:
    status: SHAPE_CAPTURED_NOT_INTEGRATED
    method: GET
    path: /FetchLeagueRules
    path_confirmed_via: "Fleaflicker's own published Swagger docs (https://www.fleaflicker.com/api-docs/index.html),
      read 2026-09-12. READING DOCUMENTATION, not probing the live data API — the same route that
      settled G-02 and G-03."
    params: [sport, league_id]
    param_types:
      sport: "string — NFL | MLB | NBA | NHL"
      league_id: integer
    note: >
      ⚠ TAKES NO `season`, AND THAT IS A REAL FACT ABOUT THE MODEL RATHER THAN AN OMISSION IN
      THE DOCS: rules belong to the league, not to a year. Do not send one — `scripts/probe.sh`
      deliberately builds a shorter query string for this endpoint, because documenting a
      response to a request nobody will ever make is worse than not documenting it.

      🛑 CONFIRMED THE HARD WAY 2026-09-12: sending `season` here is not merely pointless, it
      is an HTTP 400. This note previously read as style advice ("do not send one"); it is a
      hard constraint. The 2026-09-12 real-league audit got 400 with `season=2026` and 200
      with the parameter omitted. See `common_query_params.season` for why the sibling
      endpoints fail in the opposite direction, and G-08 for what is still unprobed.
    envelope: |
      CONFIRMED 2026-09-12 from fixtures/rules.NFL.json (league 206154, HTTP 200, 67KB):
      {
        rosterPositions: RosterPosition[],
        groups: ScoringGroup[],
        numStarters: number, numBench: number, maxActive: number, maxRosterSize: number,
        allScoringRuleTypes: Array<{ template: string }>
      }
      ScoringGroup = {
        label: string,                       # "Passing", "Rushing", … "Punting"
        allCategories: Category[],
        scoringRules?: ScoringRule[]         # ⚠ OPTIONAL — see the omission rule below
      }
      ScoringRule = {
        category: { id: number, abbreviation: string, nameSingular: string, namePlural: string },
        points: { value: number, formatted: string },
        forEvery?: number,
        pointsPer?: { value: number, formatted: string },
        description: string,                 # "1 point for every 25 Passing Yards (0.04 per)"
        applyTo: string[],                   # position codes the rule applies to
        applyToAll: boolean,
        template: string
      }
      RosterPosition = {
        label: string, group: string, eligibility: string[], colors: string[],
        min?: number, max?: number, start?: number   # ⚠ ALL THREE OPTIONAL
      }

      🛑 THE OMISSION CONVENTION AGAIN, AND IT IS NOW A PATTERN ACROSS THIS API RATHER THAN A
      SCOREBOARD QUIRK. A group with no rules omits `scoringRules` ENTIRELY instead of sending
      `[]`: in the committed fixture, `Punting` has `allCategories` (10) and NO `scoringRules`
      key at all, while the other seven groups carry 2-14 rules each. Likewise 14 of the 19
      `rosterPositions` omit `min`/`max`/`start` — every bench, IR, taxi and multi-eligibility
      slot. The scoreboard does the same with `games` (absent pre-draft) and with every false
      boolean. Treat ABSENT as the provider's way of saying "none", never as malformed, and
      never index into one of these without checking.

      ⚠ `pointsPer` AND `forEvery` ARE THE PAIR THAT ENCODES A RATE. "1 point for every 25
      passing yards" arrives as points.value 1, forEvery 25, pointsPer.value 0.04. Prefer
      `pointsPer.value` for arithmetic — it is the already-divided rate — and use
      `points`/`forEvery` only to render the rule the way Fleaflicker words it.
    source_of_truth: "fixtures/rules.NFL.json — league 206154, captured via scripts/probe.sh
      2026-09-12. Contains league configuration only: zero owner, user, email or team-name
      fields (checked, not assumed)."

  FetchLeagueActivity:
    status: DISCOVERED_NOT_CAPTURED
    method: GET
    path: /FetchLeagueActivity
    path_confirmed_via: "Vendor Swagger docs, read 2026-09-12."
    params: [sport, league_id, result_offset]
    note: >
      🛑 NOT CAPTURED, AND THE REASON IS PRIVACY RATHER THAN DIFFICULTY. This returns real
      people's transactions — who dropped whom, and when. A scoreboard's team names are already
      public-facing in a way a per-manager activity log is not, and this repo is PUBLIC. Capturing
      a fixture here is a decision for the repo owner about whose league is used, not a routine
      probe. `scripts/probe.sh activity` exists and carries the same warning.

      🛑 Takes no `season`, and sending one is an HTTP 400 — not a silent ignore. Reported by
      the 2026-09-12 real-league audit (400 with `season=2026`, 200 without). Paging is by
      `result_offset`. ⚠ Note what this means for whoever integrates it: the endpoint's FIRST
      failure mode is a parameter mistake that looks like an outage, because the existing
      client maps every non-404 to a generic error. See `common_query_params.season`.

  FetchLeagueTransactions:
    status: DISCOVERED_NOT_CAPTURED
    method: GET
    path: /FetchLeagueTransactions
    path_confirmed_via: "Vendor Swagger docs, read 2026-09-12."
    params: [sport, league_id, team_id, result_offset]
    note: >
      Same privacy consideration as FetchLeagueActivity. Differs from it by accepting `team_id`,
      so it can be scoped to one franchise. Takes no `season`.

  FetchTrades:
    status: DISCOVERED_NOT_CAPTURED
    method: GET
    path: /FetchTrades
    path_confirmed_via: "Vendor Swagger docs, read 2026-09-12."
    params: [sport, league_id, filter, result_offset]
    note: >
      Same privacy consideration. `filter`'s accepted values are UNKNOWN — the docs name the
      parameter without enumerating it, and guessing one is exactly the kind of assumption this
      contract exists to prevent.

  FetchLeagueBoxscore:
    status: DISCOVERED_NOT_YET_NEEDED
    method: GET
    path: /FetchLeagueBoxscore
    path_confirmed_via: "same docs page as FetchLeagueScoreboard above, same date"
    params: [sport, league_id, fantasy_game_id, scoring_period]
    note: >
      Found while resolving G-02, not asked for. Per-matchup detail keyed by a
      `fantasy_game_id` this contract has not seen the shape of yet — presumably a field on
      a FetchLeagueScoreboard row. Likely useful for lineup-level detail (bench vs. starters)
      beyond what a WeeklyMatchup row needs, but that is a future decision, not this one. Not
      probed; not blocking anything today.

  FetchLeagueDraftBoard:
    status: SHAPE_CAPTURED_NOT_INTEGRATED
    method: GET
    path: /FetchLeagueDraftBoard
    path_confirmed_via: "Fleaflicker's own published Swagger docs, read 2026-09-12 —
      documentation, not probing. Shapes then captured by scripts/probe.sh against league
      206154 (already this contract's subject league)."
    params: [sport, league_id, season, draft_number, external_id_type]
    param_types:
      sport: "string — NFL | MLB | NBA | NHL"
      league_id: integer
      season: "integer — accepted; see the 🛑 below, the response SHAPE depends on it"
      draft_number: "integer — documented; `1` is the observed default"
      external_id_type: "string — documented, NOT probed. Plausibly requests a foreign
        player-id space (sportradar et al). If it does, it is the cheapest route to cross-
        provider player identity and is worth a probe before any name-matching is written."
    note: >
      🛑 THIS ENDPOINT RETURNS TWO STRUCTURALLY DIFFERENT ENVELOPES, AND WHICH ONE YOU GET
      DEPENDS ON THE SEASON. Measured 2026-09-12 against league 206154, one league, one
      request otherwise identical:

        season=2019  ->  { draftOrder, rows, rosters }       a BOARD (grid of rounds)
        season=2020  ->  { orderedSelections }               a FLAT LIST
        season=2021  ->  { }                                 HTTP 200, zero keys
        no season    ->  { draftOrder, rows, rosters }       the largest payload

      A mapper written against either envelope alone reads the other as "no draft". This is
      not an error path — every one of those is HTTP 200.

      ⚠ THE PICK OBJECT IS THE SAME IN BOTH, WHICH IS WHAT MAKES A SINGLE MAPPER POSSIBLE.
      `rows[].cells[]` and `orderedSelections[]` hold the identical shape:
      `{ team, player, slot, color }`. So: flatten `rows[].cells[]` when `rows` is present,
