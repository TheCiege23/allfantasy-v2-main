name: Secret scan

# 🛑 WHY THIS EXISTS: A PR MERGED WITH GITHUB'S BUTTON RUNS NO LOCAL HOOK.
#
# `.githooks/pre-push` carries four guards. Three of them already have a CI
# counterpart or do not need one:
#
#   secret-scan.mjs            -> NOTHING RAN IT IN CI. This file is that gap.
#   push-queue.mjs             -> local ordering/cost only; meaningless server-side
#   check-inflight-prod-build  -> local ordering/cost only; meaningless server-side
#   pre-push-smoke.mjs         -> already covered by ts-error-ratchet.yml on pull_request
#
# The merge button (merge, squash OR rebase — all three) creates the commit
# server-side, so none of the four fire. Measured 2026-09-07: #677 and #678
# landed 48 seconds apart that way, both single-parent commits, with no guard
# consulted. On a PUBLIC repo the secret scan is the ONE guard that fails
# closed, and it was the one with no server-side counterpart at all.
#
# ⚠ A WORKFLOW ALONE DOES NOT BLOCK A MERGE. It has to be added to the branch
# protection required-checks list for `main`, or a PR can be merged while this
# is red. Adding the file is half the fix; the other half is a repo setting.
#
# ⚠ NO `npm ci` ON PURPOSE. scripts/secret-scan.mjs imports only Node stdlib
# (fs, path, url, child_process) and shells out once to `git ls-files -z`
# inside a try/catch. Installing dependencies would add minutes and a failure
# mode to a guard whose whole value is that it always runs.

on:
  pull_request:
    # No `branches:` filter, deliberately — the same reason no-ai-copy-guard.yml
    # gives: filtering PR runs to base main/master silently skipped every
    # stacked PR (one based on another branch), so those merged unchecked.
  push:
    branches: [main, master]

jobs:
  secret-scan:
    name: No credential-shaped values in tracked source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Runs WITHOUT --warn-only, so it fails closed: exit 1 on any
      # error-severity finding. Warnings alone exit 0 and do not block —
      # the repo carries a standing set of those (undocumented NEXT_PUBLIC_
      # vars), and failing on them would train everyone to bypass this.
      - name: Scan tracked source for credentials
        run: node scripts/secret-scan.mjs
