name: LeagueSafe Phase 1 database

on:
  pull_request:
    paths:
      - '.github/workflows/leaguesafe-phase1-db.yml'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'lib/leaguesafe/**'
      - '__tests__/leaguesafe-*.test.*'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'vitest.setup*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaguesafe-phase1-db-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  database:
    name: LeagueSafe Phase 1 migration and ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: af_phase1_test
          POSTGRES_DB: af_leaguesafe_phase1_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55481:5432
        options: >-
          --health-cmd "pg_isready -U af_phase1_test -d af_leaguesafe_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LS_PHASE1_TEST_DATABASE_URL: postgresql://af_phase1_test@127.0.0.1:55481/af_leaguesafe_phase1_test
      # Keep unrelated database access pinned shut. The suite uses only its guarded URL above.
      DATABASE_URL: postgresql://phase1_guard@127.0.0.1:1/phase1_guard
      DIRECT_URL: postgresql://phase1_guard@127.0.0.1:1/phase1_guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate the Prisma schema
        run: npx prisma validate
      - name: Test Phase 1 arithmetic and migration constraints
        run: >-
          npx vitest run
          __tests__/leaguesafe-dues-ledger.test.ts
          __tests__/leaguesafe-phase1-db.test.ts
          --pool=threads --maxWorkers=1
