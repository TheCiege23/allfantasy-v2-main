name: Landing Performance Budget

on:
  pull_request:
    # No `branches:` filter on purpose. Filtering PR runs to base
    # main/master silently skipped every stacked PR (a PR based on
    # another branch), so those merged with no real check coverage.
  push:
    branches: [main, master]

# Cancel this PR's previous run when the branch is updated; never touch a run on main.
#
# Nine small guard workflows fire on every PR push, each taking its own runner slot, and the repo's
# concurrent-job ceiling is the bottleneck (see unit-tests.yml). A PR pushed three times ran these
# guards three times, with the two superseded runs holding slots other PRs were queued for. Only
# the newest head's result is ever read.
#
# ⚠ PUSH RUNS GET A GROUP OF THEIR OWN (`github.run_id`), SO NOTHING ON MAIN CHANGES. A shared
# group on main would let a newer push evict the queued one, which is how playwright.yml's main lane
# ends up `cancelled` most of the day. Keyed by run id, every main push still runs to completion,
# exactly as before this block existed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo. Jobs that
# need more declare it at job level.
permissions:
  contents: read

jobs:
  landing-performance-budget-strict:
    name: Landing Perf Budget (strict)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allfantasy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allfantasy_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      PERF_BASE_URL: http://127.0.0.1:3000
      PERF_BUDGET_LCP_MS: "2800"
      PERF_BUDGET_CLS: "0.1"
      PERF_BUDGET_INP_MS: "250"
      AF_NEXT_DIST_DIR: .next-build-fix

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare DB schema
        run: npx prisma db push --skip-generate

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          nohup npm run start -- -p 3000 > /tmp/next-start.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000" > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          cat /tmp/next-start.log || true
          exit 1

      - name: Run landing performance budget gate
        run: npm run perf:landing-budget

      - name: Upload app startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-perf-next-start-log-strict
          path: /tmp/next-start.log
          retention-days: 7

  landing-performance-budget-warning:
    name: Landing Perf Budget (warning profile)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allfantasy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allfantasy_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      # Dummy key so `next build` can statically evaluate legacy routes that construct OpenAI clients.
      OPENAI_API_KEY: not-a-real-openai-key-ci-placeholder
      PERF_BASE_URL: http://127.0.0.1:3000
      PERF_BUDGET_LCP_MS: "3500"
      PERF_BUDGET_CLS: "0.15"
      PERF_BUDGET_INP_MS: "350"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare DB schema
        run: npx prisma db push --skip-generate

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          nohup npm run start -- -p 3000 > /tmp/next-start.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000" > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          cat /tmp/next-start.log || true
          exit 1

      - name: Run landing performance budget warning check
        id: perf_budget_warning
        continue-on-error: true
        run: npm run perf:landing-budget

      - name: Report warning budget breach
        if: steps.perf_budget_warning.outcome == 'failure'
        run: echo "::warning::Landing performance exceeded warning profile budgets (LCP/CLS/INP)."

      - name: Upload app startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-perf-next-start-log-warning
          path: /tmp/next-start.log
          retention-days: 7
