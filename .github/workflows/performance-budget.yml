name: Landing Performance Budget

# ⚠ NO LONGER RUNS ON PULL REQUESTS, as of 2026-10-01. The PR job was a looser "warning
# profile" with `continue-on-error`, not a required check, so it could never block a merge —
# yet each run was a full `next build` plus a browser, ~9 runner-minutes per PR, while
# required lanes queued up to 64 minutes for a runner. The strict profile below, with
# TIGHTER budgets, is the signal; run it by hand (workflow_dispatch) on a branch you suspect.
on:
  # The strict profile runs nightly against main, NOT on every push. Measured 2026-10-01: 37
  # push runs, each a full `next build` plus a browser, 415 runner-minutes, gating nothing
  # (it is not a required check) while PR jobs waited up to 64 minutes for a runner. A
  # nightly run still dates a strict-budget regression to one day's merges.
  schedule:
    - cron: '23 7 * * *'
  # So a suspected regression can be checked against main without waiting for the night.
  workflow_dispatch:

# Cancel this PR's previous run when the branch is updated; never touch a run on main.
#
# Nine small guard workflows fire on every PR push, each taking its own runner slot, and the repo's
# concurrent-job ceiling is the bottleneck (see unit-tests.yml). A PR pushed three times ran these
# guards three times, with the two superseded runs holding slots other PRs were queued for. Only
# the newest head's result is ever read.
#
# ⚠ PUSH RUNS GET A GROUP OF THEIR OWN (`github.run_id`), SO NOTHING ON MAIN CHANGES. A shared
# group on main would let a newer push evict the queued one, which is how playwright.yml's main lane
# ends up `cancelled` most of the day. Keyed by run id, every main push still runs to completion,
# exactly as before this block existed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo. Jobs that
# need more declare it at job level.
permissions:
  contents: read

jobs:
  landing-performance-budget-strict:
    name: Landing Perf Budget (strict)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allfantasy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allfantasy_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      PERF_BASE_URL: http://127.0.0.1:3000
      PERF_BUDGET_LCP_MS: "2800"
      PERF_BUDGET_CLS: "0.1"
      PERF_BUDGET_INP_MS: "250"
      AF_NEXT_DIST_DIR: .next-build-fix

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare DB schema
        run: npx prisma db push --skip-generate

      - name: Build app
        run: npm run build

      # The same gate Railway builds now pass before they may ship or publish a webpack cache
      # (scripts/next-build.cjs). Here it runs on a plain Linux build, so a Next upgrade that
      # changes the manifest shape the gate reads fails THIS job first, not a production deploy.
      - name: Root layout ships its stylesheet
        run: node scripts/lib/layout-css-gate.cjs

      - name: Start app
        run: |
          nohup npm run start -- -p 3000 > /tmp/next-start.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000" > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          cat /tmp/next-start.log || true
          exit 1

      - name: Run landing performance budget gate
        run: npm run perf:landing-budget

      - name: Upload app startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-perf-next-start-log-strict
          path: /tmp/next-start.log
          retention-days: 7
