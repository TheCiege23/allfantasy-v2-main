name: Decision Engine Boundary

on:
  pull_request:
    # No `branches:` filter, matching db-first-api-boundary.yml. Filtering PR runs to base
    # main/master silently skipped every stacked PR there, so those merged with no coverage.
  push:
    branches: [main, master]

# Cancel this PR's previous run when the branch is updated; never touch a run on main.
#
# Nine small guard workflows fire on every PR push, each taking its own runner slot, and the repo's
# concurrent-job ceiling is the bottleneck (see unit-tests.yml). A PR pushed three times ran these
# guards three times, with the two superseded runs holding slots other PRs were queued for. Only
# the newest head's result is ever read.
#
# ⚠ PUSH RUNS GET A GROUP OF THEIR OWN (`github.run_id`), SO NOTHING ON MAIN CHANGES. A shared
# group on main would let a newer push evict the queued one, which is how playwright.yml's main lane
# ends up `cancelled` most of the day. Keyed by run id, every main push still runs to completion,
# exactly as before this block existed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo. Jobs that
# need more declare it at job level.
permissions:
  contents: read

jobs:
  decision-engine-boundary:
    name: Decision Engine Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the guard diffs base..head, and a shallow clone cannot resolve the base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # No `npm ci` on purpose. scripts/check-decision-engine-boundary.mjs imports node:fs,
      # node:path and node:child_process and nothing else, so an install would buy nothing and
      # cost the slowest step in the job. If this guard ever grows a dependency, add it back.

      - name: Decision-engine boundary (changed files)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-decision-engine-boundary.mjs --changed --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            # No usable base (a branch's first push). The full scan REPORTS the backlog and exits
            # 0 by design, so this reports rather than blocks — it never silently passes as if it
            # had checked a diff.
            echo "No usable base sha; running the full backlog scan instead."
            node scripts/check-decision-engine-boundary.mjs
          fi
