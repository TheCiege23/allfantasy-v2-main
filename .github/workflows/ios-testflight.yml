# Builds the iOS shell (ios-app/) and uploads it to App Store Connect / TestFlight.
#
# MANUAL ONLY (workflow_dispatch). It never runs on push: the app is a thin
# WebView over allfantasy.ai, so a web deploy needs no new binary — rebuild only
# when ios-app/ itself changes. See docs/app-store/RUNBOOK.md.
#
# Signing is automatic, driven by an App Store Connect API key with the Admin
# role (it creates the distribution certificate). Required repository secrets:
#   APPLE_TEAM_ID                     10-character Team ID (BROWN PIG LLC)
#   APP_STORE_CONNECT_KEY_ID          the key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID       the Issuer ID shown above the key list
#   APP_STORE_CONNECT_API_KEY_P8      full contents of AuthKey_<KEYID>.p8
# None of them is ever echoed; the .p8 is written to the runner temp dir and
# deleted in an always() step.
name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version shown on the App Store (must match the version in App Store Connect)"
        required: true
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Sync web assets and plugins into the Xcode project
        run: npx cap sync ios

      - name: Check required secrets are present
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=0
          for name in TEAM KEY_ID ISSUER P8; do
            if [ -z "${!name}" ]; then echo "::error::secret for $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Write API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          echo "Uploaded build ${GITHUB_RUN_NUMBER}. It appears in App Store Connect after processing (~10-30 min)."

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
