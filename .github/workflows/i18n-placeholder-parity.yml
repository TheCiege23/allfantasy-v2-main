name: i18n placeholder parity

on:
  pull_request:
    # No `branches:` filter on purpose. Filtering PR runs to base
    # main/master silently skipped every stacked PR (a PR based on
    # another branch), so those merged with no real check coverage.
  # No push-to-main run, as of 2026-10-02. This check already passed on the PR's merge result, and a
  # rebase-merge cannot change its verdict; re-running it after every merge only queued another job
  # ahead of PR CI on the ~20 runner slots the account has. ts-error-ratchet.yml and unit-tests.yml
  # keep their main runs: they are the checks that catch two PRs which only break in combination.

# Cancel this PR's previous run when the branch is updated; never touch a run on main.
#
# Nine small guard workflows fire on every PR push, each taking its own runner slot, and the repo's
# concurrent-job ceiling is the bottleneck (see unit-tests.yml). A PR pushed three times ran these
# guards three times, with the two superseded runs holding slots other PRs were queued for. Only
# the newest head's result is ever read.
#
# ⚠ PUSH RUNS GET A GROUP OF THEIR OWN (`github.run_id`), SO NOTHING ON MAIN CHANGES. A shared
# group on main would let a newer push evict the queued one, which is how playwright.yml's main lane
# ends up `cancelled` most of the day. Keyed by run id, every main push still runs to completion,
# exactly as before this block existed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo. Jobs that
# need more declare it at job level.
permissions:
  contents: read

jobs:
  i18n-placeholder-parity:
    name: EN/ES placeholder parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Verify shared keys use matching {{placeholders}} in en vs es
        run: npm run test:i18n
