name: Spend guards

# Builds are ~100% of this project's Vercel bill: the 2026-08-27 invoice was
# $101.40, of which $100.90 was Build CPU Minutes (qty 34,338) and $0.50 was
# everything else. `vercel.json` was `{}` until 979ae7cf4 added the gate that
# skips non-production branches. Restoring `{}` restores the burn and NOTHING
# FAILS — the only signal is a bill four weeks later. This is that signal.
#
# The usual way it breaks is not malice: any worktree branched before 979ae7cf4
# still has the old `{}` on disk, and committing that copy reverts the gate
# silently. Two protections were removed exactly that way on 2026-08-27 alone.

on:
  pull_request:
    # No `branches:` filter, matching cron-budget.yml and i18n-placeholder-parity:
    # filtering PR runs to main silently skipped every stacked PR, and a stale
    # vercel.json is precisely the kind of change that arrives on one.
  # No push-to-main run, as of 2026-10-02. This check already passed on the PR's merge result, and a
  # rebase-merge cannot change its verdict; re-running it after every merge only queued another job
  # ahead of PR CI on the ~20 runner slots the account has. ts-error-ratchet.yml and unit-tests.yml
  # keep their main runs: they are the checks that catch two PRs which only break in combination.

# Cancel this PR's previous run when the branch is updated; never touch a run on main.
#
# Nine small guard workflows fire on every PR push, each taking its own runner slot, and the repo's
# concurrent-job ceiling is the bottleneck (see unit-tests.yml). A PR pushed three times ran these
# guards three times, with the two superseded runs holding slots other PRs were queued for. Only
# the newest head's result is ever read.
#
# ⚠ PUSH RUNS GET A GROUP OF THEIR OWN (`github.run_id`), SO NOTHING ON MAIN CHANGES. A shared
# group on main would let a newer push evict the queued one, which is how playwright.yml's main lane
# ends up `cancelled` most of the day. Keyed by run id, every main push still runs to completion,
# exactly as before this block existed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo. Jobs that
# need more declare it at job level.
permissions:
  contents: read

jobs:
  spend-guards:
    name: Spend guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # No `npm ci`. The check reads vercel.json with the Node standard library
      # and has no dependencies, so installing would be most of the runtime for
      # nothing — same reasoning as cron-budget.yml.
      - name: Check the Vercel build gate is intact
        run: node scripts/check-vercel-build-gate.mjs

      # Separate step so the log says WHICH guard broke without reading the diff.
      - name: Check no AI provider boundary lost its spend guard
        run: node scripts/check-ai-spend-guard-count.mjs
