name: Unit tests

# WHY THIS EXISTS
# Vitest has never run in CI. 1,609 unit test files, and not one of them could
# block a merge. On 2026-08-20 five tests sat red on main across three separate
# merged PRs (#545, #554) and nothing anywhere reported it -- the failures were
# only found by running the suite by hand while chasing an unrelated bug.
#
# WHAT THIS ENFORCES: A RATCHET, NOT A GREEN SUITE.
#
# The first CI run measured the truth: ~110 test files and ~300 tests are ALREADY
# failing on main. Requiring a green suite would block every merge in the repo,
# which is the trap playwright.yml documents for its red core shards. So this
# follows ts-error-ratchet.yml instead -- allowlist the known-bad set in
# scripts/vitest-failure-baseline.json, and fail only when a file that was
# PASSING starts failing. The debt cannot grow; it can only be driven down.
#
# ⚠ ALL FOUR SHARDS ARE REQUIRED CHECKS ON MAIN. VERIFIED, NOT ASSUMED:
#
#   gh api repos/TheCiege23/allfantasy-v2-main/branches/main/protection #     --jq '.required_status_checks.contexts'
#
#   → [... "Unit tests (1/4)", "(2/4)", "(3/4)", "(4/4)"], strict: true
#
# ⚠ THIS BLOCK SAID "NOT A REQUIRED CHECK YET" LONG AFTER IT WAS ONE, and a peer
# session told its user this job was advisory on the strength of that sentence.
# Whoever promoted it did so via the API — exactly as this file instructs — and
# left the prose behind. If you change the protection, change these lines in the
# same commit; this comment is the first thing anyone reads and it was wrong for
# most of a day.
#
# ⚠ DIRECT PUSHES TO MAIN STILL SUCCEED because enforce_admins is false. That is
# not the gate being lenient — it means every push straight to main bypasses four
# required checks, and a PR is blocked by exactly what a push sails past.
#
# Health, measured 2026-08-27:
#
#   ~5 minutes a shard in CI, not the 25-minute timeout this file allows
#   green on main at 3b461765c and 1a6435d0a
#
# 22 files were red outside the baseline that day: 20 were tests that had
# stopped matching correct code, 2 were real defects. The lopsidedness is the
# point — an unenforced gate does not merely miss regressions, it accumulates
# false ones until the signal is unreadable.
#
# ⚠ A LOCAL RUN IS NOT EVIDENCE ABOUT THIS SUITE. On a machine shared with other
# sessions, vitest reports healthy files as failures — measured, 7 of 12 in one
# run. Three different causes wear the same "Failed to start forks worker" mask:
# CPU contention, MEMORY exhaustion (concurrent `tsc --noEmit` at ~4 GB each is
# the usual culprit), and a REAL error hidden underneath, most often
# `DATABASE_URL is not set` because lib/prisma builds its client at module scope.
# Re-run alone, and if it still fails, READ THE ERROR. CI is the trustworthy
# verdict, and `vitest-ratchet.mjs --update` must never be run from a local full
# suite: it would write those false positives in as permanent allowances.
#
# If you change the shard count, the context NAMES change with it and the old
# names become un-reportable. Update branch protection in the same change.
#
# ⚠ A required context that never reports blocks every PR in the repo, forever.
# If you change the shard count, the context NAMES change with it, and the old
# names become un-reportable. Update branch protection in the same change.

on:
  pull_request:
    # No `branches:` filter, matching ts-error-ratchet.yml: filtering PR runs to
    # base main silently skipped every stacked PR, so those merged uncovered.
    #
    # ⚠ NEVER ADD A `paths:`/`paths-ignore:` FILTER TO THIS TRIGGER. These four
    # contexts are REQUIRED, and a workflow skipped by a path filter never
    # reports — the PR then waits on a check that will never arrive. Measured
    # separately: a filter would have skipped 1 of the last 52 commits anyway,
    # so it buys ~1% and risks locking the repo.

  # ⚠ `push: branches: [main]` WAS REMOVED, DELIBERATELY. It is the direct cause
  # of main having no verdict, and no grouping fixes it — grouping only decides
  # WHICH runs starve. Both options were measured on 2026-08-27 and both failed:
  #
  #   group per SHA   every push completes → saturates the account's concurrent
  #                   JOB slots. 27 completed, 2 running, ELEVEN QUEUED, ~17 min
  #                   before a run started. Ten workflows fire on every push here
  #                   and this one contributes four shards to each.
  #   one group       a started run finishes, but GitHub keeps only ONE pending
  #                   run per group and cancels the older one when a newer commit
  #                   arrives. At 111 pushes/day almost everything died PENDING:
  #                   ten consecutive runs cancelled with jobs_started=0/0.
  #
  # Per-commit coverage was never actually available at this push rate. The file
  # already concluded that — "a recent verdict or none" — so this makes it
  # explicit instead of emergent.
  schedule:
    # Every 15 minutes, off the top of the hour. :00 is the most contended slot
    # on GitHub's shared scheduler and the cron tier measured only 7 of 24 hourly
    # triggers actually firing there.
    #
    # ⚠ FREQUENT IS SAFE HERE, AND THAT IS THE WHOLE POINT: cancellation stops
    # mattering once the trigger is a clock rather than a commit. Every run tests
    # whatever main is NOW, so a superseded run loses nothing, and `concurrency`
    # below bounds it at one running plus one pending regardless of how many fire.
    # GitHub also drops scheduled runs under load, so treat this as a floor.
    - cron: "7,22,37,52 * * * *"

  # So a verdict can be FORCED without pushing a commit. There was no way to do
  # that during the incident this change came out of, which is why "is main
  # green" stayed unanswerable for hours.
  # ⚠ RESTORED 2026-08-28. The schedule above replaced this trigger, and as of
  # 01:49Z it had not fired ONCE — five slots missed in eighty minutes, while
  # `cron-fast-tier` and `cron-slow-tier` fired normally in the same window, the
  # workflow reporting `state=active` and the cron verified well-formed on main.
  # So main had NO automatic verdict at all: push did not trigger it and the
  # clock had not started.
  #
  # ⚠ THIS IS NOT A REVERSAL OF WHY IT WAS REMOVED. Per-push runs could not get
  # runners under a GROUP-PER-SHA concurrency rule, which let every push start a
  # parallel run and saturate the account's job ceiling. That rule is gone — the
  # group below is now a single `main` bucket holding one running plus one
  # pending, so a push storm collapses to the same load the clock produces.
  # Measured under exactly that rule: push-triggered runs completed at 00:03,
  # 00:05, 00:08, 00:34 and 00:49.
  #
  # Kept ALONGSIDE the schedule, not instead of it. If the cron starts firing
  # this costs nothing, and neither trigger is then a single point of failure.
  push:
    branches: [main]
  workflow_dispatch:

# ⚠ THIS GROUPED EVERY PUSH TO MAIN UNDER ONE KEY AND CANCELLED IN PROGRESS, so
# with 111 commits landing on main in a day the suite was killed by the next push
# almost every time. Measured 2026-08-27: of the last 25 runs, 16 were `cancelled`
# and not one of those produced a verdict. A gate that never finishes cannot be
# promoted to a required check, and cannot even be OBSERVED green, which is the
# standard this file sets for itself below.
#
# So the two cases are separated, because they are not the same case:
#
#   pull_request  cancel. A superseded PR run tells you nothing except that you
#                 pushed again, and the run that matters is the one on the head
#                 you are asking to merge. Grouping by PR NUMBER (not by ref)
#                 keeps that precise.
#   push to main  ONE group, and never cancel a run that has STARTED. GitHub runs
#                 one per group and keeps at most one pending, dropping an older
#                 pending run when a newer commit arrives. So a started run always
#                 finishes and reports, while the backlog is bounded at one.
#
# ⚠ A GROUP PER SHA WAS THE FIRST ATTEMPT AND IT WAS WRONG. It made every push
# run to completion, which removed the cancellations — and then saturated the
# account's concurrent-job ceiling instead. Measured: 27 completed, 2 in progress
# and ELEVEN QUEUED, with runs sitting ~17 minutes before starting. Runner minutes
# are free on a public repo; concurrent JOB SLOTS are not, and nine workflows fire
# on every push here, this one contributing four shards each. A required check
# that queues for 17 minutes is barely better than one that gets cancelled.
#
# ⚠ THE TRADE, STATED: main gets a verdict on RECENT commits, not on every one.
# At 111 pushes a day against a 5-minute suite, per-commit coverage was never
# actually available — the choice is between a recent verdict and none.
concurrency:
  group: unit-tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # Sharded because the suite is large. Each shard is an independent check
    # context, so a promotion has to list all four.
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One shard failing must not cancel the others: the first CI run of this
      # suite is a measurement, and a partial picture is worth much less.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Vitest ratchet, shard ${{ matrix.shard }} of 4
        # The ratchet -- not bare vitest. ~110 files are already failing on main, so a bare run
        # fails every time and protects nothing. This fails only when a file that was PASSING
        # starts failing. Integration tests are excluded inside the script: 10 of them need a live
        # Postgres, and a unit gate that needs a database fails for reasons unrelated to the code
        # under review.
        run: node scripts/vitest-ratchet.mjs --shard=${{ matrix.shard }}/4

      - name: Upload this shard's result
        # ALWAYS, including on failure: this file is how the baseline gets rebuilt. Scraping the
        # job log was tried and is not reliable -- GitHub truncated one shard's log before its
        # summary, which would have produced a baseline missing a quarter of its entries. Every
        # missing entry then reads as a fresh regression and blocks merges.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-ratchet-shard-${{ matrix.shard }}
          path: vitest-ratchet-result.json
          if-no-files-found: warn
