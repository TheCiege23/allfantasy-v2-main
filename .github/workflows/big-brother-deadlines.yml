name: Big Brother deadlines
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Inspect pending actions without changing leagues'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: big-brother-deadlines
  cancel-in-progress: false
jobs:
  deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Follow .nvmrc (package.json engines: 24.x); floating LTS selected Node 26.
          node-version-file: .nvmrc
      - name: Process deployed deadlines and reminders
        run: node scripts/big-brother-deadlines.mjs
