name: Tournament pilot database test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tournament-pilot-database-test
  cancel-in-progress: false

jobs:
  isolated-pilot:
    name: Isolated 64-manager NBA setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOURNAMENT_PILOT_DATABASE_URL: ${{ secrets.TOURNAMENT_PILOT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require the isolated pilot connection
        run: |
          if [ -z "$TOURNAMENT_PILOT_DATABASE_URL" ]; then
            echo "Add the TOURNAMENT_PILOT_DATABASE_URL repository secret before running this test." >&2
            exit 1
          fi
      - run: npm ci
      - name: Run the isolated tournament pilot
        run: node artifacts/tournament-pilot-staging-cli.cjs test
