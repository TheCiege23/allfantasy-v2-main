name: Cron fast tier

# Drives the 12 sub-hourly crons declared in cron-schedule.json from a single long-running job.
#
# WHY THIS EXISTS
# GitHub schedules cannot fire more often than hourly. The slow tier
# (.github/workflows/cron-slow-tier.yml) covers the 25 hourly-or-slower jobs by firing one request
# per trigger. That approach cannot express "every 2 minutes", so this workflow instead starts
# hourly and TICKS INTERNALLY for the rest of the hour.
#
# 🛑 THIS IS THE EXECUTOR NOW. DO NOT DELETE IT.
# It began as a workaround for a billing outage, and this comment used to say "DELETE THIS WORKFLOW
# when the host's scheduler returns." That is no longer true and following it takes production
# down. PR #621 (merged 2026-08-24) moved the registry out of vercel.json into cron-schedule.json;
# vercel.json is now `{}`, so Vercel registers ZERO cron jobs and these two workflows are the only
# thing running any of the 42.
#
# Acting on the old instruction on 2026-08-24 caused a ~3-hour total cron outage: both tiers were
# disabled the same night #621 emptied vercel.json, `vercel crons ls` returned "No cron jobs
# found", and nothing detected it — the only things that could have noticed were themselves crons.
# Recovered with `gh workflow enable "Cron fast tier"` / `"Cron slow tier"`.
#
# ⚠ IF VERCEL-NATIVE CRONS ARE EVER RESTORED, disable these — but confirm with `vercel crons ls`
# against the LIVE project first, never by assumption. A green deploy with crons declared in
# vercel.json proves nothing about registration: on 2026-08-23 two production builds succeeded with
# all 42 declared while Vercel had registered none of them. Leaving both schedulers running
# double-fires every fast job: two live-score-ticks every two minutes, each holding a 105s internal
# poll loop against the same provider.
#
# COST: this repo is PUBLIC, so Actions minutes are unmetered. Do not port this to a private repo
# without doing the arithmetic first — a 55-minute job every hour is ~40,000 minutes a month, and
# the free allowance for private repos is 2,000.
#
# REQUIRED CONFIGURATION (identical to the slow tier)
#   repository variable  APP_URL      e.g. https://www.allfantasy.ai
#   repository secret    CRON_SECRET  the same value the deployed app reads
# With either missing the script logs a notice and exits green rather than failing every hour.
#
# ⚠ SCHEDULES ONLY FIRE FROM THE DEFAULT BRANCH. Use workflow_dispatch to test from a branch.
#
# ⚠ GAPS ARE EXPECTED. GitHub queues scheduled runs behind a shared pool and can delay them by
# many minutes under load; the window is 55m against a 60m trigger, so a late start leaves a real
# hole. This restores most of the cadence, not all of it — a 2-minute job is not guaranteed to be
# 2 minutes late at worst, and nothing here should be relied on for correctness that a missed tick
# would break.
#
# ⚠ TWO TRIGGERS, AND NEITHER IS AT :00 — THE LOOP WAS NEVER THE PROBLEM, THE TRIGGER WAS.
# Measured 2026-08-27: only **7 scheduled runs fired in 24h against 24 expected**, with gaps of
# 149/133/164/232/259/227 minutes between starts. Every run that DID fire completed its full window
# (55.4-56.3m), so nothing was dying early — GitHub was simply dropping ~70% of the triggers, and
# 7 x 55m is ≈27% coverage of the day.
#
# `0 * * * *` is the single most contended slot on GitHub's shared scheduler: everyone writes top
# of the hour, and that is exactly when runs get delayed or dropped. Moving to :03/:33 leaves the
# stampede, and the second trigger is redundancy — two chances per hour for one to land.
#
# ⚠ THIS CANNOT DOUBLE-FIRE, and that is what makes a second trigger safe rather than reckless:
# `concurrency: cancel-in-progress` below guarantees exactly one loop at a time, so a :33 start
# REPLACES a running :03 loop with a fresh 55m window instead of ticking alongside it. Runner cost
# is unchanged (~60 min/hour of continuous single-loop coverage either way).
#
# ⚠ KEEP THE WINDOW AT 55m, NOT 30m, even though the triggers are now 30m apart. The 55m window is
# what makes a DROPPED trigger survivable: if :33 never fires, the :03 run still covers the hour.
# Shrinking it to match the trigger cadence would re-open the exact hole this change closes.

on:
  schedule:
    # ⚠ FOUR ATTEMPTS AN HOUR, AND NONE OF THEM ON :00.
    #
    # Measured 2026-08-28: with two attempts (:03, :33) only 7-9 scheduled runs STARTED in 24h
    # against 48 requested — roughly 27% coverage, with 1-5 hour holes. The loop itself is
    # healthy (55.4, 55.4, 55.5, 55.5, 55.7, 56.3m windows); what fails is GitHub's shared
    # scheduler DROPPING the trigger under load. Top of the hour is the most contended slot,
    # which is why :00 is avoided entirely.
    #
    # More attempts cannot double-fire: `concurrency.cancel-in-progress` below means a later run
    # REPLACES an earlier one. That replacement is a clean handoff, not a loss — measured
    # 2026-08-26, runs cancelled at 45m and 51m were each superseded immediately and coverage was
    # continuous 18:00-20:32Z. The cost of a truncated window is one restart; the cost of a
    # dropped trigger is an hour of nothing.
    - cron: "3 * * * *"
    - cron: "18 * * * *"
    - cron: "33 * * * *"
    - cron: "48 * * * *"
  workflow_dispatch:
    inputs:
      window_minutes:
        description: "How long to keep ticking (minutes). Default 55."
        required: false
        default: "55"
      dry_run:
        description: "List the jobs and their intervals without sending requests."
        type: boolean
        required: false
        default: false

# One loop at a time. A new hourly run REPLACES a lingering one rather than queueing behind it:
# queueing would let two loops tick the same jobs at once, which is the exact double-fire this
# workflow otherwise takes care to avoid.
concurrency:
  group: cron-fast-tier
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    # Above the 55m window plus drain, below the hour. The window is the real control; this is the
    # backstop for a loop that somehow fails to exit.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # No `npm ci`. The loop uses only the Node standard library and global fetch, so installing
      # would be most of the runtime for nothing — same reasoning as cron-slow-tier.yml.
      #
      # Every ${{ }} value goes through `env:` and is referenced as "$VAR", never interpolated into
      # the script text. A workflow_dispatch input is attacker-controlled text as far as the shell
      # is concerned, and this repo is public.
      - name: Tick fast-tier crons
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_WINDOW: ${{ inputs.window_minutes }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          WINDOW="${INPUT_WINDOW:-55}"
          case "$WINDOW" in
            ''|*[!0-9]*) echo "::error::window_minutes must be a positive integer"; exit 1 ;;
          esac
          DRY=""
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then DRY="--dry-run"; fi
          node scripts/cron-fast-tier-loop.mjs --window-minutes "$WINDOW" $DRY
