name: Deploy verify

# Checks what production actually SERVES after a deploy, for the redirect class that broke
# silently on 2026-09-02: every verification email, password-reset link, Yahoo connect and beta
# invite redirected to https://0.0.0.0:8080 -- the address the server bound to, not the host the
# visitor reached. Nothing threw, nothing logged, no test went red. A user reported it.
#
# WHY A DEPLOYED CHECK WHEN A SOURCE GUARD ALREADY EXISTS
# __tests__/no-bind-address-origins.test.ts stops the source pattern returning, and runs in Unit
# tests. It cannot see the ways this comes back WITHOUT a source change: a bad PUBLIC_SITE_URL
# (that variable held the literal string "[SENSITIVE]" for part of 2026-09-03 and only a hardcoded
# fallback kept links working), an edited start command, or a Next upgrade that changes how
# attachRequestMeta builds req.url. Those are invisible to any test that reads the repo.
#
# ⚠ IT VERIFIES THE BUILD, NOT "THE SITE". On push it waits for /api/af-debug/sha to report the
# pushed commit before asserting anything, and fails with NOT_DEPLOYED if it never arrives. That
# third outcome is the one that would have caught 2026-09-02 on its own: auto-deploy was silently
# off, two commits sat unshipped for an hour, and every probe against the stale build passed.
#
# COST: seven requests per run, plus a SHA poll every 30s while waiting. Deliberately small -- a
# cold container here has been saturated by five concurrent cron jobs before, and a monitor that
# contributes to the outage it is watching for is not worth having.

on:
  push:
    branches: [main]
  schedule:
    # Daily backstop. A push-triggered run covers regressions that ship with a commit; this covers
    # the ones that arrive with no commit at all -- a changed env var, a rolled-back deploy, a
    # platform change. Once a day is enough for something no deploy is driving.
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      expect_sha:
        description: 'Wait for this commit to be live before checking (blank = check whatever is deployed now)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One run at a time, and a running one is NEVER cancelled.
  #
  # ⚠ THIS USED TO BE cancel-in-progress: true, AND THAT STARVED THE CHECK. Builds take ~20 min
  # and on 2026-09-24 main took a push every 15-20 min, so each run was cancelled by the next
  # push before its build landed -- and a cancelled run shows grey, not red. The script now
  # accepts a DESCENDANT of its commit as deployed (production routinely skips straight past a
  # commit when a newer build finishes first), so a running wait ends as soon as ANY build
  # containing its commit is live, and cancelling it can only lose a verification.
  #
  # GitHub still keeps at most one PENDING run per group and replaces an older pending run
  # with a newer one. That is fine: the newer commit contains the older, so the run that does
  # start verifies both.
  group: deploy-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployed redirects
    runs-on: ubuntu-latest
    # Must exceed VERIFY_WAIT_MINUTES below plus the probes (~2 min, up to ~6 with retries).
    # 20 was set when builds took under 15 minutes; they now take 16-21.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # No dependencies on purpose: the script uses only global fetch. `npm ci` on this repo takes
      # minutes, has failed part-way at least three times on 2026-09-03 alone, and a monitor that
      # cannot run because the install broke is a monitor that reports nothing.

      # Input passed through env: and read as a shell variable, never interpolated into the script
      # text -- the convention the cron workflows in this directory already follow.
      - name: Verify
        env:
          PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          INPUT_SHA: ${{ inputs.expect_sha }}
          # Runners are data-centre IPs, which the VPN gate refuses; the script sends this as
          # a machine credential so it probes the real pages, not /vpn-blocked. See the script.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # How long to wait for the pushed commit (or a descendant) to be served. Measured
          # 2026-09-24: 16-21 min from push to live. Raise it if builds get slower; keep
          # timeout-minutes above it.
          VERIFY_WAIT_MINUTES: "40"
          # Read-only: the GitHub compare API answers "does the served commit contain the
          # pushed one?", which a fetch-depth-1 checkout cannot answer with local git.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="${INPUT_SHA:-${PUSH_SHA:-}}"
          if [ -n "$TARGET" ]; then
            node scripts/verify-deployed-redirects.mjs "--expect-sha=$TARGET"
          else
            node scripts/verify-deployed-redirects.mjs
          fi
