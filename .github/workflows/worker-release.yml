name: Advance worker-release

# Fast-forwards the `worker-release` branch to `main` on a schedule, so the cron worker redeploys
# ONCE A DAY instead of on every push.
#
# WHY THIS EXISTS
# `allfantasy-v2-worker` is the cron executor -- `vars.APP_URL` points at it and every slow- and
# fast-tier job is an HTTP request to it. It has no human users. It was also tracking `main`, so it
# took 24 deployments on 2026-09-07 alone, roughly one every 13 minutes.
#
# Railway tears the old container down as soon as the new one is live, and by default configures no
# overlap or draining window. Every request still in flight at that instant dies. For the website
# that costs almost nothing -- a page load is over in under a second, so the swap usually catches
# nothing: `allfantasy-v2-main` logged 5 errors in 11,912 requests (0.04%) over the same 24h. The
# worker holds 90-300s cron requests, so a swap almost always catches something. Measured over that
# window, the separation is total:
#
#     8 hours with no deployment    ->   0 server errors
#     17 hours with a deployment    ->  all 95
#
# Cutting the cadence is what removes those, and it halves this service's Railway build spend as a
# second-order effect -- the worker was building the whole Next app 24 times a day to run crons that
# do not care about the tip of main.
#
# 🛑 THIS FILE IS HALF THE CHANGE. The other half is a Railway setting: the `allfantasy-v2-worker`
# service must track `worker-release` instead of `main`. Until it does, this workflow maintains a
# branch nothing deploys from, and the worker keeps redeploying on every push exactly as before.
#
# ⚠ AND THE FAILURE MODE OF THE PAIR IS SILENT STALENESS, WHICH IS THE WORSE HALF. A worker pinned
# to a branch nothing advances runs old code indefinitely while every cron keeps returning 200 and
# every freshness probe stays green -- the same shape as an ingestion module with no scheduled
# caller. Two things guard it, and neither is free:
#   - this run prints how far behind `worker-release` was, so the lag is visible in the Actions log;
#   - GitHub disables scheduled workflows after 60 days of repo inactivity (see the header of
#     cron-slow-tier.yml), which would stop the advance with no error. If this repo ever goes quiet,
#     check that the worker is still being advanced before trusting a green cron dashboard.
#
# ⚠ FAST-FORWARD ONLY, NEVER FORCE. `worker-release` is only ever written here, so a non-fast-forward
# means somebody pushed to it by hand. That deserves a red run and a look, not a silent overwrite of
# whatever they were doing.
#
# ⚠ NOT GATED ON CI. Gating the advance on a green `main` sounds obviously right and is not: the
# Playwright lanes on this repo have been red for a long stretch, and a gate on a suite that is
# rarely green is a gate that never opens -- which lands you in the silent-staleness case above,
# having chosen it on purpose. If you add a gate, gate on a check that is actually green on main.

on:
  schedule:
    # 🛑 GITHUB DOES NOT RUN A SCHEDULE ON TIME, SO THE SLOT HAS TO SURVIVE BEING LATE (2026-11-23).
    # This was one run at 21:20 UTC. The 2026-11-22 run started at 01:48 UTC -- 4h28m late -- and the
    # 2026-11-23 run had not started by 23:17, so a fix merged at 03:43 sat unshipped all day while
    # the worker kept sending pushes it had already been fixed not to send. 21:20 UTC is also inside
    # Sunday's late NFL games, and four hours late is prime time: the container swap kills in-flight
    # live-scoring requests.
    #
    # So: three attempts inside the quiet window (13:00-16:30 UTC, 8-11:30 AM ET). No daily
    # slow-tier job runs there (they sit 03:00-12:00), and no US league plays. The first attempt
    # that runs advances; the later ones see it and stop, so the worker still deploys once a day.
    # An attempt that GitHub starts OUTSIDE the window cancels itself instead of deploying into a
    # game, and the next morning catches up. A build takes ~11 minutes, so the swap lands by ~16:45,
    # before any Saturday college kickoff.
    - cron: "20 13 * * *"
    - cron: "20 14 * * *"
    - cron: "20 15 * * *"
    #
    # 🛑 AND GITHUB CAN DROP ALL THREE (2026-11-24: none was created at all). So the `allfantasy-cron`
    # Railway service, which ticks on its own clock, checks at 13:50/14:50/15:50 UTC and, if no attempt
    # has succeeded, dispatches this workflow with catchup=true (scripts/worker-release-catchup.mjs).
    # A catch-up run is treated exactly like a scheduled attempt: same window, same "already done"
    # check, no cooldown override.
  workflow_dispatch:
    inputs:
      catchup:
        description: 'Run as a scheduled attempt (window rules apply). Set by the allfantasy-cron service.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Report the lag without moving the branch'
        required: false
        default: false
        type: boolean
      force:
        description: 'Advance even though worker-release moved in the last 6 hours (say why below)'
        required: false
        default: false
        type: boolean
      reason:
        description: 'Why this cron change cannot wait for the morning advance (required with force)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  # write, not read: a scheduled attempt outside the window cancels its own run (see the first step).
  actions: write

concurrency:
  group: worker-release
  cancel-in-progress: false

jobs:
  advance:
    name: Fast-forward worker-release to main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A scheduled attempt (or a catch-up dispatched by allfantasy-cron) runs only inside the quiet window, and only if no earlier attempt has
      # already advanced today. It stands down by CANCELLING itself, never by succeeding: the backup
      # check below reads "a successful run in the last 3 hours" as "already advanced", so a skip
      # that exited 0 would make the next attempt skip too, and the day would go by with nothing
      # deployed. The decision itself is scripts/worker-release-window.mjs, which is unit-tested.
      - name: Scheduled attempt - inside the quiet window, and not already done
        id: window
        if: github.event_name == 'schedule' || inputs.catchup == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow worker-release.yml --status success \
            --limit 20 --json databaseId,createdAt \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].createdAt // empty")
          verdict=$(node scripts/worker-release-window.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --last-success "${last:-none}")
          echo "$verdict"
          case "$verdict" in
            run*) exit 0 ;;
            *)
              echo "::notice::$verdict"
              gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
              # The cancel lands asynchronously; stop here so nothing below runs meanwhile.
              sleep 60
              exit 1 ;;
          esac

      # 🛑 THE DAILY CADENCE IS ONLY REAL IF HAND DISPATCHES ARE RARE. On 2026-11-22 this workflow
      # ran 12 times in 24 hours, 11 of them hand-dispatched (every one by sessions using the owner's
      # token, each reasonably wanting its own cron fix live), so the worker redeployed roughly every
      # two hours and two of those builds overlapped and hung. A manual run inside the cooldown is
      # now refused unless it says why. The scheduled run is never refused.
      - name: Refuse a manual advance inside the cooldown
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.catchup != true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          REASON: ${{ inputs.reason }}
          COOLDOWN_HOURS: '6'
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            if [ -z "${REASON// /}" ]; then
              echo "::error::force=true needs a reason, so the next person can tell why the worker redeployed."
              exit 1
            fi
            echo "Forced inside the cooldown. Reason: $REASON"
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow worker-release.yml --status success             --limit 20 --json databaseId,createdAt             --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].createdAt // empty")
          if [ -z "$last" ]; then
            echo "No earlier successful advance found; proceeding."
            exit 0
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "Last successful advance: $last (${age_h}h ago). Cooldown: ${COOLDOWN_HOURS}h."
          if [ "$age_h" -lt "$COOLDOWN_HOURS" ]; then
            echo "::error::worker-release advanced ${age_h}h ago. Every advance redeploys the cron worker and"
            echo "::error::kills in-flight cron requests. Wait for the morning run (13:20 UTC), or re-run with"
            echo "::error::force=true and a reason if this cron change genuinely cannot wait."
            exit 1
          fi

      - name: Report lag and fast-forward
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          git fetch origin main --quiet

          if git rev-parse --verify --quiet origin/worker-release >/dev/null; then
            behind=$(git rev-list --count origin/worker-release..origin/main)
            ahead=$(git rev-list --count origin/main..origin/worker-release)
            echo "worker-release is $behind commit(s) behind main and $ahead ahead."
            if [ "$ahead" -ne 0 ]; then
              echo "::error::worker-release has $ahead commit(s) main does not. This branch is only"
              echo "::error::ever written by this workflow, so that means a manual push. Refusing to"
              echo "::error::fast-forward -- resolve it deliberately rather than losing that work."
              exit 1
            fi
            if [ "$behind" -eq 0 ]; then
              echo "Already up to date. No push, so no rebuild and nothing billed."
              exit 0
            fi
          else
            echo "worker-release does not exist yet; creating it at main."
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "--dry-run: branch not moved."
            exit 0
          fi

          # No --force. A non-fast-forward is a finding, not something to push through.
          git push origin "origin/main:refs/heads/worker-release"
          echo "worker-release now at $(git rev-parse --short origin/main)."
