# Neon: delete a PR's preview database branch when the PR closes, and sweep daily for any that
# outlived their PR.
#
# 🛑 IT NO LONGER CREATES THEM (2026-09-22). The `create_neon_branch` job made a
# `preview/pr-<n>-*` branch on every PR open/push, and NOTHING EVER CONNECTED TO ONE: its
# `db_url` outputs and the `prisma migrate deploy` step were commented out, and no workflow,
# script or config read the branch. They were pure cost. The leak described below put ~50 extra
# branches on the bill around the clock — "Extra branches: 39,471 hours, $82.23" in September to
# the 21st — and the Launch plan includes 10 branches per project, not Scale's 25.
#
# Before bringing creation back, give the branch a consumer (migrations, an e2e lane) in the SAME
# change. The delete job and the sweep stay, to clean up what earlier PRs left.
#
# ⚠ THIS HEADER USED TO CALL THE DELETE JOB "HARMLESS WHEN THERE IS NOTHING TO FIND", AND IT WAS
# NOT. It used `neondatabase/delete-branch-action`, which exits 1 when the branch is missing — so
# once creation stopped, every PR opened after 2026-09-22 went red on close with
# `ERROR: Branch preview/pr-<n>-… not found.` (first seen on #1224's close, 2026-09-24). The job
# now treats exactly that message, for exactly this PR's branch, as "nothing to delete", and still
# fails on anything else — a wrong project, bad credentials, an API outage.
#
# Requires repository secrets/variables from Neon GitHub integration:
#   - secrets.NEON_API_KEY
#   - vars.NEON_PROJECT_ID
#
# 🛑 WHY THE DAILY SWEEP EXISTS, GIVEN THE DELETE JOB ALREADY WORKS. On 2026-09-20 this project
# held 71 preview branches, 67 for PRs long closed — 124 GB, the oldest from 2026-05-01. The
# delete job below was present the whole time (added 2026-04-16, never edited) and is healthy:
# 295 of the last 300 runs succeeded, none cancelled.
#
# ⚠ AND THE PER-EVENT CAUSE IS UNKNOWN. Two explanations were checked and BOTH DISPROVEN. The
# computed name `preview/pr-<n>-<head with / → ->` matches the stored Neon name exactly for all
# nine leaked branches, so it was not a name mismatch; and no run has ever been cancelled, so
# concurrency eviction did not eat them. The runs from the days that leaked are past retention.
#
# An event handler is best-effort: a missed webhook, an API blip, or a re-run of an old create
# job leaves a branch with nothing to notice. The sweep asserts the invariant instead — no
# preview branch outlives its PR — so a miss self-heals whatever caused it.
#
# Docs: https://neon.tech/docs/guides/neon-github-integration

name: Neon — PR preview database branch

on:
  pull_request:
    types:
      # Only `closed`: this workflow no longer CREATES branches (see header), it only removes the
      # ones earlier PRs left behind.
      - closed
  schedule:
    # Daily. A sweep that runs after the leak has grown is still a sweep.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete the branches it finds (off = report only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      head_branch: ${{ steps.names.outputs.current_branch }}
    steps:
      - name: Resolve head branch name
        id: names
        uses: tj-actions/branch-names@v9
        with:
          # Neon branch names must not rely on raw slashes from git (e.g. feature/foo).
          replace_slashes_with_hyphens: 'true'

  delete_neon_branch:
    name: Delete Neon branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 🛑 THE BRANCH NAME REACHES THE SCRIPT THROUGH `env:`, NEVER `${{ }}` INSIDE `run:`. A git
      # branch name may legally contain `$(…)`, backticks and `;`, and an expression interpolated
      # into a script is pasted in before bash parses it — a named branch would become a command.
      # From an environment variable it is only ever data.
      #
      # ⚠ ONLY "Branch <this exact name> not found" COUNTS AS NOTHING TO DO. A looser `not found`
      # would also pass "project not found" (a wrong NEON_PROJECT_ID) and turn a broken cleanup into
      # a green one. neonctl reads NEON_API_KEY from the environment; the key is never echoed.
      - name: Delete Neon branch (if one was ever made)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH: preview/pr-${{ github.event.pull_request.number }}-${{ needs.setup.outputs.head_branch }}
        run: |
          if out=$(npx -y neonctl@2 branches delete "$BRANCH" --project-id "$NEON_PROJECT_ID" 2>&1); then
            echo "Deleted $BRANCH."
            exit 0
          fi
          if printf '%s\n' "$out" | grep -qF "Branch $BRANCH not found"; then
            echo "No preview branch $BRANCH for this PR — nothing to delete."
            exit 0
          fi
          printf '%s\n' "$out"
          exit 1

  # The reconciler. Reads every branch, asks GitHub for each PR's state, and deletes only the
  # `preview/pr-*` ones whose PR is closed or merged. Every other case — open, unknown, a named
  # branch, anything primary/default/protected — is kept; see the refusal rules and their tests
  # in scripts/neon-prune-preview-branches.mjs and __tests__/neon-prune-preview-branches.test.ts.
  sweep_orphans:
    name: Sweep orphaned preview branches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ⚠ A SCHEDULED RUN APPLIES; A HAND-RUN REPORTS UNLESS ASKED. Turning the destructive mode
      # on by default for `workflow_dispatch` would make "let me see what it would do" the
      # dangerous button.
      - name: Sweep
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +e
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/neon-prune-preview-branches.mjs --apply | tee sweep.log
          else
            node scripts/neon-prune-preview-branches.mjs | tee sweep.log
          fi
          RC=${PIPESTATUS[0]}
          { echo '```'; cat sweep.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
