# Neon: sweep daily for preview database branches that outlived their PR.
#
# 🛑 IT NO LONGER CREATES THEM (2026-09-22). The `create_neon_branch` job made a
# `preview/pr-<n>-*` branch on every PR open/push, and NOTHING EVER CONNECTED TO ONE: its
# `db_url` outputs and the `prisma migrate deploy` step were commented out, and no workflow,
# script or config read the branch. They were pure cost. The leak described below put ~50 extra
# branches on the bill around the clock — "Extra branches: 39,471 hours, $82.23" in September to
# the 21st — and the Launch plan includes 10 branches per project, not Scale's 25.
#
# Before bringing creation back, give the branch a consumer (migrations, an e2e lane) in the SAME
# change — and bring back a delete-on-close job with it (see git history for the last one).
#
# 🛑 AND IT NO LONGER RUNS ON PR CLOSE (2026-10-01). The `Branch name` + `Delete Neon branch` pair
# outlived the branches it deleted. Measured that day:
#   - every retained close-time run read "No preview branch … nothing to delete";
#   - zero open PRs predate the 2026-09-22 creation stop, so none can own a branch;
#   - Neon held three branches, none `preview/*` (production, import-test-sandbox,
#     staging-nfl-verify).
# Each close still queued two jobs on the account's shared runner pool, where they sat 30-52
# minutes behind PR CI to run for 2-3 seconds, holding NEON_API_KEY on a pull_request event to
# do nothing. The daily sweep below already asserts the invariant the pair approximated — no
# preview branch outlives its PR — so it alone covers any branch that ever appears again.
#
# Requires repository secrets/variables from Neon GitHub integration:
#   - secrets.NEON_API_KEY
#   - vars.NEON_PROJECT_ID
#
# Why a sweep and not an event handler: on 2026-09-20 this project held 71 preview branches, 67
# for PRs long closed — 124 GB — while the close-time delete job was present and 295 of its last
# 300 runs had succeeded. The per-event cause was never found (a name mismatch and concurrency
# eviction were both checked and disproven). An event handler is best-effort; the sweep
# self-heals whatever caused a miss.
#
# Docs: https://neon.tech/docs/guides/neon-github-integration

name: Neon — PR preview database branch

on:
  schedule:
    # Daily. A sweep that runs after the leak has grown is still a sweep.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete the branches it finds (off = report only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo. Jobs that
# need more declare it at job level.
permissions:
  contents: read

jobs:
  # The reconciler. Reads every branch, asks GitHub for each PR's state, and deletes only the
  # `preview/pr-*` ones whose PR is closed or merged. Every other case — open, unknown, a named
  # branch, anything primary/default/protected — is kept; see the refusal rules and their tests
  # in scripts/neon-prune-preview-branches.mjs and __tests__/neon-prune-preview-branches.test.ts.
  sweep_orphans:
    name: Sweep orphaned preview branches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ⚠ A SCHEDULED RUN APPLIES; A HAND-RUN REPORTS UNLESS ASKED. Turning the destructive mode
      # on by default for `workflow_dispatch` would make "let me see what it would do" the
      # dangerous button.
      - name: Sweep
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +e
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/neon-prune-preview-branches.mjs --apply | tee sweep.log
          else
            node scripts/neon-prune-preview-branches.mjs | tee sweep.log
          fi
          RC=${PIPESTATUS[0]}
          { echo '```'; cat sweep.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
