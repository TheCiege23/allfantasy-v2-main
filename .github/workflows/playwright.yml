name: Playwright Tests

# ⚠ WHICH OF THESE JOBS ACTUALLY BLOCK A MERGE, AND WHY IT IS NOT ALL OF THEM.
#
# Branch protection is invisible from inside the repo, so it is written down
# here. On `main` these lanes are REQUIRED:
#
#   Draft Room Regression
#   Playwright (retention-engagement)
#   Playwright (onboarding-activation)
#   Playwright (referral-growth-db)
#
# These three are NOT required, deliberately:
#
#   Playwright (core 1/3), (core 2/3), (core 3/3)
#
# They have been red on main continuously — 50 failures at last count — so
# requiring them today would block every merge in the repo rather than protect
# anything. The four above were measured green on five consecutive completed
# runs across main and four different feature branches before being added.
#
# ⚠ THE POINT OF REQUIRING ANYTHING IS THE REGRESSION THAT GOT THROUGH. When
# /pricing was rebuilt as PricingV4 it dropped the data-testid contract the
# monetization suite drives, and the purchase flow silently lost its e2e
# coverage. Nobody noticed, because the shards were already red and advisory. A
# suite that never blocks is a suite nobody reads.
#
# So: when the core shards go green, add them here AND to branch protection in
# the same change. Until then, do not assume a green PR means the core lane
# passed — it means the core lane was not consulted.
on:
  push:
    branches: [ main, master ]
  pull_request:
    # No `branches:` filter on purpose. Filtering PR runs to base
    # main/master silently skipped every stacked PR (a PR based on
    # another branch), so those merged with no real check coverage.
# Cancel a PR's previous Playwright run when the branch is updated.
#
# Branch protection requires a PR to be up to date with main before it can merge, so every merge
# forces an update on every other open PR — and without this, each update started a fresh 7-job run
# while the superseded one kept running to completion. With a dozen PRs open, those runs starved
# each other for runners: the jobs themselves were fine, but the required lanes listed at the top
# of this file sat queued behind the core shards, which nothing required and which do not gate them.
#
# cancel-in-progress is scoped to pull_request on purpose. Pushes to main must always run to
# completion — cancelling those would leave main's status ambiguous, which is worse than the cost.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Playwright (${{ matrix.label }})
    # Core e2e exceeded GitHub's 6h single-job cap; shard into 3 parallel jobs (each << 6h).
    # Bracket key matches matrix include (required for this workflow file).
    timeout-minutes: ${{ matrix['job-timeout'] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'core 1/3'
            lane: core-shard-1
            shard: '1/3'
            job-timeout: 180
          - label: 'core 2/3'
            lane: core-shard-2
            shard: '2/3'
            job-timeout: 180
          - label: 'core 3/3'
            lane: core-shard-3
            shard: '3/3'
            job-timeout: 180
          - label: retention-engagement
            lane: retention-engagement
            job-timeout: 60
          - label: onboarding-activation
            lane: onboarding-activation
            job-timeout: 60
          - label: referral-growth-db
            lane: referral-growth-db
            job-timeout: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allfantasy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allfantasy_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.19.0
        # Restore the npm cache. Without this every job in every run re-downloaded all ~685
        # packages from the registry before it could start doing anything useful.
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run foundation apply branch tests
      if: matrix.lane == 'referral-growth-db'
      run: npm run test:foundation-apply-branches
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ startsWith(matrix.lane, 'core-shard-') && 'all' || 'chromium' }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      if: startsWith(matrix.lane, 'core-shard-')
      run: npx playwright install --with-deps
    - name: Install Playwright Chromium
      if: matrix.lane == 'referral-growth-db' || matrix.lane == 'onboarding-activation' || matrix.lane == 'retention-engagement'
      run: npx playwright install --with-deps chromium
    # Schema bootstrap — applied to both `referral-growth-db` (always
    # needed) and `core` (added in fix/ci-playwright-core-schema-bootstrap).
    # Without these steps, the `core` lane hits 60-min `timeout-minutes`
    # because every Playwright test that exercises auth fails on
    # `relation "public.app_users" does not exist`. Other lanes
    # (retention-engagement, onboarding-activation) currently pass without
    # bootstrap and are intentionally NOT widened here — keep this fix
    # surgical to the lane it's known to break on.
    - name: Prepare DB schema
      if: matrix.lane == 'referral-growth-db' || matrix.lane == 'onboarding-activation' || startsWith(matrix.lane, 'core-shard-')
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      run: npx prisma db push --skip-generate
    - name: Apply platform-backend foundation SQL
      if: matrix.lane == 'referral-growth-db' || matrix.lane == 'onboarding-activation' || startsWith(matrix.lane, 'core-shard-')
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      run: npm run db:foundation:apply
    - name: Apply platform-backend supplemental indexes
      if: matrix.lane == 'referral-growth-db' || startsWith(matrix.lane, 'core-shard-')
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      run: npm run db:indexes:platform-backend
    - name: Verify platform-backend indexes
      if: matrix.lane == 'referral-growth-db' || startsWith(matrix.lane, 'core-shard-')
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      run: npm run db:indexes:verify-platform-backend
    - name: Run Playwright tests (core)
      if: startsWith(matrix.lane, 'core-shard-')
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        NEXTAUTH_SECRET: ci-nextauth-secret
        NEXTAUTH_URL: http://localhost:3000
        # Every @admin test signs in through POST /api/auth/login, and that route
        # accepts a password ONLY when ADMIN_PASSWORD or ADMIN_PASSWORD_HASH is
        # set on the SERVER (app/api/auth/login/route.ts). Neither was set here,
        # so the route returned 401 to every attempt, the shared helper failed on
        # `admin login failed`, and the whole @admin tag went red on every run.
        #
        # This is not a credential. It is a throwaway value for an ephemeral
        # server on a CI runner, and it has to match the default the helper posts
        # (e2e/helpers/admin-timezone-smoke.ts). The real admin password lives in
        # Vercel's project settings and never appears in this repo.
        ADMIN_PASSWORD: admin123
      run: npm run test:e2e:core -- --shard=${{ matrix.shard }}
    - name: Run Playwright tests (retention engagement)
      if: matrix.lane == 'retention-engagement'
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        NEXTAUTH_SECRET: ci-nextauth-secret
        NEXTAUTH_URL: http://localhost:3000
      run: npm run test:e2e:retention
    - name: Run Playwright tests (onboarding activation)
      if: matrix.lane == 'onboarding-activation'
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        NEXTAUTH_SECRET: ci-nextauth-secret
        NEXTAUTH_URL: http://localhost:3000
      run: npm run test:e2e:onboarding-activation
    - name: Run Playwright tests (referral growth db)
      if: matrix.lane == 'referral-growth-db'
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        NEXTAUTH_SECRET: ci-nextauth-secret
        NEXTAUTH_URL: http://localhost:3000
      run: npx playwright test e2e/referral-growth-suite.spec.ts --project=chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.lane }}
        path: playwright-report/
        retention-days: 30

  draft-room-regression:
    name: Draft Room Regression
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allfantasy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allfantasy_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.19.0
        # Restore the npm cache. Without this every job in every run re-downloaded all ~685
        # packages from the registry before it could start doing anything useful.
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Prepare DB schema
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      run: npx prisma db push --skip-generate
    - name: Apply platform-backend foundation SQL
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      run: npm run db:foundation:apply
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Prepare DB schema for draft-room regression
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      run: npx prisma db push --skip-generate
    - name: Apply platform-backend foundation SQL
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
      run: npm run db:foundation:apply
    - name: Run draft-room regression
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/allfantasy_ci
        NEXTAUTH_SECRET: ci-nextauth-secret
        NEXTAUTH_URL: http://localhost:3000
      run: npm run test:e2e:draft-room:chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-draft-room
        path: playwright-report/
        retention-days: 30
