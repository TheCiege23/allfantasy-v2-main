name: Draft Pool Data-Quality Nightly Sweep

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    name: Draft Pool Data-Quality Sweep (11 checks / all leagues)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run draft-pool multi-league sweep
        id: sweep
        shell: bash
        run: |
          set -o pipefail
          npm run draft-pool:sweep-multi-league 2>&1 | tee draft-pool-sweep.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload sweep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-pool-sweep-${{ github.run_number }}
          path: draft-pool-sweep.log
          retention-days: 14

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Auto] Draft pool data-quality sweep FAILED — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Draft Pool Data-Quality Sweep Failed',
              '',
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'One or more leagues failed the 11-check data-quality gate.',
              'Check the uploaded `draft-pool-sweep-*.log` artifact for per-league details.',
              '',
              '### Remediation',
              '```bash',
              '# Re-warm affected leagues',
              'npm run draft-pool:cache:warm -- --leagueId <id>',
              '',
              '# Apply Sleeper ID backfill if identityMissingSleeperForward > 0',
              'npm run draft-pool:backfill-blocked-sleeper-ids -- --leagueId <id> --apply',
              '',
              '# Re-run sweep to confirm',
              'npm run draft-pool:sweep-multi-league',
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['data-quality', 'draft-pool', 'automated'],
            });

  # ---------------------------------------------------------------------------------------
  # A SECOND, INDEPENDENT JOB — deliberately not a step in the sweep above.
  #
  # It needs no database, no npm install and no secrets (it reads a committed JSON file and a
  # clock), so it must not be gated behind a 15-minute DB sweep, and a stale artifact must not
  # stop that sweep from running either. Separate jobs, separate verdicts.
  #
  # WHY A CHECK RATHER THAN A REFRESH. Both artifacts it covers -- nfl-draft-capital.json and
  # team-defense-tendencies.json -- are STATICALLY IMPORTED, so they are bundled at build time.
  # A scheduled job on the deployed app would write to an ephemeral filesystem and change
  # nothing that is running. Only a human regenerating and committing updates them. This exists
  # so the day that stops happening is a red run rather than silence -- the `ingestCFBDStats`
  # failure, where a writer nobody scheduled fed a surface that kept serving stale data and
  # looked correct doing it.
  static-data-freshness:
    name: Committed data/ artifacts are current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check committed data/ artifacts include the latest completed period
        run: node scripts/check-static-data-freshness.mjs
